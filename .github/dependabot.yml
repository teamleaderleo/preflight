version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /preflight-desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desktop-npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /report-intake
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      report-intake-npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /preflight-desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desktop-cargo-dependencies:
        patterns:
          - "*"
