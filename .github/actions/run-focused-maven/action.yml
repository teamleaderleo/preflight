name: Run focused Maven suite
description: Run one focused unit-test selector through the pinned Maven Wrapper while retaining a readable log.

inputs:
  modules:
    description: Maven -pl value. Keep it visible at the workflow call site.
    required: true
  unit-tests:
    description: Maven -Dtest selector. Keep the regression selector visible at the workflow call site.
    required: true
  goal:
    description: Maven lifecycle goal for the focused suite.
    required: false
    default: test
  log-file:
    description: Repository-relative file that receives Maven stdout/stderr.
    required: true

runs:
  using: composite
  steps:
    - name: Run focused Maven selector
      shell: bash
      run: |
        set -euo pipefail
        log_file='${{ inputs.log-file }}'
        mkdir -p "$(dirname "$log_file")"

        set +e
        ./mvnw --batch-mode --no-transfer-progress \
          -pl '${{ inputs.modules }}' -am \
          '-Dtest=${{ inputs.unit-tests }}' \
          -Dsurefire.failIfNoSpecifiedTests=false \
          '${{ inputs.goal }}' > "$log_file" 2>&1
        status=$?
        set -e

        cat "$log_file"
        exit "$status"
