name: Issue 1153 pilot tooling gate

on:
  push:
    branches:
      - lantern/1153-render-sync
    paths:
      - '.github/workflows/issue-1153-pilot-tooling-gate.yml'
      - 'scripts/run-gameplay-pilot.sh'
      - 'scripts/run-1153-render-pilot.sh'
      - 'scripts/compare-1153-render-pilots.sh'

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax and help paths
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run-gameplay-pilot.sh
          bash -n scripts/run-1153-render-pilot.sh
          bash -n scripts/compare-1153-render-pilots.sh
          scripts/run-gameplay-pilot.sh --help >/dev/null
          scripts/run-1153-render-pilot.sh --help >/dev/null
      - name: Comparator fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/baseline.json" <<'JSON'
          {"issue":1153,"experiment":"tess-array","variant":"baseline","route":"ordinary","workloadId":"fixture","commit":"base","measurementOverhead":{"averageMicros":1.0},"combatAfterCampaignActive":{"frames":1000,"averageFps":50,"p50Micros":20000,"p95Micros":30000,"p99Micros":40000,"onePercentLowFps":25,"over50Per1000":10,"over100Per1000":2},"candidate":{"enabled":false},"transformationsApplied":0,"containedFailures":0}
          JSON
          cat > "$RUNNER_TEMP/candidate.json" <<'JSON'
          {"issue":1153,"experiment":"tess-array","variant":"candidate","route":"ordinary","workloadId":"fixture","commit":"candidate","measurementOverhead":{"averageMicros":1.2},"combatAfterCampaignActive":{"frames":1000,"averageFps":55,"p50Micros":19000,"p95Micros":28000,"p99Micros":35000,"onePercentLowFps":28.57,"over50Per1000":7,"over100Per1000":1},"candidate":{"enabled":true,"vertices":100},"transformationsApplied":1,"containedFailures":0}
          JSON
          scripts/compare-1153-render-pilots.sh "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/candidate.json" "$RUNNER_TEMP/comparison.json" >/dev/null
          jq -e '.averageFps.delta == 5 and .p99Micros.delta == -5000 and .over50Per1000.delta == -3 and .candidateTransformationsApplied == 1' "$RUNNER_TEMP/comparison.json" >/dev/null
      - name: Exact GraphicsLib target generation
        shell: bash
        run: |
          set -euo pipefail
          fake_game="$RUNNER_TEMP/game"
          mkdir -p "$fake_game/mods/GraphicsLib/jars"
          curl --fail --location --retry 3 \
            --output "$fake_game/mods/GraphicsLib/jars/Graphics.jar" \
            'https://raw.githubusercontent.com/ZMKiller/starsector-ru-mods/6e16cb47ee0bf8e3ac01e2121b5527083c744dca/GraphicsLib/jars/Graphics.jar'
          test "$(sha256sum "$fake_game/mods/GraphicsLib/jars/Graphics.jar" | awk '{print $1}')" = '832064013fe853731941e547842884ba121fb8b20eff08d24137f7a2c916903a'

          cp scripts/run-gameplay-pilot.sh "$RUNNER_TEMP/run-gameplay-pilot.sh"
          cat > scripts/run-gameplay-pilot.sh <<'STUB'
          #!/usr/bin/env bash
          set -euo pipefail
          pilot="$RUNNER_TEMP/fake-pilot"
          mkdir -p "$pilot"
          echo "Full pilot data: $pilot"
          STUB
          chmod +x scripts/run-gameplay-pilot.sh
          export STARSECTOR_PREFLIGHT_HOME="$RUNNER_TEMP/state"
          scripts/run-1153-render-pilot.sh \
            --experiment tess-array \
            --variant baseline \
            --route ordinary \
            --workload-id ci-fixture \
            --game "$fake_game" >/dev/null
          targets="$(find "$STARSECTOR_PREFLIGHT_HOME/issue-1153" -name adapter-targets.txt -print -quit)"
          test -f "$targets"
          grep -Fx 'class org/dark/graphics/util/Tessellate' "$targets"
          grep -Fx 'source-sha256 832064013fe853731941e547842884ba121fb8b20eff08d24137f7a2c916903a' "$targets"
          grep -Fx 'plan lwjgl-display-frame-time-probe-v1' "$targets"
          class_sha="$(unzip -p "$fake_game/mods/GraphicsLib/jars/Graphics.jar" org/dark/graphics/util/Tessellate.class | sha256sum | awk '{print $1}')"
          grep -Fx "sha256 $class_sha" "$targets"
          mv "$RUNNER_TEMP/run-gameplay-pilot.sh" scripts/run-gameplay-pilot.sh
