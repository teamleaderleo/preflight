name: Desktop smoke driver boundaries

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/desktop-smoke-drivers.yml'
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/*DesktopSmoke*.java'
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/DesktopBridgeCommand.java'
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/DesktopCommandExecutor.java'
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/SystemDesktopCommandExecutor.java'
      - 'preflight-cli/src/test/java/dev/starsector/preflight/cli/*DesktopSmoke*.java'
      - 'preflight-cli/pom.xml'
      - 'pom.xml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-smoke-drivers.yml'
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/*DesktopSmoke*.java'
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/DesktopBridgeCommand.java'
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/DesktopCommandExecutor.java'
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/SystemDesktopCommandExecutor.java'
      - 'preflight-cli/src/test/java/dev/starsector/preflight/cli/*DesktopSmoke*.java'
      - 'preflight-cli/pom.xml'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - name: Verify PID-addressed desktop driver boundaries
        shell: bash
        run: >-
          mvn --batch-mode --no-transfer-progress
          -pl preflight-cli -am
          -Dtest=DesktopSmokeScenarioTest,DesktopSmokeEvidenceTest,DesktopSmokeRunnerTest,DesktopSmokeLaunchTest,MacDesktopSmokeDriverTest,WindowsDesktopSmokeDriverTest,LinuxDesktopSmokeDriverTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
