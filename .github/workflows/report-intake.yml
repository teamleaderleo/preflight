name: Prepare report intake lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/report-intake/vitest-5.0.3

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: report-intake/package-lock.json

      - name: Refresh dependency lockfile
        working-directory: report-intake
        run: npm install --package-lock-only

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report-intake/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(report-intake): sync dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
