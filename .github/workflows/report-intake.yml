name: Private report intake

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/report-intake.yml'
      - 'report-intake/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-intake.yml'
      - 'report-intake/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-intake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: report-intake/package-lock.json

      - run: npm ci

      - name: Verify generated bindings
        shell: bash
        run: |
          npm run cf-typegen
          git diff --exit-code -- worker-configuration.d.ts

      - name: Verify Worker boundary
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build production Worker without deploying
        run: npx wrangler deploy --dry-run --outdir dist
