name: Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 17
        uses: ./.github/actions/setup-build-jdk

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Assemble distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp preflight-cli/target/preflight.jar dist/preflight.jar
          (
            cd dist
            sha256sum preflight.jar > preflight.jar.sha256
          )
          cat > dist/README.txt <<'TEXT'
          Starsector Preflight
          ====================

          Requires Java 17 or newer.

          Discover and launch Starsector:
              java -jar preflight.jar run

          Check discovery without launching:
              java -jar preflight.jar doctor

          Install a convenient platform launcher:
              java -jar preflight.jar install

          Verify this download on macOS or Linux:
              shasum -a 256 -c preflight.jar.sha256

          Verify on Windows PowerShell:
              (Get-FileHash .\preflight.jar -Algorithm SHA256).Hash.ToLower()

          Project documentation:
              https://github.com/teamleaderleo/starsector-preflight
          TEXT
          tar -C dist -czf dist/starsector-preflight.tar.gz preflight.jar preflight.jar.sha256 README.txt
          (
            cd dist
            zip -q starsector-preflight.zip preflight.jar preflight.jar.sha256 README.txt
          )
          sha256sum dist/starsector-preflight.tar.gz dist/starsector-preflight.zip > dist/archives.sha256

      - name: Smoke-test packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          java -jar dist/preflight.jar --help
          java -jar dist/preflight.jar doctor --game "$RUNNER_TEMP/does-not-exist" >/dev/null 2>&1 || test $? -eq 3

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: starsector-preflight-${{ github.run_id }}
          path: |
            dist/preflight.jar
            dist/preflight.jar.sha256
            dist/starsector-preflight.tar.gz
            dist/starsector-preflight.zip
            dist/archives.sha256
            dist/README.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/preflight.jar \
            dist/preflight.jar.sha256 \
            dist/starsector-preflight.tar.gz \
            dist/starsector-preflight.zip \
            dist/archives.sha256 \
            dist/README.txt \
            --verify-tag \
            --generate-notes \
            --title "Starsector Preflight $GITHUB_REF_NAME"

  desktop:
    name: Desktop / ${{ matrix.name }}
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            bundles: deb,appimage
          - name: macOS
            os: macos-latest
            bundles: dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 17
        uses: ./.github/actions/setup-build-jdk

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: preflight-desktop
        run: npm ci

      - name: Test frontend and prepare desktop engine
        working-directory: preflight-desktop
        shell: bash
        run: |
          npm test
          npm run engine:prepare
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build native desktop package
        working-directory: preflight-desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect native package and checksum
        working-directory: preflight-desktop
        run: npm run desktop:collect

      - name: Upload desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: starsector-preflight-${{ matrix.name }}-${{ github.run_id }}
          path: preflight-desktop/desktop-dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Add desktop package to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find preflight-desktop/desktop-dist -type f -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
