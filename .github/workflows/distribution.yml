name: Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tagged-release signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PREFLIGHT_UPDATER_PUBLIC_KEY: ${{ vars.PREFLIGHT_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for a tag"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required for a tag"; exit 1; }
          test -n "$PREFLIGHT_UPDATER_PUBLIC_KEY" || { echo "::error::PREFLIGHT_UPDATER_PUBLIC_KEY is required for a tag"; exit 1; }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify source and history boundary
        run: python3 scripts/verify_source_boundary.py

      - name: Validate tagged-release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node preflight-desktop/scripts/validate-release-version.mjs "$GITHUB_REF_NAME"

      - name: Set up Java 17
        uses: ./.github/actions/setup-build-jdk

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Generate release dependency inventories
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          scripts/generate-release-sboms.sh "$RUNNER_TEMP/preflight-sboms"

      - name: Assemble distribution
        run: scripts/assemble-core-release.sh dist "$RUNNER_TEMP/preflight-sboms"

      - name: Smoke-test packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          java -jar dist/preflight.jar --help
          java -jar dist/preflight.jar doctor --game "$RUNNER_TEMP/does-not-exist" >/dev/null 2>&1 || test $? -eq 3

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-release-core-${{ github.run_id }}
          path: |
            dist/preflight.jar
            dist/preflight.jar.sha256
            dist/preflight.tar.gz
            dist/preflight.zip
            dist/archives.sha256
            dist/README.txt
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/PRIVACY.md
            dist/KNOWN_LIMITATIONS.md
            dist/DEPENDENCY_INVENTORY.md
            dist/SBOM-SHA256SUMS.txt
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Desktop / ${{ matrix.name }}
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # Tauri's AppImage toolchain targets 22.04; it also gives the package an older
            # glibc compatibility floor than the moving ubuntu-latest runner.
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: macOS
            os: macos-latest
            bundles: dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: ./.github/actions/setup-build-jdk

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: preflight-desktop
        run: npm ci

      - name: Download verified engine JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-release-core-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-verified-core

      - name: Stage verified engine JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-cli/target
          cp "$RUNNER_TEMP/preflight-verified-core/preflight.jar" preflight-cli/target/preflight.jar

      - name: Test frontend and prepare desktop engine
        working-directory: preflight-desktop
        shell: bash
        run: |
          npm run engine:prepare:verified
          npm test
          npm run test:release
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Write signed updater configuration
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: preflight-desktop
        env:
          PREFLIGHT_UPDATER_PUBLIC_KEY: ${{ vars.PREFLIGHT_UPDATER_PUBLIC_KEY }}
        run: node scripts/write-updater-config.mjs src-tauri/target/release-updater-config.json

      - name: Reverify bounded desktop engine
        working-directory: preflight-desktop
        run: npm run engine:verify

      - name: Build native desktop package
        if: runner.os != 'Linux' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: preflight-desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Build signed native desktop package
        if: runner.os != 'Linux' && startsWith(github.ref, 'refs/tags/v')
        working-directory: preflight-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PREFLIGHT_UPDATER_PUBLIC_KEY: ${{ vars.PREFLIGHT_UPDATER_PUBLIC_KEY }}
        run: npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/target/release-updater-config.json

      - name: Build Linux Debian package
        if: runner.os == 'Linux'
        working-directory: preflight-desktop
        env:
          PREFLIGHT_UPDATER_PUBLIC_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PREFLIGHT_UPDATER_PUBLIC_KEY || '' }}
        run: npx tauri build --bundles deb

      - name: Build Linux AppImage
        if: runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: preflight-desktop
        env:
          # linuxdeploy scans the bundled jlink runtime as part of the AppDir. Its dependency
          # resolver does not infer the JVM's private server directory, so expose the existing
          # libjvm.so while it validates those ELF files.
          LD_LIBRARY_PATH: ${{ github.workspace }}/preflight-desktop/src-tauri/target/engine/runtime/lib/server
        run: npx tauri bundle --verbose --bundles appimage

      - name: Build signed Linux AppImage
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        working-directory: preflight-desktop
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/preflight-desktop/src-tauri/target/engine/runtime/lib/server
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PREFLIGHT_UPDATER_PUBLIC_KEY: ${{ vars.PREFLIGHT_UPDATER_PUBLIC_KEY }}
        run: npx tauri bundle --verbose --bundles appimage --config src-tauri/target/release-updater-config.json

      - name: Verify extracted native package contents
        working-directory: preflight-desktop
        env:
          PREFLIGHT_REQUIRE_PLATFORM_SIGNATURE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          PREFLIGHT_SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run desktop:verify-package

      - name: Exercise native installation and removal
        if: runner.os != 'macOS'
        working-directory: preflight-desktop
        run: npm run desktop:exercise-install

      - name: Collect native package and checksum
        working-directory: preflight-desktop
        env:
          PREFLIGHT_SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run desktop:collect

      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-release-${{ matrix.name }}-${{ github.run_id }}
          path: preflight-desktop/desktop-dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish complete signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [distribution, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: preflight-release-*-${{ github.run_id }}
          path: release-input
          merge-multiple: true

      - name: Build signed update feed
        shell: bash
        run: |
          set -euo pipefail
          node preflight-desktop/scripts/build-updater-manifest.mjs \
            release-input "$GITHUB_REF_NAME" release-input/latest.json

      - name: Preserve complete release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-complete-release-${{ github.run_id }}
          path: release-input/*
          if-no-files-found: error
          retention-days: 30

      - name: Stage and publish complete tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-input/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Preflight $GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false
