name: Desktop rendered layout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - name: Build browser frontend
        working-directory: preflight-desktop
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        run: |
          python3 -m pip install --disable-pip-version-check \
            -r preflight-desktop/scripts/ui-layout-requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Exercise rendered layouts and transitions
        working-directory: preflight-desktop
        run: |
          python3 scripts/verify-ui-layout.py \
            --output-dir "$RUNNER_TEMP/preflight-ui-matrix"

      - name: Upload rendered matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-ui-matrix-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-ui-matrix
          if-no-files-found: warn
          retention-days: 7
