name: Benchmark claim provenance

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/claims.json'
      - 'docs/release-readiness.md'
      - 'docs/optimization-history.md'
      - 'docs/startup-benchmark.md'
      - 'docs/evidence/**'
      - 'scripts/verify_claims.py'
      - 'scripts/test_verify_claims.py'
      - '.github/workflows/claims.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'README.md'
      - 'docs/claims.json'
      - 'docs/release-readiness.md'
      - 'docs/optimization-history.md'
      - 'docs/startup-benchmark.md'
      - 'docs/evidence/**'
      - 'scripts/verify_claims.py'
      - 'scripts/test_verify_claims.py'
      - '.github/workflows/claims.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test claim validator
        run: python3 scripts/test_verify_claims.py
      - name: Verify current claims
        run: python3 scripts/verify_claims.py
