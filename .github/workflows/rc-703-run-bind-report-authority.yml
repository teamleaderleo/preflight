name: RC 703 run report authority bind

on:
  push:
    branches:
      - fix/desktop-report-authority

permissions:
  contents: write

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-report-authority
          fetch-depth: 0
      - name: Apply committed transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/rc-703-bind-report-authority.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'rc-703-bind-report-authority', 'exec'), {})

          authority = Path('preflight-desktop/src-tauri/src/report_authority.rs')
          text = authority.read_text().replace(
              'Could not create saved report authority: {error}',
              'Could not create saved report authority in protected report storage: {error}',
          )
          authority.write_text(text)
          PY
          cd preflight-desktop/src-tauri
          cargo fmt --all
          cargo metadata --format-version 1 >/dev/null
          cd ../..
          git diff --check
      - name: Commit production source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preflight-desktop/src-tauri/src/report_authority.rs \
                  preflight-desktop/src-tauri/src/reports.rs \
                  preflight-desktop/src-tauri/Cargo.toml \
                  preflight-desktop/src-tauri/Cargo.lock
          git commit -m "fix(desktop): bind report authority to opened directories"
          git push origin HEAD:fix/desktop-report-authority
