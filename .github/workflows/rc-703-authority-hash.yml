name: Report #703 authority digest

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rc-703-authority-hash.yml'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Print normalized source digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          path = Path('preflight-desktop/src-tauri/src/report_authority.rs')
          data = path.read_text().replace('\r\n', '\n').encode()
          print('REPORT_AUTHORITY_SHA256', sha256(data).hexdigest())
          PY
