name: Apply reviewed #703 rustfmt

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rc-703-rustfmt-diagnostic.yml'

permissions:
  contents: write

jobs:
  rustfmt:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/desktop-report-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Apply exact mechanical format and self-delete
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BLOB: b451db03bce53cb2f8c93c60efe369ecc5c815e7
          TARGET: preflight-desktop/src-tauri/src/report_authority.rs
          SELF: .github/workflows/rc-703-rustfmt-diagnostic.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object "$TARGET")" = "$EXPECTED_BLOB"

          cargo fmt --manifest-path preflight-desktop/src-tauri/Cargo.toml
          changed="$(git diff --name-only -- preflight-desktop/src-tauri/src)"
          test "$changed" = "$TARGET"
          git diff --check -- "$TARGET"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git rm "$SELF"

          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$SELF" "$TARGET" | sort)"
          test "$staged" = "$expected"

          git commit -m "style(reports): apply reviewed rustfmt"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
