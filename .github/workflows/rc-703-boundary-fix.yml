          replace_once(authority,
              "pub(crate) struct ReportAuthorityStore {\n    root: PathBuf,\n    generation: String,\n}\n\n#[derive(Clone)]\npub(crate) struct NativeReportAuthorityLifecycle {\n    root: PathBuf,\n    generation: String,\n}",
              "pub(crate) struct ReportAuthorityStore {\n    root: ProvenDirectory,\n    generation: String,\n}\n\n#[derive(Clone)]\npub(crate) struct NativeReportAuthorityLifecycle {\n    root: ProvenDirectory,\n    generation: String,\n}")

          replace_once(authority,
              '''    pub(crate) fn create(app: &AppHandle) -> Result<Self, String> {\n        Self::create_at(authority_root(app)?)\n    }\n\n    fn create_at(root: PathBuf) -> Result<Self, String> {\n        fs::create_dir_all(&root)\n            .map_err(|error| format!(\"Could not create report-authority storage: {error}\"))?;\n        make_private_directory(&root)?;\n        let marker = root.join(\"generation\");\n        let generation = match read_regular_text(&marker) {\n            Ok(value) if !value.trim().is_empty() => value.trim().to_string(),\n            _ => create_or_read_generation(&marker)?,\n        };\n        let store = Self { root, generation };\n        prune_expired_accepted_at(&store.root, now_millis()?)?;\n        Ok(store)\n    }''',
              '''    pub(crate) fn create(app: &AppHandle) -> Result<Self, String> {\n        let root = owned_report_root(app, \"report-authority\", true)?\n            .ok_or_else(|| \"Could not create report-authority storage.\".to_string())?;\n        Self::create_proven(root)\n    }\n\n    pub(crate) fn open(app: &AppHandle) -> Result<Option<Self>, String> {\n        owned_report_root(app, \"report-authority\", false)?\n            .map(Self::create_proven)\n            .transpose()\n    }\n\n    fn create_at(root: PathBuf) -> Result<Self, String> {\n        let root = ProvenDirectory::establish(root, true, true)?\n            .ok_or_else(|| \"Could not create report-authority storage.\".to_string())?;\n        Self::create_proven(root)\n    }\n\n    fn create_proven(root: ProvenDirectory) -> Result<Self, String> {\n        root.revalidate()?;\n        let marker = root.join(\"generation\");\n        let generation = match read_regular_text_proven(&root, &marker) {\n            Ok(value) if !value.trim().is_empty() => value.trim().to_string(),\n            _ => create_or_read_generation(&root, &marker)?,\n        };\n        let store = Self { root, generation };\n        prune_expired_accepted_at(&store.root, now_millis()?)?;\n        Ok(store)\n    }''')

