name: Apply bounded #703 RC boundary correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-correction:
    if: github.head_ref == 'fix/desktop-report-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-report-authority
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Integrate live main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X theirs origin/main

      - name: Apply bounded source correction
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}\n--- needle ---\n{old[:500]}")
              p.write_text(text.replace(old, new, 1))

          authority = "preflight-desktop/src-tauri/src/report_authority.rs"

          replace_once(authority,
              "use std::path::{Path, PathBuf};\nuse std::sync::atomic::{AtomicU64, Ordering};",
              "use std::ops::Deref;\nuse std::path::{Path, PathBuf};\nuse std::sync::atomic::{AtomicU64, Ordering};")

