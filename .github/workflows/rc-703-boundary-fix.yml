          new_roots = r'''#[derive(Clone)]
struct DirectoryAnchor {
    path: PathBuf,
    identity: DirectoryIdentity,
}

#[derive(Clone)]
struct ProvenDirectory {
    chain: Vec<DirectoryAnchor>,
}

impl ProvenDirectory {
    fn establish(path: PathBuf, create: bool, private: bool) -> Result<Option<Self>, String> {
        let name = path
            .file_name()
            .ok_or_else(|| "Saved report authority has no directory name.".to_string())?
            .to_os_string();
        let parent = path
            .parent()
            .ok_or_else(|| "Saved report authority has no parent directory.".to_string())?;
        let parent = fs::canonicalize(parent).map_err(|error| {
            format!("Could not resolve report-authority parent directory: {error}")
        })?;
        let parent = directory_anchor(&parent, "Report-authority parent")?;
        let Some(child) = establish_child(&parent, &name, create, private)? else {
            return Ok(None);
        };
        let proof = Self {
            chain: vec![parent, child],
        };
        proof.revalidate()?;
        Ok(Some(proof))
    }

    fn child(&self, name: &str, create: bool, private: bool) -> Result<Option<Self>, String> {
        self.revalidate()?;
        let parent = self
            .chain
            .last()
            .ok_or_else(|| "Saved report authority has no proven parent.".to_string())?;
        let Some(child) = establish_child(parent, name.as_ref(), create, private)? else {
            return Ok(None);
        };
        let mut chain = self.chain.clone();
        chain.push(child);
        let proof = Self { chain };
        proof.revalidate()?;
        Ok(Some(proof))
    }

    fn path(&self) -> &Path {
        self.chain
            .last()
            .expect("a proven directory always has an anchor")
            .path
            .as_path()
    }

    fn revalidate(&self) -> Result<(), String> {
        for (index, anchor) in self.chain.iter().enumerate() {
            let current = directory_identity(&anchor.path, "Saved report-authority directory")?;
            if current != anchor.identity {
                return Err("Saved report-authority directory changed after it was reviewed.".to_string());
            }
            let canonical = fs::canonicalize(&anchor.path)
                .map_err(|error| format!("Could not recheck saved report-authority directory: {error}"))?;
            if canonical != anchor.path {
                return Err("Saved report-authority directory became an alias after it was reviewed.".to_string());
            }
            if index > 0
                && anchor.path.parent()
                    != self.chain.get(index - 1).map(|parent| parent.path.as_path())
            {
                return Err("Saved report-authority directory escaped its reviewed parent.".to_string());
            }
        }
        Ok(())
    }
}

impl Deref for ProvenDirectory {
    type Target = Path;

    fn deref(&self) -> &Self::Target {
        self.path()
    }
}

fn owned_report_root(
    app: &AppHandle,
    name: &str,
    create: bool,
) -> Result<Option<ProvenDirectory>, String> {
    let home = app
        .path()
        .home_dir()
        .map_err(|error| format!("Could not locate the home directory: {error}"))?;
    let home = fs::canonicalize(home)
        .map_err(|error| format!("Could not resolve the home directory: {error}"))?;
    let home = directory_anchor(&home, "Home directory")?;
    let home = ProvenDirectory { chain: vec![home] };
    let Some(preflight) = home.child(".starsector-preflight", create, false)? else {
        return Ok(None);
    };
    let Some(support) = preflight.child("support", create, false)? else {
        return Ok(None);
    };
    support.child(name, create, true)
}

fn establish_child(
    parent: &DirectoryAnchor,
    name: &std::ffi::OsStr,
    create: bool,
    private: bool,
) -> Result<Option<DirectoryAnchor>, String> {
    let path = parent.path.join(name);
    match fs::symlink_metadata(&path) {
        Ok(_) => {}
        Err(error) if error.kind() == std::io::ErrorKind::NotFound && !create => return Ok(None),
        Err(error) if error.kind() == std::io::ErrorKind::NotFound => {
            match create_owned_directory(&path) {
                Ok(()) => {}
                Err(error) if error.kind() == std::io::ErrorKind::AlreadyExists => {}
                Err(error) => {
                    return Err(format!("Could not create report-authority storage: {error}"));
                }
            }
        }
        Err(error) => {
            return Err(format!("Could not inspect report-authority storage: {error}"));
        }
    }
    let anchor = directory_anchor(&path, "Saved report-authority directory")?;
    if anchor.path.parent() != Some(parent.path.as_path()) {
        return Err("Saved report-authority directory escapes its owned parent.".to_string());
    }
    if private {
        require_private_directory(&anchor.path)?;
    }
    Ok(Some(anchor))
}

fn directory_anchor(path: &Path, label: &str) -> Result<DirectoryAnchor, String> {
    let canonical = fs::canonicalize(path)
        .map_err(|error| format!("Could not resolve {label}: {error}"))?;
    if canonical != path {
        return Err(format!("{label} is an alias or symbolic link."));
    }
    Ok(DirectoryAnchor {
        path: canonical,
        identity: directory_identity(path, label)?,
    })
}

#[cfg(unix)]
#[derive(Clone, Copy, PartialEq, Eq)]
struct DirectoryIdentity {
    device: u64,
    inode: u64,
}

#[cfg(unix)]
fn directory_identity(path: &Path, label: &str) -> Result<DirectoryIdentity, String> {
    use std::os::unix::fs::MetadataExt;
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect {label}: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_dir() {
        return Err(format!("{label} is not a real directory."));
    }
    Ok(DirectoryIdentity {
        device: metadata.dev(),
        inode: metadata.ino(),
    })
}

#[cfg(windows)]
#[derive(Clone, Copy, PartialEq, Eq)]
struct DirectoryIdentity {
    creation_time: u64,
}

#[cfg(windows)]
fn directory_identity(path: &Path, label: &str) -> Result<DirectoryIdentity, String> {
    use std::os::windows::fs::MetadataExt;
    const FILE_ATTRIBUTE_REPARSE_POINT: u32 = 0x0400;
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect {label}: {error}"))?;
    if !metadata.is_dir() || metadata.file_attributes() & FILE_ATTRIBUTE_REPARSE_POINT != 0 {
        return Err(format!("{label} is not a real directory."));
    }
    Ok(DirectoryIdentity {
        creation_time: metadata.creation_time(),
    })
}

#[cfg(not(any(unix, windows)))]
#[derive(Clone, PartialEq, Eq)]
struct DirectoryIdentity {
    canonical: PathBuf,
}

#[cfg(not(any(unix, windows)))]
fn directory_identity(path: &Path, label: &str) -> Result<DirectoryIdentity, String> {
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect {label}: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_dir() {
        return Err(format!("{label} is not a real directory."));
    }
    Ok(DirectoryIdentity {
        canonical: fs::canonicalize(path)
            .map_err(|error| format!("Could not resolve {label}: {error}"))?,
    })
}

#[cfg(unix)]
fn create_owned_directory(path: &Path) -> std::io::Result<()> {
    use std::os::unix::fs::DirBuilderExt;
    let mut builder = fs::DirBuilder::new();
    builder.mode(0o700);
    builder.create(path)
}

#[cfg(not(unix))]
fn create_owned_directory(path: &Path) -> std::io::Result<()> {
    fs::create_dir(path)
}

#[cfg(unix)]
fn require_private_directory(path: &Path) -> Result<(), String> {
    use std::os::unix::fs::MetadataExt;
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect report-authority privacy: {error}"))?;
    if metadata.mode() & 0o077 != 0 {
        return Err("Report-authority storage is not private to the current user.".to_string());
    }
    Ok(())
}

#[cfg(not(unix))]
fn require_private_directory(_path: &Path) -> Result<(), String> {
    Ok(())
}

fn clear_report_authority_root(root: &ProvenDirectory) -> Result<(), String> {
    root.revalidate()?;
    let entries = fs::read_dir(root.path())
        .map_err(|error| format!("Could not read saved report authority: {error}"))?;
    for entry in entries {
        let entry = entry.map_err(|error| format!("Could not read saved report authority: {error}"))?;
        let name = entry.file_name();
        if name != "generation" {
            return Err("Saved report authority still contains actionable or unexpected state.".to_string());
        }
        remove_file_if_regular_proven(root, &entry.path())?;
    }
    root.revalidate()?;
    fs::remove_dir(root.path())
        .map_err(|error| format!("Could not clear saved report authority: {error}"))
}

fn clear_claim_root(root: &ProvenDirectory) -> Result<(), String> {
    root.revalidate()?;
    let entries = fs::read_dir(root.path())
        .map_err(|error| format!("Could not read automatic-report claim storage: {error}"))?;
    for entry in entries {
        let entry = entry
            .map_err(|error| format!("Could not read automatic-report claim storage: {error}"))?;
        let name = entry.file_name().to_string_lossy().into_owned();
        if !name.ends_with(".claim") {
            return Err("Automatic-report claim storage contains unexpected state.".to_string());
        }
        remove_file_if_regular_proven(root, &entry.path())?;
    }
    root.revalidate()?;
    fs::remove_dir(root.path())
        .map_err(|error| format!("Could not clear automatic-report claim storage: {error}"))
}

#[cfg(test)]
type PublicationHook = Box<dyn FnOnce() + Send>;

#[cfg(test)]
static BEFORE_SECRET_PUBLICATION: std::sync::Mutex<Option<(PathBuf, PublicationHook)>> =
    std::sync::Mutex::new(None);

#[cfg(test)]
fn set_publication_hook(root: &Path, hook: impl FnOnce() + Send + 'static) {
    *BEFORE_SECRET_PUBLICATION.lock().unwrap() = Some((root.to_path_buf(), Box::new(hook)));
}

#[cfg(test)]
fn run_publication_hook(root: &ProvenDirectory) {
    let hook = {
        let mut slot = BEFORE_SECRET_PUBLICATION.lock().unwrap();
        if slot
            .as_ref()
            .is_some_and(|(target, _)| target.as_path() == root.path())
        {
            slot.take().map(|(_, hook)| hook)
        } else {
            None
        }
    };
    if let Some(hook) = hook {
        hook();
    }
}

