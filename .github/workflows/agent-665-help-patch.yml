name: Agent 665 help delegation patch

on:
  push:
    branches:
      - agent/issue-665-help-ia

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-665-help-ia
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply help delegation
        run: python3 .github/agent-665-help-patch.py
      - name: Verify focused help behavior
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -Dtest=CliHelpTest,PreflightCliHelpTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Commit product diff and remove patch files
        shell: bash
        run: |
          git config user.name 'preflight-cli-agent'
          git config user.email 'preflight-cli-agent@users.noreply.github.com'
          git rm .github/agent-665-help-patch.py .github/workflows/agent-665-help-patch.yml
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java
          git commit -m 'feat(cli): organize everyday help'
          git push origin HEAD:agent/issue-665-help-ia
