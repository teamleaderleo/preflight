name: Report native diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Capture native test output
        working-directory: preflight-desktop
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/report-native.log" 2>&1
          status=$?
          echo "$status" > "$RUNNER_TEMP/report-native.status"
          tail -n 200 "$RUNNER_TEMP/report-native.log"
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-native-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/report-native.log
            ${{ runner.temp }}/report-native.status
          if-no-files-found: error
          retention-days: 1
