name: Report native diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build verified desktop engine
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -DskipTests package
      - name: Install frontend tooling
        working-directory: preflight-desktop
        run: npm ci
      - name: Prepare bounded desktop engine
        working-directory: preflight-desktop
        run: npm run engine:prepare:verified
      - name: Capture native validation output
        working-directory: preflight-desktop
        shell: bash
        run: |
          set +e
          {
            echo '=== cargo fmt --check ==='
            cargo fmt --check --manifest-path src-tauri/Cargo.toml
            echo "fmt_status=$?"
            echo '=== cargo test ==='
            cargo test --locked --manifest-path src-tauri/Cargo.toml
            echo "test_status=$?"
            echo '=== cargo clippy ==='
            cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
            echo "clippy_status=$?"
          } > "$RUNNER_TEMP/report-native.log" 2>&1
          tail -n 240 "$RUNNER_TEMP/report-native.log"
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-native-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/report-native.log
          if-no-files-found: error
          retention-days: 1
