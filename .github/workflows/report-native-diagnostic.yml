name: Report native diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-build-jdk
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build verified desktop engine
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -DskipTests package
      - name: Install frontend tooling
        working-directory: preflight-desktop
        run: npm ci
      - name: Prepare bounded desktop engine
        working-directory: preflight-desktop
        run: npm run engine:prepare:verified
      - name: Repair native module ownership and validate
        working-directory: preflight-desktop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("src-tauri/src/lib.rs")
          source = lib.read_text()
          marker = "mod automation;\n"
          if "mod bound_directory;\n" not in source:
              if source.count(marker) != 1:
                  raise SystemExit("lib.rs module marker changed")
              source = source.replace(marker, "mod bound_directory;\n" + marker, 1)
              lib.write_text(source)

          reports = Path("src-tauri/src/reports.rs")
          source = reports.read_text()
          source = source.replace('#[path = "bound_directory.rs"]\nmod bound_directory;\n\n', '', 1)
          source = source.replace('use bound_directory::BoundDirectory;\n', 'use crate::bound_directory::BoundDirectory;\n', 1)
          reports.write_text(source)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          node scripts/review-capability-lock.mjs
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          node scripts/review-capability-lock.mjs --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          git diff --check
      - name: Publish validated native correction and retire diagnostic
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/report-native-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preflight-desktop/src-tauri/src/lib.rs \
                  preflight-desktop/src-tauri/src/reports.rs \
                  preflight-desktop/capabilities/release-receipt-source-lock.json \
                  .github/workflows/report-native-diagnostic.yml
          git commit -m "fix(reports): use shared private directory capability"
          git push origin "HEAD:${HEAD_REF}"
