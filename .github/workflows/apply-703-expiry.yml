name: Apply 703 expiry pruning

on:
  push:
    branches:
      - fix/desktop-report-authority
    paths:
      - .github/workflows/apply-703-expiry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-report-authority

      - name: Apply expiry pruning and aligned tests
        shell: bash
        run: |
          cat > /tmp/703-rust.patch.gz.b64 <<'PATCH'

          PATCH
          base64 --decode /tmp/703-rust.patch.gz.b64 | gzip --decompress > /tmp/703-rust.patch
          printf '%s  %s\n' '10e16a09d728e6c780afd12801a5f167b3488fa08eb22e40110f70ae9d9ad5d4' /tmp/703-rust.patch | sha256sum --check
          git apply --check /tmp/703-rust.patch
          git apply /tmp/703-rust.patch

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "preflight-desktop/src-tauri/src/reports.rs",
              '#[derive(Clone, Deserialize, Serialize)]\n#[serde(rename_all = "camelCase", deny_unknown_fields)]\npub(crate) struct ReportDeletion',
              '#[derive(Clone, Debug, Deserialize, Serialize)]\n#[serde(rename_all = "camelCase", deny_unknown_fields)]\npub(crate) struct ReportDeletion',
          )

          replace_once(
              "preflight-desktop/src/reportBridge.ts",
              'import { browserPreviewScenario, isDesktopHost } from "./bridge";',
              'import { browserPreviewScenario, getReportIntakeStatus, isDesktopHost } from "./bridge";',
          )
          replace_once(
              "preflight-desktop/src/reportBridge.ts",
              '  if (!isDesktopHost()) {\n    let legacyReceiptImported = false;',
              '  if (!isDesktopHost()) {\n    const intake = await getReportIntakeStatus();\n    let legacyReceiptImported = false;',
          )
          replace_once(
              "preflight-desktop/src/reportBridge.ts",
              '''    return {
      configured: true,
      origin: "https://reports.preview.invalid",
      reason: null,
      reports: previewReports,''',
              '''    return {
      configured: intake.configured,
      origin: intake.origin,
      reason: intake.reason,
      reports: previewReports,''',
          )

          replace_once(
              "preflight-desktop/src/useDiagnosticsReport.ts",
              '''function savedLegacyRunReportReceipt(): LegacyReportReceipt | null {
  try {
    const raw = window.localStorage.getItem(REPORT_RECEIPT_STORAGE_KEY);
    if (!raw) return null;
    const receipt = JSON.parse(raw) as Partial<LegacyReportReceipt>;
    const valid = receipt.protocolVersion === 1
      && typeof receipt.caseId === "string"
      && receipt.objectKey === `accepted/${receipt.caseId}.zip`
      && typeof receipt.bytes === "number"
      && Number.isSafeInteger(receipt.bytes)
      && receipt.bytes > 0
      && typeof receipt.sha256 === "string"
      && /^[0-9a-f]{64}$/.test(receipt.sha256)
      && typeof receipt.productVersion === "string"
      && typeof receipt.receivedAt === "string"
      && Number.isFinite(Date.parse(receipt.receivedAt))
      && typeof receipt.retentionDeadline === "string"
      && Number.isFinite(Date.parse(receipt.retentionDeadline))
      && receipt.deletion?.method === "DELETE"
      && typeof receipt.deletion.url === "string"
      && typeof receipt.deletion.token === "string"
      && receipt.deletion.token.length > 0
      && typeof receipt.signature === "string"
      && receipt.signature.length > 0;
    return valid ? receipt as LegacyReportReceipt : null;
  } catch {
    return null;
  }
}''',
              '''function clearLegacyRunReportReceipt(): void {
  try {
    window.localStorage.removeItem(REPORT_RECEIPT_STORAGE_KEY);
  } catch {
    // Native report authority remains usable when webview storage is unavailable.
  }
}

function savedLegacyRunReportReceipt(): LegacyReportReceipt | null {
  try {
    const raw = window.localStorage.getItem(REPORT_RECEIPT_STORAGE_KEY);
    if (!raw) return null;
    const receipt = JSON.parse(raw) as Partial<LegacyReportReceipt>;
    const retentionDeadline = typeof receipt.retentionDeadline === "string"
      ? Date.parse(receipt.retentionDeadline)
      : Number.NaN;
    const valid = receipt.protocolVersion === 1
      && typeof receipt.caseId === "string"
      && receipt.objectKey === `accepted/${receipt.caseId}.zip`
      && typeof receipt.bytes === "number"
      && Number.isSafeInteger(receipt.bytes)
      && receipt.bytes > 0
      && typeof receipt.sha256 === "string"
      && /^[0-9a-f]{64}$/.test(receipt.sha256)
      && typeof receipt.productVersion === "string"
      && typeof receipt.receivedAt === "string"
      && Number.isFinite(Date.parse(receipt.receivedAt))
      && Number.isFinite(retentionDeadline)
      && receipt.deletion?.method === "DELETE"
      && typeof receipt.deletion.url === "string"
      && typeof receipt.deletion.token === "string"
      && receipt.deletion.token.length > 0
      && typeof receipt.signature === "string"
      && receipt.signature.length > 0;
    if (!valid || retentionDeadline <= Date.now()) {
      clearLegacyRunReportReceipt();
      return null;
    }
    return receipt as LegacyReportReceipt;
  } catch {
    clearLegacyRunReportReceipt();
    return null;
  }
}''',
          )

          replace_once(
              "preflight-desktop/src/App.test.tsx",
              'import * as bridge from "./bridge";\n',
              'import * as bridge from "./bridge";\nimport * as reportBridge from "./reportBridge";\n',
          )
          replace_once(
              "preflight-desktop/src/App.test.tsx",
              '''beforeEach(() => {
  window.localStorage.clear();
  window.history.replaceState(null, "", "/");
});''',
              '''beforeEach(() => {
  window.localStorage.clear();
  window.history.replaceState(null, "", "/");
  reportBridge.resetPreviewReportStateForTests();
});''',
          )
          replace_once(
              "preflight-desktop/src/App.test.tsx",
              '  await waitFor(() => expect(window.localStorage.getItem("preflight.reportReceipt")).not.toBeNull());',
              '  expect(window.localStorage.getItem("preflight.reportReceipt")).toBeNull();',
          )
          replace_once(
              "preflight-desktop/src/App.test.tsx",
              '''  expect(screen.getByText(/The deletion receipt stays here/)).toBeInTheDocument();
  expect(screen.getByText(/Use this case number in an issue/)).toBeInTheDocument();''',
              '''  expect(screen.getByText(/deletion authorization in native storage/)).toBeInTheDocument();
  expect(screen.getByRole("button", { name: "Copy receipt" })).toBeEnabled();''',
          )

          replace_once(
              "preflight-desktop/src/useDiagnosticsReport.test.tsx",
              '  const send = vi.spyOn(reportBridge, "sendRunReport").mockResolvedValue(acceptedCase());\n  const announce = vi.fn();',
              '''  const send = vi.spyOn(reportBridge, "sendRunReport").mockResolvedValue(acceptedCase());
  const claimed = new Set<string>();
  vi.spyOn(reportBridge, "getReportState").mockImplementation(async (_legacyReceipt, automaticRunIdentity) => {
    let automaticClaimed: boolean | null = null;
    if (automaticRunIdentity !== null) {
      automaticClaimed = !claimed.has(automaticRunIdentity);
      claimed.add(automaticRunIdentity);
    }
    return {
      configured: true,
      origin: "https://reports.preview.invalid",
      reason: null,
      reports: send.mock.calls.length > 0 ? [acceptedCase()] : [],
      automaticClaimed,
      legacyReceiptImported: false,
      backgroundUploadId: null,
      backgroundUploadTotalBytes: null,
    };
  });
  const announce = vi.fn();''',
          )
          PY

      - name: Format and verify
        shell: bash
        run: |
          cargo fmt --manifest-path preflight-desktop/src-tauri/Cargo.toml --all
          git diff --check
          git diff --exit-code -- .github/workflows/apply-703-expiry.yml

      - name: Publish branch commit
        shell: bash
        run: |
          rm .github/workflows/apply-703-expiry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prune expired native report authorities"
          git push origin HEAD:fix/desktop-report-authority
