name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact draft release tag to publish, for example v0.1.0
        required: true
        type: string
      distribution_run_id:
        description: Successful Distribution run ID that created and verified the draft
        required: true
        type: string
      lifecycle_run_id:
        description: Successful Tagged candidate package lifecycle run over the same Distribution bytes
        required: true
        type: string
      report_canary_run_id:
        description: Successful Tagged report-intake canary run over the same Distribution bytes
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Reverify and publish existing draft
    runs-on: ubuntu-latest
    environment:
      name: release-signing
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      DISTRIBUTION_RUN_ID: ${{ inputs.distribution_run_id }}
      LIFECYCLE_RUN_ID: ${{ inputs.lifecycle_run_id }}
      REPORT_CANARY_RUN_ID: ${{ inputs.report_canary_run_id }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Publication requires an exact v-prefixed SemVer release tag"
            exit 1
          }
          [[ "$DISTRIBUTION_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Distribution run ID must be numeric"
            exit 1
          }
          [[ "$LIFECYCLE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Tagged lifecycle run ID must be numeric"
            exit 1
          }
          [[ "$REPORT_CANARY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Tagged report-canary run ID must be a positive integer"
            exit 1
          }

      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate tag and successful Distribution run
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_sha" origin/main || {
            echo "::error::Release tag commit is not reachable from main"
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DISTRIBUTION_RUN_ID" \
            > "$RUNNER_TEMP/distribution-run.json"
          python3 - "$RUNNER_TEMP/distribution-run.json" "$tag_sha" "$RELEASE_TAG" <<'PY'
          import json
          import sys

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          tag_sha = sys.argv[2]
          tag = sys.argv[3]
          errors = []
          if run.get("name") != "Distribution":
              errors.append(f"run name is {run.get('name')!r}, expected 'Distribution'")
          if run.get("path") != ".github/workflows/distribution.yml":
              errors.append(f"workflow path is {run.get('path')!r}")
          if run.get("event") != "push":
              errors.append(f"run event is {run.get('event')!r}, expected 'push'")
          if run.get("head_branch") != tag:
              errors.append(f"run ref is {run.get('head_branch')!r}, expected {tag!r}")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              errors.append(
                  f"run state is {run.get('status')!r}/{run.get('conclusion')!r}, expected completed/success"
              )
          if run.get("head_sha") != tag_sha:
              errors.append(f"run head {run.get('head_sha')!r} does not match tag commit {tag_sha!r}")
          if errors:
              raise SystemExit("Refusing publication: " + "; ".join(errors))
          PY

          GITHUB_REF_TYPE=tag node preflight-desktop/scripts/validate-release-version.mjs "$RELEASE_TAG"

      - name: Read and validate draft release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/draft-release-before.json"
          version="${RELEASE_TAG#v}"
          python3 - "$RUNNER_TEMP/draft-release-before.json" "docs/releases/${version}.md" "$RELEASE_TAG" <<'PY'
          import json
          from pathlib import Path
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          notes_path = Path(sys.argv[2])
          tag = sys.argv[3]
          errors = []
          if release.get("tag_name") != tag:
              errors.append(f"draft tag is {release.get('tag_name')!r}, expected {tag!r}")
          if release.get("draft") is not True:
              errors.append("release is not still a draft")
          if release.get("name") != f"Preflight {tag}":
              errors.append(f"release title is {release.get('name')!r}")
          expected_notes = notes_path.read_text(encoding="utf-8").replace("\r\n", "\n").strip()
          actual_notes = (release.get("body") or "").replace("\r\n", "\n").strip()
          if actual_notes != expected_notes:
              errors.append("draft release notes differ from the reviewed notes at the tag")
          if not release.get("assets"):
              errors.append("draft release has no assets")
          if errors:
              raise SystemExit("Refusing publication: " + "; ".join(errors))
          PY

      - name: Download originally verified release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir verified-release
          gh run download "$DISTRIBUTION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "preflight-complete-release-$DISTRIBUTION_RUN_ID" \
            --dir verified-release

      - name: Require package lifecycle evidence from these exact tagged bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIFECYCLE_RUN_ID" \
            > "$RUNNER_TEMP/tagged-lifecycle-run.json"
          lifecycle_head="$(python3 - "$RUNNER_TEMP/tagged-lifecycle-run.json" <<'PY'
          import json
          import sys

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          errors = []
          if run.get("name") != "Tagged candidate package lifecycle":
              errors.append(f"run name is {run.get('name')!r}")
          if run.get("path") != ".github/workflows/tagged-candidate-lifecycle.yml":
              errors.append(f"workflow path is {run.get('path')!r}")
          if run.get("event") != "workflow_dispatch":
              errors.append(f"run event is {run.get('event')!r}, expected 'workflow_dispatch'")
          if run.get("head_branch") != "main":
              errors.append(f"run branch is {run.get('head_branch')!r}, expected 'main'")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              errors.append(
                  f"run state is {run.get('status')!r}/{run.get('conclusion')!r}, expected completed/success"
              )
          head = run.get("head_sha")
          if not isinstance(head, str) or len(head) != 40:
              errors.append(f"invalid lifecycle head SHA {head!r}")
          if errors:
              raise SystemExit("Refusing publication: " + "; ".join(errors))
          print(head)
          PY
          )"
          git merge-base --is-ancestor "$lifecycle_head" origin/main || {
            echo "::error::Tagged lifecycle workflow did not run from reviewed main history"
            exit 1
          }

          mkdir -p tagged-lifecycle/Linux tagged-lifecycle/Windows tagged-lifecycle/macOS
          for platform in Linux Windows macOS; do
            gh run download "$LIFECYCLE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "tagged-candidate-package-lifecycle-$platform-$DISTRIBUTION_RUN_ID" \
              --dir "tagged-lifecycle/$platform"
          done

          python3 - verified-release tagged-lifecycle "$RELEASE_TAG" "$DISTRIBUTION_RUN_ID" "$(git rev-parse "${RELEASE_TAG}^{}")" <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys

          release = Path(sys.argv[1])
          evidence = Path(sys.argv[2])
          tag = sys.argv[3]
          distribution_run_id = sys.argv[4]
          source_revision = sys.argv[5]
          expected = {
              "Linux": ("Preflight-Linux-x86_64.deb", "SHA256SUMS-linux-x64.txt"),
              "Windows": ("Preflight-Windows-x86_64.exe", "SHA256SUMS-win32-x64.txt"),
              "macOS": ("Preflight-macOS-arm64.dmg", "SHA256SUMS-darwin-arm64.txt"),
          }
          errors = []
          for platform, (package_name, checksum_name) in expected.items():
              receipt_path = evidence / platform / "lifecycle.json"
              if not receipt_path.is_file():
                  errors.append(f"missing {platform} lifecycle receipt")
                  continue
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              if receipt.get("format") != "preflight-tagged-package-lifecycle-v1":
                  errors.append(f"{platform} receipt has wrong format")
              if receipt.get("platform") != platform:
                  errors.append(f"{platform} receipt names platform {receipt.get('platform')!r}")
              if receipt.get("releaseTag") != tag:
                  errors.append(f"{platform} receipt tag does not match {tag}")
              if str(receipt.get("distributionRunId")) != distribution_run_id:
                  errors.append(f"{platform} receipt Distribution run does not match")
              if receipt.get("sourceRevision") != source_revision:
                  errors.append(f"{platform} receipt source revision does not match tag")
              package = receipt.get("exactCandidatePackage") or {}
              if package.get("name") != package_name:
                  errors.append(f"{platform} receipt package is {package.get('name')!r}")
              if package.get("checksumManifest") != checksum_name:
                  errors.append(f"{platform} receipt checksum manifest is {package.get('checksumManifest')!r}")
              release_package = release / package_name
              if not release_package.is_file():
                  errors.append(f"verified release is missing {package_name}")
                  continue
              data = release_package.read_bytes()
              actual_sha = sha256(data).hexdigest()
              if package.get("bytes") != len(data):
                  errors.append(f"{platform} receipt byte length differs from tagged release")
              if package.get("sha256") != actual_sha:
                  errors.append(f"{platform} receipt SHA-256 differs from tagged release")
          if errors:
              raise SystemExit("Refusing publication: " + "; ".join(errors))
          print("Tagged package lifecycle receipts match all three published package byte sets")
          PY

      - name: Require production report canary evidence from these exact tagged bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPORT_CANARY_RUN_ID" \
            > "$RUNNER_TEMP/tagged-report-canary-run.json"
          canary_head="$(python3 - "$RUNNER_TEMP/tagged-report-canary-run.json" <<'PY'
          import json
          import sys

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          errors = []
          if run.get("name") != "Tagged report-intake canary":
              errors.append(f"run name is {run.get('name')!r}")
          if run.get("path") != ".github/workflows/tagged-report-canary.yml":
              errors.append(f"workflow path is {run.get('path')!r}")
          if run.get("event") != "workflow_dispatch":
              errors.append(f"run event is {run.get('event')!r}, expected 'workflow_dispatch'")
          if run.get("head_branch") != "main":
              errors.append(f"run branch is {run.get('head_branch')!r}, expected 'main'")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              errors.append(
                  f"run state is {run.get('status')!r}/{run.get('conclusion')!r}, expected completed/success"
              )
          head = run.get("head_sha")
          if not isinstance(head, str) or len(head) != 40:
              errors.append(f"invalid canary head SHA {head!r}")
          if errors:
              raise SystemExit("Refusing publication: " + "; ".join(errors))
          print(head)
          PY
          )"
          git merge-base --is-ancestor "$canary_head" origin/main || {
            echo "::error::Tagged report canary workflow did not run from reviewed main history"
            exit 1
          }

          mkdir -p tagged-report-canary
          gh run download "$REPORT_CANARY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "tagged-report-canary-$DISTRIBUTION_RUN_ID" \
            --dir tagged-report-canary

          python3 - verified-release tagged-report-canary "$RELEASE_TAG" "$DISTRIBUTION_RUN_ID" "$(git rev-parse "${RELEASE_TAG}^{}")" <<'PY'
          from datetime import datetime
          from hashlib import sha256
          import json
          from pathlib import Path
          import re
          import sys

          release = Path(sys.argv[1])
          evidence = Path(sys.argv[2])
          tag = sys.argv[3]
          distribution_run_id = sys.argv[4]
          source_revision = sys.argv[5]
          receipt_path = evidence / "receipt.json"
          if not receipt_path.is_file():
              raise SystemExit("Refusing publication: missing tagged report-canary receipt")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          errors = []
          if receipt.get("format") != "preflight-tagged-report-canary-v1":
              errors.append("report canary receipt has wrong format")
          if receipt.get("releaseTag") != tag:
              errors.append("report canary receipt tag differs from release tag")
          if str(receipt.get("distributionRunId")) != distribution_run_id:
              errors.append("report canary receipt Distribution run differs from selected release")
          if receipt.get("sourceRevision") != source_revision:
              errors.append("report canary receipt source revision differs from release tag")
          if receipt.get("platform") != "Linux":
              errors.append("report canary receipt is not bound to the reviewed Linux package")

          package_name = "Preflight-Linux-x86_64.deb"
          checksum_name = "SHA256SUMS-linux-x64.txt"
          package = receipt.get("exactCandidatePackage") or {}
          release_package = release / package_name
          if package.get("name") != package_name:
              errors.append("report canary receipt names the wrong package")
          if package.get("checksumManifest") != checksum_name:
              errors.append("report canary receipt names the wrong checksum manifest")
          if not release_package.is_file():
              errors.append(f"verified release is missing {package_name}")
          else:
              data = release_package.read_bytes()
              if package.get("bytes") != len(data):
                  errors.append("report canary package byte length differs from tagged release")
              if package.get("sha256") != sha256(data).hexdigest():
                  errors.append("report canary package SHA-256 differs from tagged release")

          capability_name = "CAPABILITIES-linux-x64.json"
          capability_path = release / capability_name
          capability = receipt.get("capabilityReceipt") or {}
          if capability.get("name") != capability_name:
              errors.append("report canary receipt names the wrong capability receipt")
          if not capability_path.is_file():
              errors.append(f"verified release is missing {capability_name}")
              expected_origin = None
          else:
              capability_bytes = capability_path.read_bytes()
              if capability.get("sha256") != sha256(capability_bytes).hexdigest():
                  errors.append("report canary capability digest differs from tagged release")
              envelope = json.loads(capability_bytes.decode("utf-8"))
              expected_origin = ((envelope.get("capabilityReceipt") or {}).get("network") or {}).get("reportIntakeOrigin")

          origin = receipt.get("reportIntakeOrigin")
          if origin != expected_origin or not isinstance(origin, str) or origin == "disabled":
              errors.append("report canary origin differs from tagged package capability")

          canary = receipt.get("canary")
          allowed_canary_fields = {
              "format", "origin", "caseId", "archiveBytes", "sha256",
              "receivedAt", "retentionDeadline", "deleted",
          }
          if not isinstance(canary, dict):
              errors.append("report canary receipt has no bounded canary object")
          else:
              if set(canary) != allowed_canary_fields:
                  errors.append("report canary public field set differs from the reviewed bounded receipt")
              if canary.get("format") != "preflight-report-intake-canary-v1":
                  errors.append("report canary result has wrong format")
              if canary.get("origin") != origin:
                  errors.append("report canary result origin differs from package capability")
              if not isinstance(canary.get("caseId"), str) or not re.fullmatch(
                      r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
                      canary.get("caseId", "")):
                  errors.append("report canary case ID is invalid")
              archive_bytes = canary.get("archiveBytes")
              if type(archive_bytes) is not int or not (0 < archive_bytes <= 6 * 1024 * 1024):
                  errors.append("report canary archive byte count is invalid")
              if not isinstance(canary.get("sha256"), str) or not re.fullmatch(
                      r"[0-9a-f]{64}", canary.get("sha256", "")):
                  errors.append("report canary archive SHA-256 is invalid")
              instant_pattern = r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z"
              received_at = canary.get("receivedAt")
              retention_deadline = canary.get("retentionDeadline")
              if not isinstance(received_at, str) or not re.fullmatch(instant_pattern, received_at):
                  errors.append("report canary receivedAt is invalid")
              if not isinstance(retention_deadline, str) or not re.fullmatch(instant_pattern, retention_deadline):
                  errors.append("report canary retentionDeadline is invalid")
              if isinstance(received_at, str) and isinstance(retention_deadline, str) \
                      and re.fullmatch(instant_pattern, received_at) \
                      and re.fullmatch(instant_pattern, retention_deadline):
                  received = datetime.fromisoformat(received_at.replace("Z", "+00:00"))
                  retained_until = datetime.fromisoformat(retention_deadline.replace("Z", "+00:00"))
                  if retained_until <= received:
                      errors.append("report canary retention deadline does not follow receipt time")
              if canary.get("deleted") is not True:
                  errors.append("report canary did not prove deletion cleanup")

          if errors:
              raise SystemExit("Refusing publication: " + "; ".join(errors))
          print("Tagged report-intake canary matches the selected published package generation")
          PY

      - name: Download current draft release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir draft-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir draft-release

      - name: Match draft assets byte-for-byte to the verified artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - verified-release draft-release <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          def inventory(root_name):
              root = Path(root_name)
              if not root.is_dir():
                  raise SystemExit(f"Missing release directory: {root}")
              entries = list(root.iterdir())
              invalid = [p.name for p in entries if p.is_symlink() or not p.is_file()]
              if invalid:
                  raise SystemExit(f"Unexpected non-file release entries in {root}: {invalid}")
              return {
                  p.name: (p.stat().st_size, sha256(p.read_bytes()).hexdigest())
                  for p in entries
              }

          verified = inventory(sys.argv[1])
          draft = inventory(sys.argv[2])
          if verified != draft:
              missing = sorted(set(verified) - set(draft))
              added = sorted(set(draft) - set(verified))
              changed = sorted(
                  name for name in set(verified) & set(draft) if verified[name] != draft[name]
              )
              raise SystemExit(
                  "Draft assets differ from the verified Distribution artifact: "
                  f"missing={missing}, added={added}, changed={changed}"
              )
          print(f"Matched {len(verified)} release assets byte-for-byte")
          PY
          python3 scripts/verify_complete_release.py --release draft-release

      - name: Recheck draft and tag immediately before publication
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/draft-release-after.json"
          python3 - "$RUNNER_TEMP/draft-release-before.json" "$RUNNER_TEMP/draft-release-after.json" <<'PY'
          import json
          import sys

          def fingerprint(path):
              release = json.load(open(path, encoding="utf-8"))
              assets = sorted(
                  (
                      asset.get("id"),
                      asset.get("name"),
                      asset.get("size"),
                      asset.get("digest"),
                  )
                  for asset in release.get("assets", [])
              )
              return (
                  release.get("id"),
                  release.get("tag_name"),
                  release.get("draft"),
                  release.get("name"),
                  release.get("body"),
                  release.get("updated_at"),
                  assets,
              )

          before = fingerprint(sys.argv[1])
          after = fingerprint(sys.argv[2])
          if before != after:
              raise SystemExit("Draft release changed during publication verification")
          if after[2] is not True:
              raise SystemExit("Release is no longer a draft")
          PY

          original_tag_sha="$(git rev-parse "${RELEASE_TAG}^{}")"
          git fetch --force origin "refs/tags/$RELEASE_TAG"
          current_tag_sha="$(git rev-parse 'FETCH_HEAD^{}')"
          test "$current_tag_sha" = "$original_tag_sha" || {
            echo "::error::Release tag moved during publication verification"
            exit 1
          }

      - name: Publish verified draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)" = "false"
