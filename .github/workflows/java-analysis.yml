name: Java static analysis

on:
  push:
    branches: [main]
    paths:
      - '**/*.java'
      - 'pom.xml'
      - '*/pom.xml'
      - '.github/actions/setup-build-jdk/**'
      - '.github/workflows/java-analysis.yml'
      - 'scripts/check_jacoco_thresholds.py'
      - 'scripts/test_check_jacoco_thresholds.py'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.java'
      - 'pom.xml'
      - '*/pom.xml'
      - '.github/actions/setup-build-jdk/**'
      - '.github/workflows/java-analysis.yml'
      - 'scripts/check_jacoco_thresholds.py'
      - 'scripts/test_check_jacoco_thresholds.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  error-prone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
        with:
          # Error Prone 2.50 requires JDK 21+ to run. Maven still compiles the project with
          # maven.compiler.release=17, so the shipped Java compatibility target stays unchanged.
          java-version: '21'
      - name: Compile main and test sources with Error Prone
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Panalysis
          -DskipTests
          test-compile

  coverage:
    name: JaCoCo coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
        with:
          java-version: '17'
      - name: Test coverage policy
        run: python3 scripts/test_check_jacoco_thresholds.py
      - name: Run tests with JaCoCo
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Pcoverage
          verify
      - name: Retain coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-coverage-${{ github.run_id }}
          path: |
            */target/site/jacoco/jacoco.xml
            */target/site/jacoco/jacoco.csv
            */target/site/jacoco/index.html
          if-no-files-found: error
          retention-days: 14
      - name: Enforce selected coverage floors
        run: python3 scripts/check_jacoco_thresholds.py
