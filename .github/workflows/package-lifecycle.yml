name: Package lifecycle

# The install-and-remove exercise in Desktop CI covers a player's first install. This covers their
# second one: an upgrade written over a tree already in use, and the rollback that puts the earlier
# version back. macOS rehearsed that by hand; Windows and Linux never have.
#
# It is dispatch-only because it still builds two native package versions on every runner. The Java
# engines and frontend are built once before the platform matrix so each OS packages the same inputs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/package-lifecycle.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engines:
    name: Build lifecycle engine versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Build the installed-version engine once
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -pl preflight-cli -am -DskipTests clean package
          python3 -c "from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); import verify_release_boundary as v; v.validate_jar_bytes(Path('preflight-cli/target/preflight.jar').read_bytes())"
          mkdir -p lifecycle-engines/current
          cp preflight-cli/target/preflight.jar lifecycle-engines/current/preflight.jar

      - name: Move engine sources to the rehearsal version
        working-directory: preflight-desktop
        run: node scripts/set-release-version.mjs 0.1.1-rehearsal

      - name: Build the rehearsal-version engine once
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -pl preflight-cli -am -DskipTests clean package
          python3 -c "from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); import verify_release_boundary as v; v.validate_jar_bytes(Path('preflight-cli/target/preflight.jar').read_bytes())"
          mkdir -p lifecycle-engines/rehearsal
          cp preflight-cli/target/preflight.jar lifecycle-engines/rehearsal/preflight.jar

      - name: Preserve both verified engine versions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-lifecycle-engines-${{ github.run_id }}
          path: lifecycle-engines
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Build lifecycle frontend once
    needs: engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: preflight-desktop
        run: npm ci

      - name: Download verified lifecycle engines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-lifecycle-engines-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-lifecycle-engines

      - name: Stage installed-version engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-cli/target
          cp "$RUNNER_TEMP/preflight-lifecycle-engines/current/preflight.jar" preflight-cli/target/preflight.jar

      - name: Test and build lifecycle frontend once
        working-directory: preflight-desktop
        shell: bash
        run: |
          npm run engine:prepare:verified
          npm test
          npm run test:release:prepared
          npm run build
          node scripts/frontend-dist-manifest.mjs write dist frontend-dist.json
          node scripts/frontend-dist-manifest.mjs verify dist frontend-dist.json

      - name: Preserve verified lifecycle frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-lifecycle-frontend-${{ github.run_id }}
          path: |
            preflight-desktop/dist
            preflight-desktop/frontend-dist.json
          if-no-files-found: error
          retention-days: 1

  lifecycle:
    name: Lifecycle / ${{ matrix.name }}
    needs: [engines, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            system: linux
            bundles: deb
          - name: Windows
            os: windows-latest
            system: windows
            bundles: nsis
          - name: macOS
            os: macos-latest
            system: macos
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend tooling
        working-directory: preflight-desktop
        run: npm ci

      - name: Download verified lifecycle engines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-lifecycle-engines-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-lifecycle-engines

      - name: Download verified lifecycle frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-lifecycle-frontend-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-lifecycle-frontend

      - name: Stage and verify lifecycle frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preflight-desktop/dist
          cp -R "$RUNNER_TEMP/preflight-lifecycle-frontend/dist" preflight-desktop/dist
          cp "$RUNNER_TEMP/preflight-lifecycle-frontend/frontend-dist.json" preflight-desktop/frontend-dist.json
          node preflight-desktop/scripts/frontend-dist-manifest.mjs \
            verify preflight-desktop/dist preflight-desktop/frontend-dist.json

      - name: Stage installed-version engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-cli/target
          cp "$RUNNER_TEMP/preflight-lifecycle-engines/current/preflight.jar" preflight-cli/target/preflight.jar

      - name: Build the version a player already has
        working-directory: preflight-desktop
        shell: bash
        run: |
          npm run engine:prepare:verified
          npm run desktop:clean
          npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json
          node scripts/frontend-dist-manifest.mjs verify dist frontend-dist.json

      # These steps run under node rather than a shell. The Windows runner's bash is MSYS, and its
      # path translation of the runner's own backslash directories is a way to lose a two-build run
      # to plumbing instead of to anything the rehearsal was meant to find.
      - name: Set the earlier build aside
        shell: node {0}
        run: |
          const { mkdirSync, renameSync } = require("node:fs");
          const { join } = require("node:path");
          const lifecycle = join(process.env.RUNNER_TEMP, "lifecycle");
          mkdirSync(lifecycle, { recursive: true });
          renameSync("preflight-desktop/src-tauri/target/release/bundle", join(lifecycle, "older"));

      # The rehearsal version's notes are committed, so this moves every version string through the
      # ordinary release path instead of letting the workflow write its own placeholder. The change
      # lives in the runner's checkout and is never committed or tagged.
      - name: Move the working tree to the rehearsal version
        working-directory: preflight-desktop
        run: node scripts/set-release-version.mjs 0.1.1-rehearsal

      - name: Stage rehearsal-version engine
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/preflight-lifecycle-engines/rehearsal/preflight.jar" preflight-cli/target/preflight.jar

      - name: Build the version they are upgrading to
        working-directory: preflight-desktop
        shell: bash
        run: |
          npm run engine:prepare:verified
          npm run desktop:clean
          npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json
          node scripts/frontend-dist-manifest.mjs verify dist frontend-dist.json

      - name: Collect the later build
        shell: node {0}
        run: |
          const { renameSync } = require("node:fs");
          const { join } = require("node:path");
          const lifecycle = join(process.env.RUNNER_TEMP, "lifecycle");
          renameSync("preflight-desktop/src-tauri/target/release/bundle", join(lifecycle, "newer"));

      - name: Install, upgrade, roll back, and remove
        shell: node {0}
        run: |
          const { spawnSync } = require("node:child_process");
          const { join } = require("node:path");
          const lifecycle = join(process.env.RUNNER_TEMP, "lifecycle");
          const result = spawnSync(process.execPath, [
            join("preflight-desktop", "scripts", "exercise-package-lifecycle.mjs"),
            join(lifecycle, "older"),
            join(lifecycle, "newer"),
            // The report is written into the workspace, not beside the bundles. `hashFiles` only
            // sees paths under the workspace, so a report in the runner's temp directory made the
            // upload step below skip silently and the first hosted run kept no artifact at all.
            join(process.env.GITHUB_WORKSPACE, "lifecycle-report", "report.json"),
          ], { stdio: "inherit" });
          if (result.error) throw result.error;
          if (result.status !== 0) process.exit(result.status ?? 1);

      - name: Publish the lifecycle report
        if: always() && hashFiles('lifecycle-report/report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-lifecycle-${{ matrix.system }}
          path: lifecycle-report/report.json
          if-no-files-found: error
