name: Repair report authority boundaries

on:
  push:
    branches:
      - fix/desktop-report-authority

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/desktop-report-authority
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge current main and apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name preflight-agent
          git config user.email preflight-agent@users.noreply.github.com
          git fetch origin main

          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^preflight-desktop/capabilities/release-receipt-source-lock.json$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            if [[ -n "$conflicts" ]]; then
              git checkout --theirs -- preflight-desktop/capabilities/release-receipt-source-lock.json
              git add preflight-desktop/capabilities/release-receipt-source-lock.json
            fi
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

