fn canonical_home_root(app: &AppHandle) -> Result<PathBuf, String> {
    let home = app
        .path()
        .home_dir()
        .map_err(|error| format!("Could not locate the home directory: {error}"))?;
    let home = home
        .canonicalize()
        .map_err(|error| format!("Could not inspect the home directory: {error}"))?;
    if !home.is_dir() {
        return Err("The home directory is not a folder.".to_string());
    }
    Ok(home)
}

fn prepare_child_directory(parent: &Path, name: &str, label: &str) -> Result<PathBuf, String> {
    let candidate = parent.join(name);
    prepare_private_root(&candidate, label)
}

fn prepare_private_root(root: &Path, label: &str) -> Result<PathBuf, String> {
    let parent = root
        .parent()
        .ok_or_else(|| format!("{label} has no parent directory."))?
        .canonicalize()
        .map_err(|error| format!("Could not inspect the parent of {label}: {error}"))?;
    if !parent.is_dir() {
        return Err(format!("The parent of {label} is not a folder."));
    }
    let name = root
        .file_name()
        .ok_or_else(|| format!("{label} has no directory name."))?;
    let candidate = parent.join(name);
    match candidate.symlink_metadata() {
        Ok(metadata) => {
            if metadata.file_type().is_symlink() || !metadata.is_dir() {
                return Err(format!("The {label} path is a symbolic link or is not a folder."));
            }
        }
        Err(error) if error.kind() == std::io::ErrorKind::NotFound => {
            fs::create_dir(&candidate)
                .map_err(|error| format!("Could not create {label}: {error}"))?;
        }
        Err(error) => return Err(format!("Could not inspect {label}: {error}")),
    }
    let metadata = candidate
        .symlink_metadata()
        .map_err(|error| format!("Could not inspect {label}: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_dir() {
        return Err(format!("The {label} path is a symbolic link or is not a folder."));
    }
    let canonical = candidate
        .canonicalize()
        .map_err(|error| format!("Could not resolve {label}: {error}"))?;
    if canonical.parent() != Some(parent.as_path()) {
        return Err(format!("The {label} path escaped its reviewed parent directory."));
    }
    make_private_directory(&canonical)?;
    Ok(canonical)
}

fn existing_child_directory(
    parent: &Path,
    name: &str,
    label: &str,
) -> Result<Option<PathBuf>, String> {
    let parent = parent
        .canonicalize()
        .map_err(|error| format!("Could not inspect the parent of {label}: {error}"))?;
    let candidate = parent.join(name);
    let metadata = match candidate.symlink_metadata() {
        Ok(metadata) => metadata,
        Err(error) if error.kind() == std::io::ErrorKind::NotFound => return Ok(None),
        Err(error) => return Err(format!("Could not inspect {label}: {error}")),
    };
    if metadata.file_type().is_symlink() || !metadata.is_dir() {
        return Err(format!("The {label} path is a symbolic link or is not a folder."));
    }
    let canonical = candidate
        .canonicalize()
        .map_err(|error| format!("Could not resolve {label}: {error}"))?;
    if canonical.parent() != Some(parent.as_path()) {
        return Err(format!("The {label} path escaped its reviewed parent directory."));
    }
    Ok(Some(canonical))
}

fn validate_canonical_root(root: &Path, label: &str) -> Result<(), String> {
    let metadata = root
        .symlink_metadata()
        .map_err(|error| format!("Could not inspect {label}: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_dir() {
        return Err(format!("The {label} path is a symbolic link or is not a folder."));
    }
    let canonical = root
        .canonicalize()
        .map_err(|error| format!("Could not resolve {label}: {error}"))?;
    if canonical != root {
        return Err(format!("The {label} path changed after it was reviewed."));
    }
    Ok(())
}

fn clear_private_child(parent: &Path, name: &str, label: &str) -> Result<(), String> {
    let Some(root) = existing_child_directory(parent, name, label)? else {
        return Ok(());
    };
    validate_canonical_root(&root, label)?;
    fs::remove_dir_all(&root).map_err(|error| format!("Could not clear {label}: {error}"))
}

fn authority_mutation() -> Result<MutexGuard<'static, ()>, String> {
    AUTHORITY_MUTATION
        .lock()
        .map_err(|_| "The report-authority mutation lock is unavailable.".to_string())
}

fn ensure_generation_at(root: &Path, expected: &str) -> Result<(), String> {
    validate_canonical_root(root, "report-authority storage")?;
    let current = read_regular_text(&root.join("generation"))?;
    if current.trim() == expected {
        Ok(())
    } else {
        Err("Report-authority storage changed while the report was active.".to_string())
    }
}
