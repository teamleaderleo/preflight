  return { ...rendered, announce, clearReportReceipt };
}

test("all-data review waits for native report-authority reconciliation", async () => {
  const getPlan = vi.spyOn(bridge, "getRemovalPlan").mockResolvedValue(plan);
  const { result, announce } = hook({ ready: false, cases: 0, uploadActive: false });

  await act(async () => result.current.review("all-data"));

  expect(getPlan).not.toHaveBeenCalled();
  expect(announce).toHaveBeenCalledWith(expect.stringContaining("deletion authority"), "warning");
});

test("all-data review refuses while an actionable report case exists", async () => {
  const getPlan = vi.spyOn(bridge, "getRemovalPlan").mockResolvedValue(plan);
  const { result, announce } = hook({ ready: true, cases: 1, uploadActive: false });

  await act(async () => result.current.review("all-data"));

  expect(getPlan).not.toHaveBeenCalled();
  expect(announce).toHaveBeenCalledWith(expect.stringContaining("Delete or explicitly dismiss"), "warning");
});

test("all-data apply rechecks report authority after review", async () => {
  vi.spyOn(bridge, "getRemovalPlan").mockResolvedValue(plan);
  const apply = vi.spyOn(bridge, "applyRemoval").mockResolvedValue({ ...plan, applied: true });
  const rendered = hook({ ready: true, cases: 0, uploadActive: false });

  await act(async () => rendered.result.current.review("all-data"));
  rendered.rerender({ currentGuard: { ready: true, cases: 1, uploadActive: false } });
  await act(async () => rendered.result.current.remove());

  expect(apply).not.toHaveBeenCalled();
  expect(rendered.announce).toHaveBeenCalledWith(expect.stringContaining("Delete or explicitly dismiss"), "warning");
});

