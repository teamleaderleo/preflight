          new_persist = '''fn persist_json_new<T: Serialize>(path: &Path, value: &T) -> Result<(), String> {
    persist_json_new_inner(path, value, None)
}

fn persist_json_new_for_generation<T: Serialize>(
    path: &Path,
    value: &T,
    generation: &str,
) -> Result<(), String> {
    persist_json_new_inner(path, value, Some(generation))
}

fn persist_json_new_inner<T: Serialize>(
    path: &Path,
    value: &T,
    generation: Option<&str>,
) -> Result<(), String> {
    let parent = path
        .parent()
        .ok_or_else(|| "Saved report authority has no parent directory.".to_string())?;
    if generation.is_some() {
        validate_canonical_root(parent, "report-authority storage")?;
    } else {
        fs::create_dir_all(parent)
            .map_err(|error| format!("Could not create report-authority storage: {error}"))?;
        make_private_directory(parent)?;
    }
    let bytes = serde_json::to_vec(value)
        .map_err(|error| format!("Could not serialize saved report authority: {error}"))?;
    if bytes.len() as u64 > MAX_AUTHORITY_BYTES {
        return Err("Saved report authority is unexpectedly large.".to_string());
    }
    let mut file = match OpenOptions::new().write(true).create_new(true).open(path) {
        Ok(file) => file,
        Err(error) if error.kind() == std::io::ErrorKind::AlreadyExists => {
            return Err("Saved report authority already exists for this case.".to_string());
        }
        Err(error) => return Err(format!("Could not create saved report authority: {error}")),
    };
    if let Some(generation) = generation {
        if let Err(error) = ensure_generation_at(parent, generation) {
            drop(file);
            let _ = fs::remove_file(path);
            return Err(error);
        }
    }
    if let Err(error) = make_private_file(&file) {
        drop(file);
        let _ = fs::remove_file(path);
        return Err(error);
    }
    let write_result = file
        .write_all(&bytes)
        .map_err(|error| format!("Could not write saved report authority: {error}"))
        .and_then(|()| {
            file.sync_all()
                .map_err(|error| format!("Could not save report authority: {error}"))
        });
    drop(file);
    if let Err(error) = write_result {
        let _ = fs::remove_file(path);
        return Err(error);
    }
    sync_directory(parent)?;
    Ok(())
}
