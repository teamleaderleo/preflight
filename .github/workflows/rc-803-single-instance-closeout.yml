name: RC 803 single-instance closeout

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc-803-single-instance-closeout.yml'
      - 'scripts/rc_803_single_instance_closeout.py'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proto/local-only-beta-798'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: proto/local-only-beta-798
          fetch-depth: 0

      - name: Apply selected #795 beta contract
        run: python3 scripts/rc_803_single_instance_closeout.py

      - name: Verify closeout no longer requires focus handoff
        shell: bash
        run: |
          set -euo pipefail
          section="$(sed -n '/^## #678 — packaged desktop single-instance contract$/,/^## Exact candidate preparation$/p' docs/release-gate-closeout.md)"
          grep -Fq 'one packaged Preflight desktop process per user/session' <<<"$section"
          grep -Fq 'no focus/handoff assertion is part of this contract' <<<"$section"
          ! grep -Fq 'reveal/unminimize its main window' <<<"$section"
          ! grep -Fq 'Tauri v2 single-instance plugin' <<<"$section"

      - name: Commit real closeout bytes and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rc-803-single-instance-closeout.yml \
                 scripts/rc_803_single_instance_closeout.py
          git add docs/release-gate-closeout.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Align single-instance closeout with #795'
          git push origin HEAD:proto/local-only-beta-798
