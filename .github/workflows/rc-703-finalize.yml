name: Finalize #703 RC correction

on:
  push:
    branches:
      - fix/desktop-report-authority

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/desktop-report-authority
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Integrate live main and apply bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name preflight-agent
          git config user.email preflight-agent@users.noreply.github.com
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^preflight-desktop/capabilities/release-receipt-source-lock.json$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            git checkout --theirs -- preflight-desktop/capabilities/release-receipt-source-lock.json
            git add preflight-desktop/capabilities/release-receipt-source-lock.json
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def replace_once(path: str, old: str, new: str, label: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, new: str, label: str):
              p = Path(path)
              text = p.read_text()
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f"{path}: {label}: start anchor missing")
              second = text.find(end, first + len(start))
              if second < 0:
                  raise SystemExit(f"{path}: {label}: end anchor missing")
              p.write_text(text[:first] + new + text[second:])

          authority = "preflight-desktop/src-tauri/src/report_authority.rs"
          replace_once(
              authority,
              "use std::path::{Path, PathBuf};\nuse std::sync::atomic::{AtomicU64, Ordering};",
              "use std::ops::Deref;\nuse std::path::{Path, PathBuf};\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::sync::{Mutex, MutexGuard};",
              "authority imports",
          )
          replace_once(
              authority,
              "static NEXT_GENERATION: AtomicU64 = AtomicU64::new(1);",
              "static NEXT_GENERATION: AtomicU64 = AtomicU64::new(1);\nstatic AUTHORITY_MUTATION: Mutex<()> = Mutex::new(());",
              "authority mutex",
          )
          replace_once(
              authority,
              "#[derive(Clone, Debug, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\", deny_unknown_fields)]\nstruct PendingAuthority",
              "#[derive(Clone, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\", deny_unknown_fields)]\nstruct PendingAuthority",
              "secret debug derive",
          )
          replace_once(
              authority,
              "pub(crate) struct ReportAuthorityStore {\n    root: PathBuf,\n    generation: String,\n}\n\n#[derive(Clone)]\npub(crate) struct NativeReportAuthorityLifecycle {\n    root: PathBuf,\n    generation: String,\n}",
              "pub(crate) struct ReportAuthorityStore {\n    root: ProvenDirectory,\n    generation: String,\n}\n\n#[derive(Clone)]\npub(crate) struct NativeReportAuthorityLifecycle {\n    root: ProvenDirectory,\n    generation: String,\n}",
              "proven roots",
          )

          replace_between(
              authority,
              "impl ReportAuthorityStore {",
              "impl NativeReportAuthorityLifecycle {",
              r'''impl ReportAuthorityStore {
    pub(crate) fn create(app: &AppHandle) -> Result<Self, String> {
        let root = owned_report_root(app, "report-authority", true)?
            .ok_or_else(|| "Could not create report-authority storage.".to_string())?;
        Self::create_proven(root)
    }

    pub(crate) fn open(app: &AppHandle) -> Result<Option<Self>, String> {
        let Some(root) = owned_report_root(app, "report-authority", false)? else {
            return Ok(None);
        };
        root.revalidate()?;
        let generation = read_regular_text_proven(&root, &root.join("generation"))?;
        if generation.trim().is_empty() {
            return Err("Report-authority generation is empty.".to_string());
        }
        Ok(Some(Self {
            root,
            generation: generation.trim().to_string(),
        }))
    }

    fn create_at(root: PathBuf) -> Result<Self, String> {
        let root = ProvenDirectory::establish(root, true, true)?
            .ok_or_else(|| "Could not create report-authority storage.".to_string())?;
        Self::create_proven(root)
    }

    fn create_proven(root: ProvenDirectory) -> Result<Self, String> {
        root.revalidate()?;
        let marker = root.join("generation");
        let generation = match read_regular_text_proven(&root, &marker) {
            Ok(value) if !value.trim().is_empty() => value.trim().to_string(),
            _ => create_or_read_generation(&root, &marker)?,
        };
        let store = Self { root, generation };
        {
            let _mutation = lock_authority_mutation()?;
            prune_expired_accepted_at(&store.root, now_millis()?)?;
        }
        Ok(store)
    }

    pub(crate) fn lifecycle(&self) -> NativeReportAuthorityLifecycle {
        NativeReportAuthorityLifecycle {
            root: self.root.clone(),
            generation: self.generation.clone(),
        }
    }

    pub(crate) fn reports(&self) -> Result<Vec<ReportCaseView>, String> {
        let _mutation = lock_authority_mutation()?;
        self.reports_under_guard()
    }

    pub(crate) fn reports_under_guard(&self) -> Result<Vec<ReportCaseView>, String> {
        self.ensure_generation()?;
        list_report_views_at(&self.root)
    }

    pub(crate) fn persist_accepted(&self, receipt: &ReportReceipt) -> Result<(), String> {
        let _mutation = lock_authority_mutation()?;
        self.ensure_generation()?;
        persist_accepted_at(&self.root, receipt)
    }

    pub(crate) fn deletion(&self, case_id: &str) -> Result<ReportDeletion, String> {
        let _mutation = lock_authority_mutation()?;
        self.ensure_generation()?;
        prune_expired_accepted_at(&self.root, now_millis()?)?;
        validate_case_id(case_id)?;
        let accepted = accepted_path(&self.root, case_id);
        if accepted.exists() {
            let receipt: ReportReceipt = read_json_regular_proven(&self.root, &accepted)?;
            return Ok(receipt.deletion);
        }
        let pending: PendingAuthority =
            read_json_regular_proven(&self.root, &pending_path(&self.root, case_id))?;
        Ok(pending.deletion)
    }

    pub(crate) fn dismiss(&self, case_id: &str) -> Result<(), String> {
        let _mutation = lock_authority_mutation()?;
        self.ensure_generation()?;
        remove_case_at(&self.root, case_id)
    }

    pub(crate) fn clear_all(app: &AppHandle) -> Result<(), String> {
        let _mutation = lock_authority_mutation()?;
        Self::clear_all_under_guard(app)
    }

    pub(crate) fn clear_all_under_guard(app: &AppHandle) -> Result<(), String> {
        if let Some(root) = owned_report_root(app, "report-authority", false)? {
            clear_report_authority_root(&root)?;
        }
        if let Some(root) = owned_report_root(app, "automatic-report-claims", false)? {
            clear_claim_root(&root)?;
        }
        Ok(())
    }

    fn ensure_generation(&self) -> Result<(), String> {
        self.root.revalidate()?;
        let current = read_regular_text_proven(&self.root, &self.root.join("generation"))?;
        if current.trim() == self.generation {
            Ok(())
        } else {
            Err("Report-authority storage changed while the report was active.".to_string())
        }
    }
}

''',
              "store implementation",
          )

          replace_between(
              authority,
              "impl NativeReportAuthorityLifecycle {",
              "pub(crate) fn claim_automatic_report",
              r'''impl NativeReportAuthorityLifecycle {
    pub(crate) fn granted(
