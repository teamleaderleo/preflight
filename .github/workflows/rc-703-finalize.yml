    root: &ProvenDirectory,
    path: &Path,
) -> Result<T, String> {
    if path.parent() != Some(root.path()) {
        return Err("Saved report authority escaped its proven directory.".to_string());
    }
    root.revalidate()?;
    let value = read_json_regular(path)?;
    root.revalidate()?;
    Ok(value)
}

fn read_json_regular<T: for<'de> Deserialize<'de>>(path: &Path) -> Result<T, String> {
    let metadata = path
        .symlink_metadata()
        .map_err(|error| format!("Could not inspect saved report authority: {error}"))?;
    if metadata.file_type().is_symlink()
        || !metadata.is_file()
        || metadata.len() > MAX_AUTHORITY_BYTES
    {
        return Err("Saved report authority is not a bounded regular file.".to_string());
    }
    let mut file = fs::File::open(path)
        .map_err(|error| format!("Could not open saved report authority: {error}"))?;
    let mut bytes = Vec::with_capacity(metadata.len() as usize);
    file.read_to_end(&mut bytes)
        .map_err(|error| format!("Could not read saved report authority: {error}"))?;
    serde_json::from_slice(&bytes)
        .map_err(|error| format!("Saved report authority is unreadable: {error}"))
}

fn read_regular_text_proven(root: &ProvenDirectory, path: &Path) -> Result<String, String> {
    if path.parent() != Some(root.path()) {
        return Err("Report-authority generation escaped its proven directory.".to_string());
    }
    root.revalidate()?;
    let value = read_regular_text(path)?;
    root.revalidate()?;
    Ok(value)
}

fn read_regular_text(path: &Path) -> Result<String, String> {
    let metadata = path
        .symlink_metadata()
        .map_err(|error| format!("Could not inspect report-authority generation: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_file() || metadata.len() > 256 {
        return Err("Report-authority generation is not a bounded regular file.".to_string());
    }
    fs::read_to_string(path)
        .map_err(|error| format!("Could not read report-authority generation: {error}"))
}

fn remove_case_at(root: &ProvenDirectory, case_id: &str) -> Result<(), String> {
    root.revalidate()?;
    validate_case_id(case_id)?;
    remove_file_if_regular_proven(root, &accepted_path(root, case_id))?;
    remove_file_if_regular_proven(root, &pending_path(root, case_id))?;
    root.revalidate()?;
    sync_directory(root.path())?;
    Ok(())
}

fn remove_file_if_regular_proven(root: &ProvenDirectory, path: &Path) -> Result<(), String> {
    if path.parent() != Some(root.path()) {
        return Err("Saved report authority escaped its proven directory.".to_string());
    }
    root.revalidate()?;
    let reviewed = match regular_file_identity(path) {
        Ok(identity) => identity,
        Err(error) if path.symlink_metadata().is_err_and(|io| io.kind() == std::io::ErrorKind::NotFound) => {
            return Ok(())
        }
        Err(error) => return Err(error),
    };
    run_removal_hook(root);
    root.revalidate()?;
    let current = regular_file_identity(path)?;
    if current != reviewed {
        return Err("Saved report authority changed after it was reviewed.".to_string());
    }
    fs::remove_file(path)
        .map_err(|error| format!("Could not remove saved report authority: {error}"))?;
    root.revalidate()?;
    Ok(())
}

