#[cfg(not(any(unix, windows)))]
#[derive(Clone, PartialEq, Eq)]
struct RegularFileIdentity {
    bytes: u64,
    modified: Option<SystemTime>,
}

#[cfg(not(any(unix, windows)))]
fn regular_file_identity(path: &Path) -> Result<RegularFileIdentity, String> {
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect saved report authority: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_file() {
        return Err("Saved report authority is not a regular file.".to_string());
    }
    Ok(RegularFileIdentity {
        bytes: metadata.len(),
        modified: metadata.modified().ok(),
    })
}

#[cfg(unix)]
fn create_owned_directory(path: &Path) -> std::io::Result<()> {
    use std::os::unix::fs::DirBuilderExt;
    let mut builder = fs::DirBuilder::new();
    builder.mode(0o700);
    builder.create(path)
}

#[cfg(not(unix))]
fn create_owned_directory(path: &Path) -> std::io::Result<()> {
    fs::create_dir(path)
}

#[cfg(unix)]
fn require_private_directory(path: &Path) -> Result<(), String> {
    use std::os::unix::fs::MetadataExt;
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect report-authority privacy: {error}"))?;
    if metadata.mode() & 0o077 != 0 {
        return Err("Report-authority storage is not private to the current user.".to_string());
    }
    Ok(())
}

#[cfg(not(unix))]
fn require_private_directory(_path: &Path) -> Result<(), String> {
    Ok(())
}

fn clear_report_authority_root(root: &ProvenDirectory) -> Result<(), String> {
    root.revalidate()?;
    let entries = fs::read_dir(root.path())
        .map_err(|error| format!("Could not read saved report authority: {error}"))?;
    for entry in entries {
        let entry = entry
            .map_err(|error| format!("Could not read saved report authority: {error}"))?;
        if entry.file_name() != "generation" {
            return Err(
                "Saved report authority still contains actionable or unexpected state.".to_string(),
            );
        }
        remove_file_if_regular_proven(root, &entry.path())?;
    }
    root.revalidate()?;
    fs::remove_dir(root.path())
        .map_err(|error| format!("Could not clear saved report authority: {error}"))
}

fn clear_claim_root(root: &ProvenDirectory) -> Result<(), String> {
    root.revalidate()?;
    let entries = fs::read_dir(root.path())
        .map_err(|error| format!("Could not read automatic-report claim storage: {error}"))?;
    for entry in entries {
        let entry = entry
            .map_err(|error| format!("Could not read automatic-report claim storage: {error}"))?;
        let name = entry.file_name().to_string_lossy().into_owned();
        if !name.ends_with(".claim") {
            return Err("Automatic-report claim storage contains unexpected state.".to_string());
        }
        remove_file_if_regular_proven(root, &entry.path())?;
    }
    root.revalidate()?;
    fs::remove_dir(root.path())
        .map_err(|error| format!("Could not clear automatic-report claim storage: {error}"))
}

#[cfg(test)]
type MutationHook = Box<dyn FnOnce() + Send>;

#[cfg(test)]
static BEFORE_SECRET_PUBLICATION: Mutex<Option<(PathBuf, MutationHook)>> = Mutex::new(None);
#[cfg(test)]
static BEFORE_SECRET_REMOVAL: Mutex<Option<(PathBuf, MutationHook)>> = Mutex::new(None);

#[cfg(test)]
fn set_publication_hook(root: &Path, hook: impl FnOnce() + Send + 'static) {
    *BEFORE_SECRET_PUBLICATION.lock().unwrap() = Some((root.to_path_buf(), Box::new(hook)));
}

#[cfg(test)]
fn set_removal_hook(root: &Path, hook: impl FnOnce() + Send + 'static) {
    *BEFORE_SECRET_REMOVAL.lock().unwrap() = Some((root.to_path_buf(), Box::new(hook)));
}

#[cfg(test)]
fn run_hook(slot: &Mutex<Option<(PathBuf, MutationHook)>>, root: &ProvenDirectory) {
    let hook = {
        let mut slot = slot.lock().unwrap();
        if slot
            .as_ref()
            .is_some_and(|(target, _)| target.as_path() == root.path())
        {
            slot.take().map(|(_, hook)| hook)
        } else {
            None
        }
    };
    if let Some(hook) = hook {
        hook();
    }
}

#[cfg(test)]
fn run_publication_hook(root: &ProvenDirectory) {
    run_hook(&BEFORE_SECRET_PUBLICATION, root);
}

#[cfg(not(test))]
fn run_publication_hook(_root: &ProvenDirectory) {}

#[cfg(test)]
fn run_removal_hook(root: &ProvenDirectory) {
    run_hook(&BEFORE_SECRET_REMOVAL, root);
}

#[cfg(not(test))]
fn run_removal_hook(_root: &ProvenDirectory) {}

