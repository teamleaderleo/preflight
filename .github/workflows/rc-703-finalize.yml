}

''',
              "lifecycle implementation",
          )

          replace_between(
              authority,
              "pub(crate) fn claim_automatic_report",
              "fn create_or_read_generation",
              r'''pub(crate) fn lock_authority_mutation() -> Result<MutexGuard<'static, ()>, String> {
    AUTHORITY_MUTATION
        .lock()
        .map_err(|_| "The report-authority mutation lock is unavailable.".to_string())
}

pub(crate) fn claim_automatic_report(app: &AppHandle, identity: &str) -> Result<bool, String> {
    let _mutation = lock_authority_mutation()?;
    let root = owned_report_root(app, "automatic-report-claims", true)?
        .ok_or_else(|| "Could not create automatic-report claim storage.".to_string())?;
    claim_automatic_report_in(&root, identity)
}

fn claim_automatic_report_at(root: &Path, identity: &str) -> Result<bool, String> {
    let _mutation = lock_authority_mutation()?;
    let root = ProvenDirectory::establish(root.to_path_buf(), true, true)?
        .ok_or_else(|| "Could not create automatic-report claim storage.".to_string())?;
    claim_automatic_report_in(&root, identity)
}

fn claim_automatic_report_in(root: &ProvenDirectory, identity: &str) -> Result<bool, String> {
    if identity.is_empty() || identity.len() > 1024 || identity.contains('\0') {
        return Err("The automatic report identity is invalid.".to_string());
    }
    root.revalidate()?;
    prune_claims(root)?;
    let digest = Sha256::digest(identity.as_bytes())
        .iter()
        .map(|byte| format!("{byte:02x}"))
        .collect::<String>();
    let path = root.join(format!("{digest}.claim"));
    run_publication_hook(root);
    root.revalidate()?;
    match OpenOptions::new().write(true).create_new(true).open(&path) {
        Ok(mut file) => {
            make_private_file(&file)?;
            file.write_all(format!("{}\n", now_millis()?).as_bytes())
                .map_err(|error| format!("Could not write automatic-report claim: {error}"))?;
            file.sync_all()
                .map_err(|error| format!("Could not save automatic-report claim: {error}"))?;
            root.revalidate()?;
            sync_directory(root.path())?;
            Ok(true)
        }
        Err(error) if error.kind() == std::io::ErrorKind::AlreadyExists => Ok(false),
        Err(error) => Err(format!(
            "Could not claim the failed run for automatic reporting: {error}"
        )),
    }
}

fn prune_claims(root: &ProvenDirectory) -> Result<(), String> {
    root.revalidate()?;
    let mut claims = Vec::new();
    for entry in fs::read_dir(root.path())
        .map_err(|error| format!("Could not read automatic-report claim storage: {error}"))?
    {
        let entry = entry
            .map_err(|error| format!("Could not read automatic-report claim storage: {error}"))?;
        let name = entry.file_name().to_string_lossy().into_owned();
        if !name.ends_with(".claim") {
            continue;
        }
        let metadata = entry
            .path()
            .symlink_metadata()
            .map_err(|error| format!("Could not inspect automatic-report claim: {error}"))?;
        if metadata.file_type().is_symlink() || !metadata.is_file() {
            return Err("Automatic-report claim is not a regular file.".to_string());
        }
        let modified = metadata
            .modified()
            .map_err(|error| format!("Could not inspect automatic-report claim age: {error}"))?;
        claims.push((modified, entry.path()));
    }
    claims.sort_by_key(|(modified, _)| *modified);
    while claims.len() >= MAX_CLAIMS {
        let (_, path) = claims.remove(0);
        remove_file_if_regular_proven(root, &path)?;
    }
    Ok(())
}

#[derive(Clone)]
struct DirectoryAnchor {
    path: PathBuf,
    identity: DirectoryIdentity,
}

#[derive(Clone)]
struct ProvenDirectory {
    chain: Vec<DirectoryAnchor>,
}

impl ProvenDirectory {
    fn establish(path: PathBuf, create: bool, private: bool) -> Result<Option<Self>, String> {
        let name = path
            .file_name()
            .ok_or_else(|| "Saved report authority has no directory name.".to_string())?
            .to_os_string();
        let parent = path
            .parent()
            .ok_or_else(|| "Saved report authority has no parent directory.".to_string())?;
        let parent = fs::canonicalize(parent).map_err(|error| {
            format!("Could not resolve report-authority parent directory: {error}")
        })?;
        let parent = directory_anchor(&parent, "Report-authority parent")?;
        let Some(child) = establish_child(&parent, &name, create, private)? else {
            return Ok(None);
        };
        let proof = Self {
            chain: vec![parent, child],
        };
        proof.revalidate()?;
        Ok(Some(proof))
    }

    fn child(&self, name: &str, create: bool, private: bool) -> Result<Option<Self>, String> {
        self.revalidate()?;
        let parent = self
            .chain
            .last()
            .ok_or_else(|| "Saved report authority has no proven parent.".to_string())?;
        let Some(child) = establish_child(parent, std::ffi::OsStr::new(name), create, private)?
        else {
            return Ok(None);
        };
        let mut chain = self.chain.clone();
        chain.push(child);
        let proof = Self { chain };
        proof.revalidate()?;
        Ok(Some(proof))
    }

    fn path(&self) -> &Path {
        self.chain
            .last()
            .expect("a proven directory always has an anchor")
            .path
            .as_path()
    }

    fn revalidate(&self) -> Result<(), String> {
        for (index, anchor) in self.chain.iter().enumerate() {
            let current = directory_identity(&anchor.path, "Saved report-authority directory")?;
            if current != anchor.identity {
                return Err(
                    "Saved report-authority directory changed after it was reviewed.".to_string(),
                );
            }
            let canonical = fs::canonicalize(&anchor.path).map_err(|error| {
                format!("Could not recheck saved report-authority directory: {error}")
            })?;
            if canonical != anchor.path {
                return Err(
                    "Saved report-authority directory became an alias after it was reviewed."
                        .to_string(),
                );
            }
            if index > 0
                && anchor.path.parent()
                    != self.chain.get(index - 1).map(|parent| parent.path.as_path())
            {
                return Err(
                    "Saved report-authority directory escaped its reviewed parent.".to_string(),
                );
            }
        }
        Ok(())
    }
}

impl Deref for ProvenDirectory {
    type Target = Path;

    fn deref(&self) -> &Self::Target {
        self.path()
    }
}

fn owned_report_root(
    app: &AppHandle,
    name: &str,
    create: bool,
) -> Result<Option<ProvenDirectory>, String> {
    let home = app
        .path()
        .home_dir()
        .map_err(|error| format!("Could not locate the home directory: {error}"))?;
    let home = fs::canonicalize(home)
        .map_err(|error| format!("Could not resolve the home directory: {error}"))?;
    let home = directory_anchor(&home, "Home directory")?;
    let home = ProvenDirectory { chain: vec![home] };
    let Some(preflight) = home.child(".starsector-preflight", create, false)? else {
        return Ok(None);
    };
    let Some(support) = preflight.child("support", create, false)? else {
        return Ok(None);
    };
    support.child(name, create, true)
}

fn establish_child(
    parent: &DirectoryAnchor,
    name: &std::ffi::OsStr,
    create: bool,
    private: bool,
) -> Result<Option<DirectoryAnchor>, String> {
    let path = parent.path.join(name);
    match fs::symlink_metadata(&path) {
        Ok(_) => {}
        Err(error) if error.kind() == std::io::ErrorKind::NotFound && !create => return Ok(None),
        Err(error) if error.kind() == std::io::ErrorKind::NotFound => {
            match create_owned_directory(&path) {
                Ok(()) => {}
                Err(error) if error.kind() == std::io::ErrorKind::AlreadyExists => {}
                Err(error) => {
                    return Err(format!("Could not create report-authority storage: {error}"));
                }
            }
        }
        Err(error) => {
            return Err(format!("Could not inspect report-authority storage: {error}"));
        }
    }
    let anchor = directory_anchor(&path, "Saved report-authority directory")?;
    if anchor.path.parent() != Some(parent.path.as_path()) {
        return Err("Saved report-authority directory escapes its owned parent.".to_string());
    }
    if private {
        require_private_directory(&anchor.path)?;
    }
    Ok(Some(anchor))
}

fn directory_anchor(path: &Path, label: &str) -> Result<DirectoryAnchor, String> {
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect {label}: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_dir() {
        return Err(format!("{label} is not a real directory."));
    }
    let canonical = fs::canonicalize(path)
        .map_err(|error| format!("Could not resolve {label}: {error}"))?;
    if canonical != path {
        return Err(format!("{label} is an alias or symbolic link."));
    }
    Ok(DirectoryAnchor {
        path: canonical,
        identity: directory_identity(path, label)?,
    })
}

#[cfg(unix)]
#[derive(Clone, Copy, PartialEq, Eq)]
struct DirectoryIdentity {
    device: u64,
    inode: u64,
}

#[cfg(unix)]
fn directory_identity(path: &Path, label: &str) -> Result<DirectoryIdentity, String> {
    use std::os::unix::fs::MetadataExt;
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect {label}: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_dir() {
        return Err(format!("{label} is not a real directory."));
    }
    Ok(DirectoryIdentity {
        device: metadata.dev(),
        inode: metadata.ino(),
    })
}

#[cfg(windows)]
#[derive(Clone, Copy, PartialEq, Eq)]
struct DirectoryIdentity {
    creation_time: u64,
}

#[cfg(windows)]
fn directory_identity(path: &Path, label: &str) -> Result<DirectoryIdentity, String> {
    use std::os::windows::fs::MetadataExt;
    const FILE_ATTRIBUTE_REPARSE_POINT: u32 = 0x0400;
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect {label}: {error}"))?;
    if !metadata.is_dir() || metadata.file_attributes() & FILE_ATTRIBUTE_REPARSE_POINT != 0 {
        return Err(format!("{label} is not a real directory."));
    }
    Ok(DirectoryIdentity {
        creation_time: metadata.creation_time(),
    })
}

#[cfg(not(any(unix, windows)))]
#[derive(Clone, PartialEq, Eq)]
struct DirectoryIdentity {
    canonical: PathBuf,
}

#[cfg(not(any(unix, windows)))]
fn directory_identity(path: &Path, label: &str) -> Result<DirectoryIdentity, String> {
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect {label}: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_dir() {
        return Err(format!("{label} is not a real directory."));
    }
    Ok(DirectoryIdentity {
        canonical: fs::canonicalize(path)
            .map_err(|error| format!("Could not resolve {label}: {error}"))?,
    })
}

#[cfg(unix)]
#[derive(Clone, Copy, PartialEq, Eq)]
struct RegularFileIdentity {
    device: u64,
    inode: u64,
}

#[cfg(unix)]
fn regular_file_identity(path: &Path) -> Result<RegularFileIdentity, String> {
    use std::os::unix::fs::MetadataExt;
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect saved report authority: {error}"))?;
    if metadata.file_type().is_symlink() || !metadata.is_file() {
        return Err("Saved report authority is not a regular file.".to_string());
    }
    Ok(RegularFileIdentity {
        device: metadata.dev(),
        inode: metadata.ino(),
    })
}

#[cfg(windows)]
#[derive(Clone, Copy, PartialEq, Eq)]
struct RegularFileIdentity {
    creation_time: u64,
    bytes: u64,
}

#[cfg(windows)]
fn regular_file_identity(path: &Path) -> Result<RegularFileIdentity, String> {
    use std::os::windows::fs::MetadataExt;
    const FILE_ATTRIBUTE_REPARSE_POINT: u32 = 0x0400;
    let metadata = fs::symlink_metadata(path)
        .map_err(|error| format!("Could not inspect saved report authority: {error}"))?;
    if !metadata.is_file() || metadata.file_attributes() & FILE_ATTRIBUTE_REPARSE_POINT != 0 {
        return Err("Saved report authority is not a regular file.".to_string());
    }
    Ok(RegularFileIdentity {
