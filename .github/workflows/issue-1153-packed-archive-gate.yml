name: Issue 1153 packed tessellation archive gate

on:
  push:
    branches:
      - lantern/1153-render-sync
    paths:
      - '.github/workflows/issue-1153-packed-archive-gate.yml'
      - 'preflight-agent/src/main/java/dev/starsector/preflight/agent/GraphicsLibTessellateArrayRuntime.java'
      - 'preflight-agent/src/main/java/dev/starsector/preflight/agent/GraphicsLibTessellateArrayPlan.java'
      - 'preflight-agent/src/main/java/dev/starsector/preflight/agent/GraphicsLibTessellatePackedReplayPlan.java'
      - 'preflight-agent/src/main/java/dev/starsector/preflight/agent/GraphicsLibTessellateArrayVboStatePlan.java'
      - 'preflight-agent/src/test/java/dev/starsector/preflight/agent/GraphicsLibTessellateArrayInstalledAdapterIT.java'

permissions:
  contents: read

jobs:
  stock-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - name: Fetch reviewed GraphicsLib 1.12.1 archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/Graphics.jar" \
            'https://raw.githubusercontent.com/ZMKiller/starsector-ru-mods/6e16cb47ee0bf8e3ac01e2121b5527083c744dca/GraphicsLib/jars/Graphics.jar'
          test "$(sha256sum "$RUNNER_TEMP/Graphics.jar" | awk '{print $1}')" = \
            '832064013fe853731941e547842884ba121fb8b20eff08d24137f7a2c916903a'
      - name: Transform real Tessellate class with packed replay
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -pl preflight-agent -am \
            -Dpreflight.graphicslib.jar="$RUNNER_TEMP/Graphics.jar" \
            -Dit.test=GraphicsLibTessellateArrayInstalledAdapterIT \
            -Dsurefire.failIfNoSpecifiedTests=false \
            verify
