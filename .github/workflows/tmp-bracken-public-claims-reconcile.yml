name: Temporary Bracken public claims reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/tmp-bracken-public-claims-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/reconcile-public-claims-current-main
      - name: Reconcile current public claims
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('README.md'),
              Path('docs/beta-announcement-draft.md'),
              Path('docs/leo-talking-points.md'),
              Path('docs/public-writing-sales-inventory.md'),
              Path('docs/release-post-draft.md'),
              Path('docs/releases/0.1.0.md'),
          ]
          replacements = {
              'A durable local ledger': 'A bounded local play-history ledger',
              'a durable local ledger': 'a bounded local play-history ledger',
              'Preflight keeps a durable local ledger': 'Preflight keeps a bounded local play-history ledger',
              'game or mod JARs, executables, assets, activation data, or saves': 'game or mod JARs, executables, assets, or saves',
              "Starsector's JARs, executables, assets, activation data, mods, and saves": "Starsector's JARs, executables, assets, mods, and saves",
              'Starsector or mod JARs, executables, assets, activation data, or saves': 'Starsector or mod JARs, executables, assets, or saves',
              'saves, game assets, mod archives, or activation data': 'saves, game assets, or mod archives',
          }

          changed = []
          for path in files:
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit('current main no longer contains the reviewed overclaims')
          print('changed:', *changed, sep='\n')
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- README.md docs
          git config user.name 'Bracken'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md docs
          git commit -m 'Reconcile public mutation and play-history claims'
          git push origin HEAD:docs/reconcile-public-claims-current-main
