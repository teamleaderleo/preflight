name: Repair profile activation safety on current main

on:
  push:
    branches:
      - codex/propose-fix-for-symlink-vulnerability

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/propose-fix-for-symlink-vulnerability
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-build-jdk
        with:
          java-version: '17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json
      - name: Apply reviewed activation containment repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name preflight-agent
          git config user.email preflight-agent@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new)

          path = Path('preflight-cli/src/main/java/dev/starsector/preflight/cli/GameLayout.java')
          text = path.read_text()
          text = replace_once(
              text,
              'import java.nio.file.Files;\nimport java.nio.file.Path;\n',
              'import java.nio.file.Files;\nimport java.nio.file.LinkOption;\nimport java.nio.file.Path;\n',
              'GameLayout import',
          )
          text = replace_once(
              text,
              'record GameLayout(Path installRoot, Path modsDirectory, Path enabledModsFile, List<String> diagnostics) {\n    static GameLayout locate(Path installRoot) throws IOException {\n',
              '''record GameLayout(Path installRoot, Path modsDirectory, Path enabledModsFile, List<String> diagnostics) {\n    GameLayout requireMutationSafe() throws IOException {\n        Path realRoot = installRoot.toRealPath();\n        Path realMods = modsDirectory.toRealPath();\n        if (!realMods.startsWith(realRoot)) {\n            throw new IOException("Refusing to modify enabled_mods.json outside the selected install: "\n                    + modsDirectory);\n        }\n        if (!Files.isRegularFile(enabledModsFile, LinkOption.NOFOLLOW_LINKS)) {\n            throw new IOException("Refusing to modify a symlink or non-file enabled_mods.json: "\n                    + enabledModsFile);\n        }\n        Path realEnabled = enabledModsFile.toRealPath();\n        if (!realEnabled.getParent().equals(realMods)) {\n            throw new IOException("Refusing to modify enabled_mods.json outside the selected mods directory: "\n                    + enabledModsFile);\n        }\n        return new GameLayout(installRoot, realMods, realEnabled, diagnostics);\n    }\n\n    static GameLayout locate(Path installRoot) throws IOException {\n''',
              'GameLayout mutation safety',
          )
          path.write_text(text)

          path = Path('preflight-cli/src/main/java/dev/starsector/preflight/cli/ProfileCommand.java')
          text = path.read_text()
          text = replace_once(
              text,
              '''    private static int activateOwned(\n            PreflightHome home,\n            Path installRoot,\n            String name,\n            boolean confirmed,\n            boolean json,\n            PrintStream out) throws Exception {\n        GameLayout layout = GameLayout.locate(installRoot);\n        SavedProfile profile = readProfile(profilePath(home, name));\n''',
              '''    private static int activateOwned(\n            PreflightHome home,\n            Path installRoot,\n            String name,\n            boolean confirmed,\n            boolean json,\n            PrintStream out) throws Exception {\n        GameLayout layout = GameLayout.locate(installRoot);\n        if (confirmed) {\n            layout = layout.requireMutationSafe();\n        }\n        SavedProfile profile = readProfile(profilePath(home, name));\n''',
              'ProfileCommand confirmed activation boundary',
          )
          path.write_text(text)

          path = Path('preflight-cli/src/test/java/dev/starsector/preflight/cli/GameLayoutTest.java')
          text = path.read_text()
          text = replace_once(
              text,
              'import static org.junit.jupiter.api.Assertions.assertEquals;\n\nimport java.nio.file.Files;\n',
              'import static org.junit.jupiter.api.Assertions.assertEquals;\nimport static org.junit.jupiter.api.Assertions.assertThrows;\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n\nimport java.io.IOException;\nimport java.nio.file.Files;\n',
              'GameLayoutTest imports',
          )
          text = replace_once(
              text,
              '''        assertEquals(enabled.toAbsolutePath().normalize(), layout.enabledModsFile());\n    }\n}\n''',
              '''        assertEquals(enabled.toAbsolutePath().normalize(), layout.enabledModsFile());\n    }\n\n    @Test\n    void refusesMutationThroughModsDirectorySymlinkOutsideInstall() throws Exception {\n        Path game = Files.createDirectories(temporaryDirectory.resolve("game"));\n        Path outsideMods = Files.createDirectories(temporaryDirectory.resolve("outside-mods"));\n        Files.writeString(outsideMods.resolve("enabled_mods.json"), "{\\"enabledMods\\":[]}");\n        try {\n            Files.createSymbolicLink(game.resolve("mods"), outsideMods);\n        } catch (UnsupportedOperationException | IOException unavailable) {\n            return;\n        }\n\n        GameLayout layout = GameLayout.locate(game);\n        IOException error = assertThrows(IOException.class, layout::requireMutationSafe);\n\n        assertTrue(error.getMessage().contains("outside the selected install"), error.getMessage());\n    }\n\n    @Test\n    void refusesMutationWhenEnabledModsFileIsASymlink() throws Exception {\n        Path game = Files.createDirectories(temporaryDirectory.resolve("game"));\n        Path mods = Files.createDirectories(game.resolve("mods"));\n        Path outside = Files.writeString(\n                temporaryDirectory.resolve("enabled_mods.json"), "{\\"enabledMods\\":[]}");\n        try {\n            Files.createSymbolicLink(mods.resolve("enabled_mods.json"), outside);\n        } catch (UnsupportedOperationException | IOException unavailable) {\n            return;\n        }\n\n        GameLayout layout = GameLayout.locate(game);\n        IOException error = assertThrows(IOException.class, layout::requireMutationSafe);\n\n        assertTrue(error.getMessage().contains("symlink or non-file"), error.getMessage());\n    }\n}\n''',
              'GameLayoutTest cases',
          )
          path.write_text(text)
          PY
          ./mvnw -pl preflight-cli -am -Dtest=GameLayoutTest,ProfileCommandTest -Dsurefire.failIfNoSpecifiedTests=false test
          npm ci --prefix preflight-desktop
          npm run capabilities:review --prefix preflight-desktop
          rm .github/workflows/repair-756-current-main.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(cli): contain confirmed profile activation"
          git push origin HEAD:codex/propose-fix-for-symlink-vulnerability
