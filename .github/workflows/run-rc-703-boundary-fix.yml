name: Run bounded #703 RC boundary correction

on:
  push:
    branches:
      - fix/desktop-report-authority

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/desktop-report-authority
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Integrate live main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name preflight-agent
          git config user.email preflight-agent@users.noreply.github.com
          git fetch origin main
          git merge --no-edit -X theirs origin/main

      - name: Execute reviewed source correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/rc-703-boundary-fix.yml').read_text()
          start_marker = "      - name: Apply bounded source correction\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Format and refresh reviewed capability locks\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('reviewed correction helper boundaries changed')
          body = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/preflight-703-correction.sh').write_text(script)
          PY
          bash /tmp/preflight-703-correction.sh

      - name: Format and refresh reviewed capability locks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path preflight-desktop/src-tauri/Cargo.toml
          npm run capabilities:review --prefix preflight-desktop

      - name: Verify bounded correction
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path preflight-desktop/src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path preflight-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          npm ci --prefix preflight-desktop
          npm test --prefix preflight-desktop
          npm run build --prefix preflight-desktop

      - name: Publish corrected branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rc-703-boundary-fix.yml
          rm .github/workflows/rc-703-finalize.yml
          rm .github/workflows/run-rc-703-boundary-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(desktop): bind report authority to owned commit boundaries"
          git push origin HEAD:fix/desktop-report-authority
