name: Apply reviewed #703 report correction

on:
  push:
    branches:
      - fix/desktop-report-authority

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/desktop-report-authority
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply reviewed correction on live main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name preflight-agent
          git config user.email preflight-agent@users.noreply.github.com
          git fetch origin main
          git merge --no-edit -X ours origin/main
          git show 6446ab73ba424dbd6a653aac461962e2bd2fa141:.github/workflows/rc-703-finalize.yml > /tmp/reviewed-703.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/reviewed-703.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n          cargo fmt --manifest-path preflight-desktop/src-tauri/Cargo.toml"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('reviewed #703 correction boundaries changed')
          body = text.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines()
          Path('/tmp/reviewed-703.py').write_text('\n'.join(
              line[10:] if line.startswith('          ') else line for line in lines
          ) + '\n')
          PY
          python3 /tmp/reviewed-703.py
          cargo fmt --manifest-path preflight-desktop/src-tauri/Cargo.toml
          npm run capabilities:review --prefix preflight-desktop
          cargo test --locked --manifest-path preflight-desktop/src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path preflight-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          npm ci --prefix preflight-desktop
          npm test --prefix preflight-desktop
          npm run build --prefix preflight-desktop
          rm -f .github/703-finalize-failure.txt
          rm .github/workflows/apply-reviewed-703.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(report): bind authority to reviewed filesystem generations"
          git push origin HEAD:fix/desktop-report-authority
