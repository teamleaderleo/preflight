name: Java reproducibility

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '41 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-build-jdk
      - name: Build twice and compare release artifacts
        run: bash scripts/verify_java_reproducibility.sh
