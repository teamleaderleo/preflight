name: Texture cache tests

on:
  pull_request:
    paths:
      - 'preflight-core/**'
      - 'preflight-cli/**'
      - '.github/workflows/texture-cache-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'preflight-core/**'
      - 'preflight-cli/**'
      - '.github/workflows/texture-cache-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

  focused:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prepared-blob-format
            module: preflight-core
            tests: PreparedTextureIOTest,PreparedTexturePersistencePropertyTest,ManifestTextureCacheLookupTest
          - name: prepared-pack-format
            module: preflight-core
            tests: PreparedTexturePackIOTest,PreparedTexturePackPersistencePropertyTest
          - name: manifest-format
            module: preflight-core
            tests: TextureManifestIOTest,TextureManifestPersistencePropertyTest,TextureSourceGenerationProofIOTest
          - name: block-manifest-format
            module: preflight-core
            tests: BlockCacheManifestIOTest,BlockCacheManifestPersistencePropertyTest
          - name: manifest-validator
            module: preflight-core
            tests: TextureManifestValidatorTest
          - name: batch-builder
            module: preflight-cli
            tests: TextureBatchBuilderTest,TextureParallelHashingTest
          - name: batch-cli
            module: preflight-cli
            tests: TextureBatchCommandTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - name: Run focused suite
        run: >-
          mvn --batch-mode --no-transfer-progress
          -pl ${{ matrix.module }} -am
          -Dtest=${{ matrix.tests }}
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  real-profile-preparation-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - name: Run cross-platform source generation and preparation contract tests
        shell: bash
        run: >-
          mvn --batch-mode --no-transfer-progress
          -pl preflight-cli -am
          -Dtest=TextureSourceGenerationAuthorityTest,ResourceIndexBuilderTest,LookupEquivalenceTest,PrepareCommandTest,CurrentTextureCacheTest,StarsectorRunLogEvidenceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
