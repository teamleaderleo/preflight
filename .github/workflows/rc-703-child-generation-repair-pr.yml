name: RC 703 child-generation repair PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rc-703-child-generation-repair-pr.yml'
      - 'scripts/rc_703_child_generation_repair.py'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/desktop-report-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/desktop-report-authority
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Apply reviewed repair
        run: python3 scripts/rc_703_child_generation_repair.py

      - name: Format and test the exact helper boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path preflight-desktop/src-tauri/Cargo.toml
          cargo test --locked --manifest-path preflight-desktop/src-tauri/Cargo.toml --test report_authority_dir

      - name: Commit product bytes and remove temporary repair files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rc-703-child-generation-repair.yml \
                 .github/workflows/rc-703-child-generation-repair-pr.yml \
                 scripts/rc_703_child_generation_repair.py
          git add preflight-desktop/src-tauri/src/report_authority_dir.rs \
                  preflight-desktop/src-tauri/tests/report_authority_dir.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Bind report-authority child deletion to exact generation'
          git push origin HEAD:fix/desktop-report-authority
