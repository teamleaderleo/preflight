name: VPS verification

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        required: true
        default: full
        type: choice
        options:
          - full
          - focused
          - analysis
          - coverage
          - package
      offline:
        description: Disable network access inside the build container
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: starsector-preflight-vps
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       (github.event.comment.body == '/vps verify' ||
        startsWith(github.event.comment.body, '/vps verify ')))
    runs-on: [self-hosted, linux, starsector-preflight]
    timeout-minutes: 60

    steps:
      - name: Resolve trusted SHA and suite
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_API_URL: ${{ github.event.issue.pull_request.url }}
          DISPATCH_SUITE: ${{ github.event.inputs.suite }}
          DISPATCH_OFFLINE: ${{ github.event.inputs.offline }}
          DEFAULT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ref="$DEFAULT_SHA"
          suite="${DISPATCH_SUITE:-full}"
          offline=0

          if [[ "$EVENT_NAME" == issue_comment ]]; then
            case "$COMMENT_BODY" in
              '/vps verify') suite=full ;;
              '/vps verify full') suite=full ;;
              '/vps verify focused') suite=focused ;;
              '/vps verify analysis') suite=analysis ;;
              '/vps verify coverage') suite=coverage ;;
              '/vps verify package') suite=package ;;
              *) echo "Unsupported VPS verification command: $COMMENT_BODY" >&2; exit 64 ;;
            esac

            metadata="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$PR_API_URL")"
            test "$(jq -r '.state' <<<"$metadata")" = open
            test "$(jq -r '.head.repo.full_name // empty' <<<"$metadata")" = "$GITHUB_REPOSITORY"
            ref="$(jq -r '.head.sha // empty' <<<"$metadata")"
          elif [[ "$DISPATCH_OFFLINE" == true ]]; then
            offline=1
          fi

          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Resolved ref is not an exact commit SHA" >&2; exit 64; }
          case "$suite" in
            full|focused|analysis|coverage|package) ;;
            *) echo "Unsupported verification suite: $suite" >&2; exit 64 ;;
          esac
          [[ "$offline" == 0 || "$offline" == 1 ]] || { echo "Invalid offline mode" >&2; exit 64; }

          printf 'ref=%s\nsuite=%s\noffline=%s\n' "$ref" "$suite" "$offline" >> "$GITHUB_OUTPUT"

      - name: Run operator-owned verification launcher
        shell: bash
        env:
          REQUESTED_SHA: ${{ steps.request.outputs.ref }}
          REQUESTED_SUITE: ${{ steps.request.outputs.suite }}
          REQUESTED_OFFLINE: ${{ steps.request.outputs.offline }}
          WORKFLOW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          launcher=/usr/local/libexec/starsector-preflight-ci-v1
          if [[ ! -x "$launcher" ]]; then
            echo "Required operator-owned launcher is missing: $launcher" >&2
            echo "Provision it from a reviewed revision before enabling VPS verification." >&2
            exit 69
          fi

          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Workflow revision is not an exact commit SHA." >&2
            exit 64
          }
          launcher_source_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/build/ci/starsector-preflight-ci-v1?ref=${WORKFLOW_SHA}"
          expected_launcher_sha256="$(
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$launcher_source_api" \
              | jq -r '.content // empty' \
              | tr -d '\n' \
              | base64 --decode \
              | sha256sum \
              | awk '{print $1}'
          )"
          actual_launcher_sha256="$(sha256sum "$launcher" | awk '{print $1}')"
          [[ "$expected_launcher_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Could not resolve the reviewed launcher digest for workflow revision $WORKFLOW_SHA." >&2
            exit 69
          }
          if [[ "$actual_launcher_sha256" != "$expected_launcher_sha256" ]]; then
            echo "Installed VPS launcher does not match workflow revision $WORKFLOW_SHA." >&2
            echo "Expected SHA-256: $expected_launcher_sha256" >&2
            echo "Installed SHA-256: $actual_launcher_sha256" >&2
            echo "Provision the reviewed launcher before running VPS verification." >&2
            exit 77
          fi
          echo "launcherSha256=$actual_launcher_sha256"

          network_mode=online
          if [[ "$REQUESTED_OFFLINE" == 1 ]]; then
            network_mode=offline
          fi

          exec "$launcher" "$REQUESTED_SHA" "$REQUESTED_SUITE" "$network_mode"
