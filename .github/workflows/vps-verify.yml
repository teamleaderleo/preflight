name: VPS verification

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        required: true
        default: full
        type: choice
        options:
          - full
          - focused
          - analysis
          - coverage
          - package
      offline:
        description: Verify with no container network using the operator-owned dependency seed
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: starsector-preflight-vps
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       (github.event.comment.body == '/vps verify' ||
        startsWith(github.event.comment.body, '/vps verify ')))
    runs-on: [self-hosted, linux, starsector-preflight]
    timeout-minutes: 60

    steps:
      - name: Resolve trusted ref and suite
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_API_URL: ${{ github.event.issue.pull_request.url }}
          DISPATCH_SUITE: ${{ github.event.inputs.suite }}
          DISPATCH_OFFLINE: ${{ github.event.inputs.offline }}
          DEFAULT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ref="$DEFAULT_SHA"
          suite="${DISPATCH_SUITE:-full}"
          offline=0

          if [[ "$EVENT_NAME" == issue_comment ]]; then
            case "$COMMENT_BODY" in
              '/vps verify') suite=full ;;
              '/vps verify full') suite=full ;;
              '/vps verify focused') suite=focused ;;
              '/vps verify analysis') suite=analysis ;;
              '/vps verify coverage') suite=coverage ;;
              '/vps verify package') suite=package ;;
              *) echo "Unsupported VPS verification command: $COMMENT_BODY" >&2; exit 64 ;;
            esac

            metadata="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$PR_API_URL")"
            test "$(jq -r '.state' <<<"$metadata")" = open
            test "$(jq -r '.head.repo.full_name // empty' <<<"$metadata")" = "$GITHUB_REPOSITORY"
            ref="$(jq -r '.head.sha // empty' <<<"$metadata")"
            test -n "$ref"
          elif [[ "$DISPATCH_OFFLINE" == true ]]; then
            offline=1
          fi

          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Resolved ref is not an exact 40-character commit SHA: $ref" >&2
            exit 65
          }
          printf 'ref=%s\nsuite=%s\noffline=%s\n' "$ref" "$suite" "$offline" >> "$GITHUB_OUTPUT"

      - name: Verify host-owned launcher
        shell: bash
        env:
          EXPECTED_LAUNCHER_SHA256: d4f47e7190235107ef84c4cb03e23419c014b624b420369be00f9e8ae02cf7f1
        run: |
          set -Eeuo pipefail
          launcher=/usr/local/libexec/starsector-preflight-ci-v1
          test -x "$launcher"
          test "$(stat -c '%u' "$launcher")" = 0
          mode="$(stat -c '%a' "$launcher")"
          (( (8#$mode & 8#022) == 0 ))
          actual="$(sha256sum "$launcher" | cut -d' ' -f1)"
          if [[ "$actual" != "$EXPECTED_LAUNCHER_SHA256" ]]; then
            echo "Host launcher digest mismatch: expected $EXPECTED_LAUNCHER_SHA256, got $actual" >&2
            exit 78
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.request.outputs.ref }}
          clean: true
          persist-credentials: false

      - name: Run disposable verification container
        shell: bash
        env:
          REQUESTED_OFFLINE: ${{ steps.request.outputs.offline }}
          REQUESTED_SHA: ${{ steps.request.outputs.ref }}
          REQUESTED_SUITE: ${{ steps.request.outputs.suite }}
        run: |
          set -Eeuo pipefail
          mode=online-verify
          [[ "$REQUESTED_OFFLINE" == 1 ]] && mode=offline-verify
          exec /usr/local/libexec/starsector-preflight-ci-v1 \
            "$REQUESTED_SHA" "$REQUESTED_SUITE" "$mode"
