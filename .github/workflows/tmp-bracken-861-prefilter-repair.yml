name: Temporary Bracken SPJP prefilter repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'preflight-core/src/main/java/dev/starsector/preflight/core/GeneratedBytecodePack.java'
      - 'preflight-core/src/test/java/dev/starsector/preflight/core/GeneratedBytecodePackPersistenceTest.java'
      - '.github/workflows/tmp-bracken-861-prefilter-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repair/861-spjp-size-prefilter
      - name: Apply narrow SPJP repair
        shell: python
        run: |
          from pathlib import Path

          source = Path('preflight-core/src/main/java/dev/starsector/preflight/core/GeneratedBytecodePack.java')
          text = source.read_text()
          if 'static GeneratedBytecodePack read(Path source, int maximumBytes)' not in text:
              old = '''    public static GeneratedBytecodePack read(Path source) throws IOException {
        Path absolute = source.toAbsolutePath().normalize();
        if (Files.isSymbolicLink(absolute)
                || !Files.isRegularFile(absolute, LinkOption.NOFOLLOW_LINKS)) {
            throw new IOException("Generated bytecode pack is not a regular file: " + absolute);
        }
        try (InputStream input = Files.newInputStream(absolute)) {
            return read(input, MAX_FILE_BYTES, absolute.toString());
        }
    }

    static GeneratedBytecodePack read(InputStream input, int maximumBytes, String sourceLabel) throws IOException {
        if (maximumBytes < minimumFileBytes() || maximumBytes > MAX_FILE_BYTES) {
            throw new IllegalArgumentException("Generated bytecode pack read limit is invalid: " + maximumBytes);
        }
'''
              new = '''    public static GeneratedBytecodePack read(Path source) throws IOException {
        return read(source, MAX_FILE_BYTES);
    }

    static GeneratedBytecodePack read(Path source, int maximumBytes) throws IOException {
        validateReadLimit(maximumBytes);
        Path absolute = source.toAbsolutePath().normalize();
        if (Files.isSymbolicLink(absolute)
                || !Files.isRegularFile(absolute, LinkOption.NOFOLLOW_LINKS)) {
            throw new IOException("Generated bytecode pack is not a regular file: " + absolute);
        }
        long size = Files.size(absolute);
        if (size < minimumFileBytes() || size > maximumBytes) {
            throw new IOException("Generated bytecode pack has an invalid size: " + size);
        }
        try (InputStream input = Files.newInputStream(absolute, StandardOpenOption.READ)) {
            return read(input, maximumBytes, absolute.toString());
        }
    }

    static GeneratedBytecodePack read(InputStream input, int maximumBytes, String sourceLabel) throws IOException {
        validateReadLimit(maximumBytes);
'''
              if old not in text:
                  raise SystemExit('expected SPJP read block was not found')
              text = text.replace(old, new, 1)
              marker = '''    private static long minimumFileBytes() {
'''
              helper = '''    private static void validateReadLimit(int maximumBytes) {
        if (maximumBytes < minimumFileBytes() || maximumBytes > MAX_FILE_BYTES) {
            throw new IllegalArgumentException("Generated bytecode pack read limit is invalid: " + maximumBytes);
        }
    }

'''
              if marker not in text:
                  raise SystemExit('minimumFileBytes marker was not found')
              text = text.replace(marker, helper + marker, 1)
              source.write_text(text)

          test = Path('preflight-core/src/test/java/dev/starsector/preflight/core/GeneratedBytecodePackPersistenceTest.java')
          text = test.read_text()
          if 'void exactReadLimitIsInclusive()' not in text:
              marker = '''    private static GeneratedBytecodePack pack(String className, String internalName) throws IOException {
'''
              tests = '''    @Test
    void exactReadLimitIsInclusive() throws Exception {
        GeneratedBytecodePack expected = pack("x.Y", "x/Y");
        byte[] bytes = GeneratedBytecodePack.toBytes(expected);

        GeneratedBytecodePack actual = GeneratedBytecodePack.read(
                new java.io.ByteArrayInputStream(bytes), bytes.length, "exact-limit.spjp");

        assertEquals(expected.contextKeySha256(), actual.contextKeySha256());
        assertEquals(expected.classCount(), actual.classCount());
        assertEquals(expected.requestCount(), actual.requestCount());
    }

    @Test
    void initialSizePrefilterRejectsBeforeTheBoundedRead() throws Exception {
        byte[] bytes = GeneratedBytecodePack.toBytes(pack("x.Y", "x/Y"));
        Path file = temporaryDirectory.resolve("already-too-large.spjp");
        Files.write(file, bytes);

        IOException error = assertThrows(
                IOException.class,
                () -> GeneratedBytecodePack.read(file, bytes.length - 1));

        assertTrue(error.getMessage().contains("invalid size"), error.getMessage());
    }

'''
              if marker not in text:
                  raise SystemExit('test insertion marker was not found')
              text = text.replace(marker, tests + marker, 1)
              test.write_text(text)
      - name: Commit repair when needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- preflight-core/src/main/java/dev/starsector/preflight/core/GeneratedBytecodePack.java preflight-core/src/test/java/dev/starsector/preflight/core/GeneratedBytecodePackPersistenceTest.java; then
            echo 'SPJP repair already present'
            exit 0
          fi
          git diff -- preflight-core/src/main/java/dev/starsector/preflight/core/GeneratedBytecodePack.java preflight-core/src/test/java/dev/starsector/preflight/core/GeneratedBytecodePackPersistenceTest.java
          git config user.name 'Bracken'
          git config user.email 'actions@users.noreply.github.com'
          git add preflight-core/src/main/java/dev/starsector/preflight/core/GeneratedBytecodePack.java preflight-core/src/test/java/dev/starsector/preflight/core/GeneratedBytecodePackPersistenceTest.java
          git commit -m 'Restore cheap SPJP size prefilter'
          git push origin HEAD:repair/861-spjp-size-prefilter
