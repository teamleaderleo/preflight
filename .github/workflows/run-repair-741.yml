name: Run reviewed preparation recovery repair

on:
  push:
    branches:
      - agent/rc-recover-preparation-restart

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/rc-recover-preparation-restart
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Publish reviewed exact-PID repair on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name preflight-agent
          git config user.email preflight-agent@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/repair-741-preparation-recovery.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n          npm ci --prefix preflight-desktop"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('reviewed preparation patch boundaries changed')
          body = text.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/preflight-741-patch.py').write_text(script)
          PY
          python3 /tmp/preflight-741-patch.py
          rm .github/workflows/repair-741-preparation-recovery.yml
          rm .github/workflows/run-repair-741.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(desktop): bind recovered preparation to exact PID"
          git push origin HEAD:agent/rc-recover-preparation-restart
