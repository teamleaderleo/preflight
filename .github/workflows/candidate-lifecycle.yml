name: Candidate package lifecycle

on:
  workflow_dispatch:
    inputs:
      distribution_run_id:
        description: Successful Distribution workflow run that produced the private signed candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: candidate-package-lifecycle-${{ inputs.distribution_run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Bind exact private candidate
    runs-on: ubuntu-latest
    environment:
      name: release-signing
    outputs:
      source_revision: ${{ steps.identity.outputs.source_revision }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Bind the requested successful Distribution run
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main || {
            echo "::error::Candidate lifecycle must be dispatched from main"
            exit 1
          }
          [[ "${{ inputs.distribution_run_id }}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::distribution_run_id must be a positive integer"
            exit 1
          }
          run_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.distribution_run_id }}")"
          test "$(jq -r '.name' <<<"$run_json")" = "Distribution" || {
            echo "::error::Run is not the Distribution workflow"
            exit 1
          }
          test "$(jq -r '.path' <<<"$run_json")" = ".github/workflows/distribution.yml" || {
            echo "::error::Run did not use the reviewed Distribution workflow path"
            exit 1
          }
          test "$(jq -r '.event' <<<"$run_json")" = "workflow_dispatch" || {
            echo "::error::Candidate run was not an explicit workflow dispatch"
            exit 1
          }
          test "$(jq -r '.head_branch' <<<"$run_json")" = "main" || {
            echo "::error::Candidate run was not built from main"
            exit 1
          }
          test "$(jq -r '.status' <<<"$run_json")" = "completed" \
            -a "$(jq -r '.conclusion' <<<"$run_json")" = "success" || {
            echo "::error::Candidate Distribution run did not complete successfully"
            exit 1
          }
          source_revision="$(jq -er '.head_sha' <<<"$run_json")"
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Distribution run has an invalid head SHA"
            exit 1
          }
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.metadata.outputs.source_revision }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download exact encrypted private candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-private-signed-candidate-${{ inputs.distribution_run_id }}
          path: candidate-encrypted
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.distribution_run_id }}

      - name: Decrypt complete candidate into runner-local storage
        env:
          PREFLIGHT_CANDIDATE_ARCHIVE_PASSWORD: ${{ secrets.PREFLIGHT_CANDIDATE_ARCHIVE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREFLIGHT_CANDIDATE_ARCHIVE_PASSWORD" || {
            echo "::error::Missing release-signing candidate archive password"
            exit 1
          }
          mkdir candidate-input
          count=0
          while IFS= read -r -d '' file; do
            name="$(basename "$file" .pfcandidate)"
            node preflight-desktop/scripts/candidate-crypt.mjs decrypt "$file" "candidate-input/$name"
            count=$((count + 1))
          done < <(find candidate-encrypted -type f -name '*.pfcandidate' -print0)
          test "$count" -gt 0 || { echo "::error::No encrypted candidate files found"; exit 1; }

      - name: Verify candidate with its own source revision
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_complete_release.py --release candidate-input
          source_revision="$(jq -er '.capabilityReceipt.sourceRevision' candidate-input/CAPABILITIES-darwin-arm64.json)"
          test "$source_revision" = "${{ steps.metadata.outputs.source_revision }}" || {
            echo "::error::Candidate capability source revision differs from Distribution head SHA"
            exit 1
          }
          version="$(jq -er '.version' candidate-input/latest.json)"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf 'Candidate %s is bound to Distribution run %s at %s\n' \
            "$version" "${{ inputs.distribution_run_id }}" "$source_revision"

  lifecycle:
    name: Candidate lifecycle / ${{ matrix.name }}
    needs: inspect
    environment:
      name: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package: Preflight-Linux-x86_64.deb
            candidate_name: Preflight-candidate.deb
            checksum: SHA256SUMS-linux-x64.txt
            bundles: deb
          - name: Windows
            os: windows-latest
            package: Preflight-Windows-x86_64.exe
            candidate_name: Preflight-candidate-setup.exe
            checksum: SHA256SUMS-win32-x64.txt
            bundles: nsis
          - name: macOS
            os: macos-latest
            package: Preflight-macOS-arm64.dmg
            candidate_name: Preflight-candidate.dmg
            checksum: SHA256SUMS-darwin-arm64.txt
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.source_revision }}

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend tooling
        working-directory: preflight-desktop
        run: npm ci

      - name: Download exact encrypted private candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-private-signed-candidate-${{ inputs.distribution_run_id }}
          path: candidate-encrypted
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.distribution_run_id }}

      - name: Decrypt and verify exact platform candidate package
        env:
          PREFLIGHT_CANDIDATE_ARCHIVE_PASSWORD: ${{ secrets.PREFLIGHT_CANDIDATE_ARCHIVE_PASSWORD }}
          PACKAGE_NAME: ${{ matrix.package }}
          CANDIDATE_NAME: ${{ matrix.candidate_name }}
          CHECKSUM_NAME: ${{ matrix.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate-verified candidate-newer
          encrypted_package="$(find candidate-encrypted -type f -name "${PACKAGE_NAME}.pfcandidate" -print -quit)"
          encrypted_checksum="$(find candidate-encrypted -type f -name "${CHECKSUM_NAME}.pfcandidate" -print -quit)"
          test -n "$encrypted_package" -a -n "$encrypted_checksum" || {
            echo "::error::Candidate package or checksum manifest is missing"
            exit 1
          }
          node preflight-desktop/scripts/candidate-crypt.mjs \
            decrypt "$encrypted_package" "candidate-verified/$PACKAGE_NAME"
          node preflight-desktop/scripts/candidate-crypt.mjs \
            decrypt "$encrypted_checksum" "candidate-verified/$CHECKSUM_NAME"
          node --input-type=module - "$PACKAGE_NAME" "$CHECKSUM_NAME" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const [packageName, checksumName] = process.argv.slice(2);
          const lines = readFileSync(join("candidate-verified", checksumName), "utf8").trim().split(/\r?\n/);
          const row = lines.find((line) => line.endsWith(`  ${packageName}`));
          if (!row) throw new Error(`No checksum entry for ${packageName}`);
          const expected = row.slice(0, 64);
          const bytes = readFileSync(join("candidate-verified", packageName));
          const actual = createHash("sha256").update(bytes).digest("hex");
          if (actual !== expected) throw new Error(`Candidate checksum mismatch for ${packageName}`);
          console.log(`${actual}  ${packageName}`);
          NODE
          cp "candidate-verified/$PACKAGE_NAME" "candidate-newer/$CANDIDATE_NAME"

      - name: Build an earlier rehearsal package from the candidate source revision
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/releases/0.0.0-candidate-lifecycle.md <<'EOF'
          # Candidate lifecycle fixture

          Runner-local earlier package used only to exercise exact-candidate upgrade and rollback.
          EOF
          node preflight-desktop/scripts/set-release-version.mjs 0.0.0-candidate-lifecycle
          ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -DskipTests clean package
          python3 -c "from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); import verify_release_boundary as v; v.validate_jar_bytes(Path('preflight-cli/target/preflight.jar').read_bytes())"
          cd preflight-desktop
          npm run build
          npm run engine:prepare:verified
          npm run desktop:clean
          npx tauri build --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.ci.conf.json

      - name: Exercise exact candidate install, upgrade, rollback, and removal
        env:
          DISTRIBUTION_RUN_ID: ${{ inputs.distribution_run_id }}
          SOURCE_REVISION: ${{ needs.inspect.outputs.source_revision }}
          CANDIDATE_VERSION: ${{ needs.inspect.outputs.version }}
          PACKAGE_NAME: ${{ matrix.package }}
          CHECKSUM_NAME: ${{ matrix.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-lifecycle-report
          node preflight-desktop/scripts/exercise-package-lifecycle.mjs \
            preflight-desktop/src-tauri/target/release/bundle \
            candidate-newer \
            candidate-lifecycle-report/lifecycle.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const reportPath = join("candidate-lifecycle-report", "lifecycle.json");
          const report = JSON.parse(readFileSync(reportPath, "utf8"));
          const packagePath = join("candidate-verified", process.env.PACKAGE_NAME);
          const bytes = readFileSync(packagePath);
          report.format = "preflight-candidate-package-lifecycle-v1";
          report.distributionRunId = process.env.DISTRIBUTION_RUN_ID;
          report.sourceRevision = process.env.SOURCE_REVISION;
          report.candidateVersion = process.env.CANDIDATE_VERSION;
          report.exactCandidatePackage = {
            name: process.env.PACKAGE_NAME,
            bytes: bytes.length,
            sha256: createHash("sha256").update(bytes).digest("hex"),
            checksumManifest: process.env.CHECKSUM_NAME,
          };
          writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
          NODE
          cat candidate-lifecycle-report/lifecycle.json

      - name: Preserve candidate lifecycle receipt
        if: always() && hashFiles('candidate-lifecycle-report/lifecycle.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-package-lifecycle-${{ matrix.name }}-${{ inputs.distribution_run_id }}
          path: candidate-lifecycle-report/lifecycle.json
          if-no-files-found: error
          retention-days: 14
