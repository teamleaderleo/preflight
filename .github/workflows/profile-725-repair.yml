name: Repair profile commit evidence

on:
  push:
    branches:
      - codex/673-profile-save-update-authority

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/673-profile-save-update-authority
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge current main and apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name preflight-agent
          git config user.email preflight-agent@users.noreply.github.com
          git fetch origin main

          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            if [[ -n "$conflicts" ]]; then
              git checkout --theirs -- preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java
              git add preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java
            fi
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

          python3 - <<'PY'
          from pathlib import Path

          transaction = Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/ProfileMutationTransaction.java")
          text = transaction.read_text()

          update_old = '''            hook.beforeTargetPublication(source);
                      try {
                          Files.createLink(source, stagedReplacement);
                      } catch (UnsupportedOperationException unsupported) {
                          restoreCapturedOrPreserve(captured, source, backups, descriptor);
                          sourceCaptured = false;
                          cleanupAbortedUpdate(transaction, reviewed, snapshot, stagedReplacement);
                          throw new IOException("Filesystem cannot publish an updated profile safely: " + source, unsupported);
                      } catch (FileAlreadyExistsException collision) {
                          Path conflict = restoreCapturedOrPreserve(captured, source, backups, descriptor);
                          sourceCaptured = false;
                          cleanupAbortedUpdate(transaction, reviewed, snapshot, stagedReplacement);
                          IOException failure = new IOException(
                                  "Named profile changed at the update commit boundary; review it again", collision);
                          if (conflict != null) {
                              failure.addSuppressed(new IOException(
                                      "The reviewed generation was preserved at " + conflict
                                              + " because a newer external profile won the public name."));
                          }
                          throw failure;
                      }
          
                      committed = true;
                      try {
          '''
          update_new = '''            hook.beforeTargetPublication(source);
                      try {
                          ExclusiveMove.move(stagedReplacement, source);
                      } catch (FileAlreadyExistsException collision) {
                          Path conflict = restoreCapturedOrPreserve(captured, source, backups, descriptor);
                          sourceCaptured = false;
                          cleanupAbortedUpdate(transaction, reviewed, snapshot, stagedReplacement);
                          IOException failure = new IOException(
                                  "Named profile changed at the update commit boundary; review it again", collision);
                          if (conflict != null) {
                              failure.addSuppressed(new IOException(
                                      "The reviewed generation was preserved at " + conflict
                                              + " because a newer external profile won the public name."));
                          }
                          throw failure;
                      } catch (IOException publicationFailure) {
                          restoreCapturedOrPreserve(captured, source, backups, descriptor);
                          sourceCaptured = false;
                          cleanupAbortedUpdate(transaction, reviewed, snapshot, stagedReplacement);
                          throw new IOException(
                                  "Filesystem cannot publish an updated profile safely: " + source,
                                  publicationFailure);
                      }
          
                      committed = true;
                      hook.afterTargetPublicationBeforeCommit(source);
                      try {
          '''

          rename_old = '''            hook.beforeTargetPublication(target);
                      try {
                          Files.createLink(target, stagedReplacement);
                      } catch (UnsupportedOperationException unsupported) {
                          restoreCapturedOrPreserve(captured, source, backups, descriptor);
                          sourceCaptured = false;
                          cleanupAbortedRename(transaction, reviewed, snapshot, stagedReplacement);
                          throw new IOException("Filesystem cannot publish a renamed profile safely: " + target, unsupported);
                      } catch (FileAlreadyExistsException collision) {
                          Path conflict = restoreCapturedOrPreserve(captured, source, backups, descriptor);
                          sourceCaptured = false;
                          cleanupAbortedRename(transaction, reviewed, snapshot, stagedReplacement);
                          IOException failure = new IOException("A named profile already exists: " + target.getFileName(), collision);
                          if (conflict != null) {
                              failure.addSuppressed(new IOException(
                                      "A newer source also won the rollback race; reviewed bytes were preserved at " + conflict));
                          }
                          throw failure;
                      }
          
                      committed = true;
                      try {
          '''
          rename_new = '''            hook.beforeTargetPublication(target);
                      try {
                          ExclusiveMove.move(stagedReplacement, target);
                      } catch (FileAlreadyExistsException collision) {
                          Path conflict = restoreCapturedOrPreserve(captured, source, backups, descriptor);
                          sourceCaptured = false;
                          cleanupAbortedRename(transaction, reviewed, snapshot, stagedReplacement);
                          IOException failure = new IOException("A named profile already exists: " + target.getFileName(), collision);
                          if (conflict != null) {
                              failure.addSuppressed(new IOException(
                                      "A newer source also won the rollback race; reviewed bytes were preserved at " + conflict));
                          }
                          throw failure;
                      } catch (IOException publicationFailure) {
                          restoreCapturedOrPreserve(captured, source, backups, descriptor);
                          sourceCaptured = false;
                          cleanupAbortedRename(transaction, reviewed, snapshot, stagedReplacement);
                          throw new IOException(
                                  "Filesystem cannot publish a renamed profile safely: " + target,
                                  publicationFailure);
                      }
          
                      committed = true;
                      hook.afterTargetPublicationBeforeCommit(target);
                      try {
          '''

          replacements = [
              (update_old, update_new, "update publication"),
              (rename_old, rename_new, "rename publication"),
              ("boolean sourceIsPublished = sameRegularFile(source, replacement);",
               "boolean publicationCompleted = !Files.exists(replacement, LinkOption.NOFOLLOW_LINKS);",
               "update recovery witness"),
              ("if (committedMarker || sourceIsPublished)",
               "if (committedMarker || publicationCompleted)",
               "update recovery checks"),
              ("boolean targetIsPublished = sameRegularFile(target, replacement);",
               "boolean publicationCompleted = !Files.exists(replacement, LinkOption.NOFOLLOW_LINKS);",
               "rename recovery witness"),
              ("if (committedMarker || targetIsPublished)",
               "if (committedMarker || publicationCompleted)",
               "rename recovery checks"),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              expected = 2 if label in {"update recovery checks", "rename recovery checks"} else 1
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} occurrence(s), found {count}")
              text = text.replace(old, new)

          hook_old = '''        default void beforeTargetPublication(Path target) throws IOException {
                  }
          
                  default void afterCommit(Path publicArtifact) throws IOException {
          '''
          hook_new = '''        default void beforeTargetPublication(Path target) throws IOException {
                  }
          
                  default void afterTargetPublicationBeforeCommit(Path publicArtifact) throws IOException {
                  }
          
                  default void afterCommit(Path publicArtifact) throws IOException {
          '''
          if text.count(hook_old) != 1:
              raise SystemExit("hook insertion point changed")
          text = text.replace(hook_old, hook_new)
          transaction.write_text(text)

          cli = Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java")
          text = cli.read_text()
          save_line = '                "preflight profile save <name> [--game <path>] [--launcher <path>] [--json]",\n'
          update_line = '                "preflight profile update <name> [--game <path>] [--launcher <path>] [--expected-profile <sha256>] [--expected-replacement <sha256>] [--json] [--yes]",\n'
          if update_line not in text:
              if text.count(save_line) != 1:
                  raise SystemExit("profile save usage anchor changed")
              text = text.replace(save_line, save_line + update_line)

          old_help = '''                "  Saves and restores ordered enabled-mod sets. Activation prints the exact plan",
                          "  by default; --yes stages and replaces mods/enabled_mods.json after backing it up.",
                          "  Duplicate, rename, and delete also preview by default. Applying them requires the exact",
                          "  profile fingerprint from that preview; delete keeps prepared data and writes a profile backup.",
                          "  Missing mods or a profile saved for another installation are refused."));'''
          new_help = '''                "  Saves and restores ordered enabled-mod sets. Save creates a new canonical name and refuses",
                          "  an existing one. Update previews the intentional replacement; applying it requires both",
                          "  the exact existing-record token and the reviewed replacement token from that preview.",
                          "  Activation prints the exact plan by default; --yes stages and replaces",
                          "  mods/enabled_mods.json after backing it up. Duplicate, rename, and delete also preview by default.",
                          "  Applying duplicate, rename, or delete requires the exact profile fingerprint from that preview;",
                          "  delete keeps prepared data and writes a profile backup. Missing mods or a profile saved for",
                          "  another installation are refused."));'''
          if new_help not in text:
              if text.count(old_help) != 1:
                  raise SystemExit("profile help block changed")
              text = text.replace(old_help, new_help)
          old_summary = '            case "profile" -> "Save, inspect, rename, delete, and safely activate named enabled-mod profiles.";'
          new_summary = '            case "profile" -> "Create, update, inspect, rename, delete, and safely activate named enabled-mod profiles.";'
          if new_summary not in text:
              if text.count(old_summary) != 1:
                  raise SystemExit("profile summary changed")
              text = text.replace(old_summary, new_summary)
          cli.write_text(text)
          PY

          cat > preflight-cli/src/test/java/dev/starsector/preflight/cli/ProfileMutationCommitEvidenceTest.java <<'JAVA'
          package dev.starsector.preflight.cli;

          import static org.junit.jupiter.api.Assertions.assertArrayEquals;
          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertThrows;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardOpenOption;
          import java.util.Arrays;
          import org.junit.jupiter.api.Test;
          import org.junit.jupiter.api.io.TempDir;

          class ProfileMutationCommitEvidenceTest {
              private static final byte[] REVIEWED = "reviewed-profile".getBytes(java.nio.charset.StandardCharsets.UTF_8);
              private static final byte[] REPLACEMENT = "replacement-profile".getBytes(java.nio.charset.StandardCharsets.UTF_8);
              private static final byte[] EXTERNAL = "external-profile".getBytes(java.nio.charset.StandardCharsets.UTF_8);

              @TempDir
              Path temporaryDirectory;

              @Test
              void updateRecoveryPreservesExternalReplacementAfterPublicCommitBeforeMarker() throws Exception {
                  Fixture fixture = fixture();
                  assertThrows(IOException.class, () -> ProfileMutationTransaction.update(
                          fixture.profiles(), fixture.backups(), fixture.source(), REPLACEMENT,
                          this::verifyReviewed,
                          replacePublicArtifactThenInterrupt(EXTERNAL)));

                  ProfileMutationTransaction.recover(fixture.profiles(), fixture.backups());

                  assertArrayEquals(EXTERNAL, Files.readAllBytes(fixture.source()));
                  assertNoTransactions(fixture.profiles());
              }

              @Test
              void updateRecoveryDoesNotResurrectReviewedProfileAfterPublicDeletionBeforeMarker() throws Exception {
                  Fixture fixture = fixture();
                  assertThrows(IOException.class, () -> ProfileMutationTransaction.update(
                          fixture.profiles(), fixture.backups(), fixture.source(), REPLACEMENT,
                          this::verifyReviewed,
                          deletePublicArtifactThenInterrupt()));

                  ProfileMutationTransaction.recover(fixture.profiles(), fixture.backups());

                  assertFalse(Files.exists(fixture.source()));
                  assertNoTransactions(fixture.profiles());
              }

              @Test
              void renameRecoveryPreservesExternalReplacementAfterPublicCommitBeforeMarker() throws Exception {
                  Fixture fixture = fixture();
                  Path target = fixture.profiles().resolve("cd".repeat(32) + ".json");
                  assertThrows(IOException.class, () -> ProfileMutationTransaction.rename(
                          fixture.profiles(), fixture.backups(), fixture.source(), target, REPLACEMENT,
                          this::verifyReviewed,
                          replacePublicArtifactThenInterrupt(EXTERNAL)));

                  ProfileMutationTransaction.recover(fixture.profiles(), fixture.backups());

                  assertFalse(Files.exists(fixture.source()));
                  assertArrayEquals(EXTERNAL, Files.readAllBytes(target));
                  assertNoTransactions(fixture.profiles());
              }

              @Test
              void renameRecoveryDoesNotResurrectSourceAfterPublicDeletionBeforeMarker() throws Exception {
                  Fixture fixture = fixture();
                  Path target = fixture.profiles().resolve("cd".repeat(32) + ".json");
                  assertThrows(IOException.class, () -> ProfileMutationTransaction.rename(
                          fixture.profiles(), fixture.backups(), fixture.source(), target, REPLACEMENT,
                          this::verifyReviewed,
                          deletePublicArtifactThenInterrupt()));

                  ProfileMutationTransaction.recover(fixture.profiles(), fixture.backups());

                  assertFalse(Files.exists(fixture.source()));
                  assertFalse(Files.exists(target));
                  assertNoTransactions(fixture.profiles());
              }

              private Fixture fixture() throws IOException {
                  Path profiles = Files.createDirectories(temporaryDirectory.resolve("profiles"));
                  Path backups = Files.createDirectories(temporaryDirectory.resolve("backups"));
                  Path source = profiles.resolve("ab".repeat(32) + ".json");
                  Files.write(source, REVIEWED, StandardOpenOption.CREATE_NEW, StandardOpenOption.WRITE);
                  return new Fixture(profiles, backups, source);
              }

              private void verifyReviewed(byte[] actual) throws IOException {
                  if (!Arrays.equals(REVIEWED, actual)) {
                      throw new IOException("reviewed profile bytes changed");
                  }
              }

              private static ProfileMutationTransaction.Hook replacePublicArtifactThenInterrupt(byte[] external) {
                  return new ProfileMutationTransaction.Hook() {
                      @Override
                      public void afterTargetPublicationBeforeCommit(Path publicArtifact) throws IOException {
                          Files.delete(publicArtifact);
                          Files.write(publicArtifact, external, StandardOpenOption.CREATE_NEW, StandardOpenOption.WRITE);
                          throw new IOException("simulated interruption after public commit");
                      }
                  };
              }

              private static ProfileMutationTransaction.Hook deletePublicArtifactThenInterrupt() {
                  return new ProfileMutationTransaction.Hook() {
                      @Override
                      public void afterTargetPublicationBeforeCommit(Path publicArtifact) throws IOException {
                          Files.delete(publicArtifact);
                          throw new IOException("simulated interruption after public commit");
                      }
                  };
              }

              private static void assertNoTransactions(Path profiles) throws IOException {
                  try (var entries = Files.list(profiles)) {
                      assertFalse(entries.anyMatch(path ->
                              path.getFileName().toString().startsWith(".preflight-profile-txn-")));
                  }
              }

              private record Fixture(Path profiles, Path backups, Path source) {}
          }
          JAVA

          rm .github/workflows/profile-725-repair.yml

          git add \
            preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java \
            preflight-cli/src/main/java/dev/starsector/preflight/cli/ProfileMutationTransaction.java \
            preflight-cli/src/test/java/dev/starsector/preflight/cli/ProfileMutationCommitEvidenceTest.java \
            .github/workflows/profile-725-repair.yml
          git status --short
          git commit -m "fix(profile): persist public commit evidence"
          git push origin HEAD:codex/673-profile-save-update-authority
