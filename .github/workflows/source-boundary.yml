name: Source boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify current tracked source boundary
        run: |
          python3 -m py_compile scripts/verify_current_source_boundary.py scripts/test_vps_trust_boundary.py
          python3 scripts/test_vps_trust_boundary.py
          python3 scripts/verify_current_source_boundary.py

      - name: Verify renderer storage ownership
        run: node preflight-desktop/scripts/verify-renderer-storage-ownership.mjs
