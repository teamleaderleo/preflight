name: Issue 557 reviewed repair integration

on:
  push:
    branches:
      - codex/issue-557-mod-compat-precheck
    paths:
      - .github/workflows/issue-557-repair.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/issue-557-mod-compat-precheck
          fetch-depth: 0
      - name: Use runner JDK 17
        run: |
          test -n "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Wire profile repair command
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label}, found {count}")
              return text.replace(old, new, 1)

          profile = Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/ProfileCommand.java")
          text = profile.read_text()
          text = replace_once(
              text,
              '''        } else if (!"list".equals(operation)) {
                      throw new IllegalArgumentException("Expected: profile <list|save|activate|rename|delete> ...");
                  }
          ''',
              '''        } else if (!"list".equals(operation) && !"repair-dependencies".equals(operation)) {
                      throw new IllegalArgumentException(
                              "Expected: profile <list|save|activate|repair-dependencies|rename|delete> ...");
                  }
          ''',
              "profile operation validation")
          text = replace_once(
              text,
              '''        if (options.confirmed() && !("activate".equals(operation) || mutation)) {
                      throw new IllegalArgumentException("--yes is only valid for profile activate, rename, or delete");
                  }
          ''',
              '''        if (options.confirmed()
                          && !("activate".equals(operation)
                                  || "repair-dependencies".equals(operation)
                                  || mutation)) {
                      throw new IllegalArgumentException(
                              "--yes is only valid for profile activate, repair-dependencies, rename, or delete");
                  }
          ''',
              "profile confirmation validation")
          text = replace_once(
              text,
              '''            case "activate" -> activate(
                          home, target.installRoot(), name, options.confirmed(), options.json(), System.out);
                      case "rename" -> rename(
          ''',
              '''            case "activate" -> activate(
                          home, target.installRoot(), name, options.confirmed(), options.json(), System.out);
                      case "repair-dependencies" -> ProfileDependencyRepair.execute(
                              home, target, options.confirmed(), options.json(), System.out);
                      case "rename" -> rename(
          ''',
              "profile repair dispatch")
          for old, new, label in [
              ("    private static String callerIdentity() {", "    static String callerIdentity() {", "caller identity visibility"),
              ("    private static Path backup(PreflightHome home, byte[] original) throws IOException {", "    static Path backup(PreflightHome home, byte[] original) throws IOException {", "backup visibility"),
              ("    private static boolean replaceIfUnchanged(Path target, byte[] expected, byte[] replacement)", "    static boolean replaceIfUnchanged(Path target, byte[] expected, byte[] replacement)", "replace visibility"),
              ("    private static void atomicWrite(Path target, String value) throws IOException {", "    static void atomicWrite(Path target, String value) throws IOException {", "atomic write visibility"),
          ]:
              text = replace_once(text, old, new, label)
          profile.write_text(text)

          cli = Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java")
          text = cli.read_text()
          text = replace_once(
              text,
              '''                "preflight profile activate <name> [--game <path>] [--launcher <path>] [--json] [--yes]",
                          "preflight profile rename <name> <new-name> [--game <path>] [--launcher <path>] [--expected-profile <sha256>] [--json] [--yes]",
          ''',
              '''                "preflight profile activate <name> [--game <path>] [--launcher <path>] [--json] [--yes]",
                          "preflight profile repair-dependencies [--game <path>] [--launcher <path>] [--json] [--yes]",
                          "preflight profile rename <name> <new-name> [--game <path>] [--launcher <path>] [--expected-profile <sha256>] [--json] [--yes]",
          ''',
              "profile repair usage")
          text = replace_once(
              text,
              '''                "  Saves and restores ordered enabled-mod sets. Activation prints the exact plan",
                          "  by default; --yes stages and replaces mods/enabled_mods.json after backing it up.",
                          "  Rename and delete also preview by default. Applying them requires the exact profile",
          ''',
              '''                "  Saves and restores ordered enabled-mod sets. Activation prints the exact plan",
                          "  by default; --yes stages and replaces mods/enabled_mods.json after backing it up.",
                          "  repair-dependencies previews only direct installed-but-disabled requirements, preserves",
                          "  the current mod order, and applies that exact reviewed proposal only when repeated with --yes.",
                          "  Rename and delete also preview by default. Applying them requires the exact profile",
          ''',
              "profile repair help")
          text = replace_once(
              text,
              '            case "profile" -> "Save, inspect, rename, delete, and safely activate named enabled-mod profiles.";\n',
              '            case "profile" -> "Save, inspect, repair dependencies, rename, delete, and safely activate enabled-mod profiles.";\n',
              "profile command summary")
          cli.write_text(text)
      - name: Verify focused profile and compatibility tests
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -Dtest=ModCompatibilityPrecheckTest,ProfileCommandTest,ProfileDependencyRepairTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify Java correctness
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Commit verified named files
        run: |
          rm .github/workflows/issue-557-repair.yml
          git config user.name "preflight-issue-557-bot"
          git config user.email "actions@users.noreply.github.com"
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/ProfileCommand.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/ProfileDependencyRepair.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java
          git add preflight-cli/src/test/java/dev/starsector/preflight/cli/ProfileDependencyRepairTest.java
          git add -u .github/workflows/issue-557-repair.yml
          git commit -m "Add reviewed dependency profile repair"
          git push origin HEAD:codex/issue-557-mod-compat-precheck
