name: Bound directory capability

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/bound-directory.yml'
      - 'preflight-desktop/src-tauri/Cargo.lock'
      - 'preflight-desktop/src-tauri/Cargo.toml'
      - 'preflight-desktop/src-tauri/src/bound_directory.rs'
      - 'preflight-desktop/src-tauri/tests/bound_directory.rs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bound-directory.yml'
      - 'preflight-desktop/src-tauri/Cargo.lock'
      - 'preflight-desktop/src-tauri/Cargo.toml'
      - 'preflight-desktop/src-tauri/src/bound_directory.rs'
      - 'preflight-desktop/src-tauri/tests/bound_directory.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Provide compile-time engine resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-desktop/src-tauri/target/engine
          printf 'BoundDirectory test compile-time resource placeholder\n' \
            > preflight-desktop/src-tauri/target/engine/bound-directory-placeholder.txt

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check --manifest-path preflight-desktop/src-tauri/Cargo.toml

      - name: Test capability replacement contracts
        run: cargo test --locked --manifest-path preflight-desktop/src-tauri/Cargo.toml --test bound_directory -- --test-threads=1
