name: Issue 557 flattened contract polish

on:
  push:
    branches:
      - codex/issue-557-mod-compat-precheck
    paths:
      - .github/workflows/issue-557-polish5.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/issue-557-mod-compat-precheck
          fetch-depth: 0
      - name: Use runner JDK 17
        run: |
          test -n "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Apply reviewed contract polish
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/issue-557-polish2.yml").read_text()
          shell_at = workflow.index("        shell: python")
          script_at = workflow.index("        run: |\n", shell_at) + len("        run: |\n")
          script_end = workflow.index("      - name: Verify Java correctness", script_at)
          exec(compile(textwrap.dedent(workflow[script_at:script_end]), "issue-557-polish2-inline.py", "exec"), {})

          test = Path("preflight-cli/src/test/java/dev/starsector/preflight/cli/ModCompatibilityPrecheckTest.java")
          test_text = test.read_text()
          broken = '        mod(mods, "partial", "{"id":"partial","name":"Partial","gameVersion":"0.98a-RC8"}");\n'
          fixed = '''        mod(mods, "partial", """
                  {"id":"partial","name":"Partial","gameVersion":"0.98a-RC8"}
                  """);
          '''
          if test_text.count(broken) != 1:
              raise SystemExit(f"expected one generated fixture to repair, found {test_text.count(broken)}")
          test.write_text(test_text.replace(broken, fixed, 1))

          precheck = Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/ModCompatibilityPrecheck.java")
          text = precheck.read_text()
          strict_reader = '''    private static List<String> readEnabled(Path enabledFile) throws IOException {
              Object root;
              try {
                  root = new Parser(Files.readString(enabledFile, StandardCharsets.UTF_8)).parse();
              } catch (IllegalArgumentException malformed) {
                  throw new IOException("enabled_mods.json is malformed: " + malformed.getMessage(), malformed);
              }
              if (!(root instanceof Map<?, ?> raw)) {
                  throw new IOException("enabled_mods.json root must be an object");
              }
              Object declared = stringMap(raw).get("enabledMods");
              if (!(declared instanceof List<?> list)) {
                  throw new IOException("enabled_mods.json must contain an enabledMods array");
              }
              List<String> enabled = new ArrayList<>();
              for (Object value : list) {
                  if (!(value instanceof String id) || id.isBlank()) {
                      throw new IOException("enabled_mods.json enabledMods entries must be non-blank strings");
                  }
                  enabled.add(id);
              }
              return List.copyOf(enabled);
          }

          '''
          prefix = "private static List<String> readEnabled(Path "
          spans = []
          search_at = 0
          while True:
              method_at = text.find(prefix, search_at)
              if method_at < 0:
                  break
              line_start = text.rfind("\n", 0, method_at) + 1
              brace = text.index("{", method_at)
              depth = 0
              close = None
              for index in range(brace, len(text)):
                  char = text[index]
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          close = index + 1
                          break
              if close is None:
                  raise SystemExit("unterminated readEnabled(Path) method")
              while close < len(text) and text[close] in " \t\r\n":
                  close += 1
              spans.append((line_start, close))
              search_at = close
          if not spans:
              raise SystemExit("expected at least one existing readEnabled(Path) method")
          for start, end in reversed(spans):
              text = text[:start] + text[end:]
          evaluator = "static Result inspect(Path modsDirectory, List<String> enabledMods, String gameVersion, Long maxHeapMiB)"
          evaluator_at = text.index(evaluator)
          insertion = text.rfind("\n", 0, evaluator_at) + 1
          text = text[:insertion] + strict_reader + text[insertion:]
          if text.count(prefix) != 1:
              raise SystemExit(f"expected one readEnabled(Path) method, found {text.count(prefix)}")
          text = text.replace(
              "ReasonCode.METADATA_PARTIAL,\n                            Severity.WARNING,",
              "ReasonCode.METADATA_PARTIAL,\n                            Severity.INFO,",
              1)
          precheck.write_text(text)
      - name: Verify compatibility tests
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -Dtest=ModCompatibilityPrecheckTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Recheck save observation signal
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -Dtest=SaveProfileObservationTest#outsideModificationInvalidatesPreviousAssociationAtNextBaseline -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify Java correctness
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Commit verified named files
        run: |
          rm .github/workflows/issue-557-polish.yml
          rm .github/workflows/issue-557-polish2.yml
          rm .github/workflows/issue-557-polish3.yml
          rm .github/workflows/issue-557-polish4.yml
          rm .github/workflows/issue-557-polish5.yml
          git config user.name "preflight-issue-557-bot"
          git config user.email "actions@users.noreply.github.com"
          git add preflight-core/src/main/java/dev/starsector/preflight/core/ModCompatibilityReadiness.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/ModCompatibilityPrecheck.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/ModCompatibilityPresenter.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/RunCommand.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/PrepareCommand.java
          git add preflight-cli/src/test/java/dev/starsector/preflight/cli/ModCompatibilityPrecheckTest.java
          git add -u .github/workflows/issue-557-polish.yml .github/workflows/issue-557-polish2.yml .github/workflows/issue-557-polish3.yml .github/workflows/issue-557-polish4.yml .github/workflows/issue-557-polish5.yml
          git commit -m "Polish mod compatibility readiness contract"
          git push origin HEAD:codex/issue-557-mod-compat-precheck
