name: Merge gate publisher

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aggregate:
    name: Publish merge gate status
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GATE_CONTEXT: Merge gate
      GATE_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # pull_request_target supplies this workflow and token from the trusted base context. Keep
      # executable repository content on that reviewed base revision as well: this job must never
      # execute code, actions, build files, or dependencies from the pull request under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Verify the trusted aggregate implementation
        run: |
          python3 -m py_compile scripts/required_merge_gate.py scripts/test_required_merge_gate.py
          python3 scripts/test_required_merge_gate.py

      - name: Publish pending status, wait for scoped workflows, and publish result
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local description="$2"
            python3 - "$state" "$description" "$GATE_CONTEXT" "$GATE_TARGET_URL" <<'PY' \
              | curl --fail-with-body --silent --show-error --location \
                  --request POST \
                  --header 'Accept: application/vnd.github+json' \
                  --header "Authorization: Bearer $GITHUB_TOKEN" \
                  --header 'X-GitHub-Api-Version: 2022-11-28' \
                  --header 'Content-Type: application/json' \
                  --data-binary @- \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              >/dev/null
          import json
          import sys

          print(json.dumps({
              "state": sys.argv[1],
              "description": sys.argv[2],
              "context": sys.argv[3],
              "target_url": sys.argv[4],
          }))
          PY
          }

          post_status pending 'Waiting for scoped pull-request workflows'

          set +e
          python3 scripts/required_merge_gate.py \
            --repo "${{ github.repository }}" \
            --sha "$HEAD_SHA" \
            --pr "${{ github.event.pull_request.number }}" \
            --timeout 3600 \
            --poll 15 \
            --settle 45
          gate_rc=$?
          set -e

          if (( gate_rc == 0 )); then
            post_status success 'All scoped pull-request workflows passed'
          else
            post_status failure 'A scoped pull-request workflow needs attention'
          fi
          exit "$gate_rc"
