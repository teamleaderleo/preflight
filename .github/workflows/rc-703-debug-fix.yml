name: RC 703 final report source fix

on:
  push:
    branches:
      - fix/desktop-report-authority

permissions:
  contents: write

concurrency:
  group: rc-703-debug-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-report-authority
          fetch-depth: 0
      - name: Apply final report source fixes and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          reports = Path('preflight-desktop/src-tauri/src/reports.rs')
          text = reports.read_text()

          debug_old = '''#[derive(Clone, Debug, Deserialize, Serialize)]
#[serde(rename_all = "camelCase", deny_unknown_fields)]
pub(crate) struct ReportDeletion {'''
          debug_new = '''#[derive(Clone, Deserialize, Serialize)]
#[serde(rename_all = "camelCase", deny_unknown_fields)]
pub(crate) struct ReportDeletion {'''
          if debug_old in text:
              text = text.replace(debug_old, debug_new, 1)
          elif debug_new not in text:
              raise SystemExit('ReportDeletion derive seam changed unexpectedly')

          race_old = '''            drop(running);
            let mut background = AUTOMATIC_REPORT_UPLOAD.lock().map_err(|_| {'''
          race_new = '''            // Publish the background slot while the foreground coordinator is still held.
            // Manual/player actions take the locks in this same order, then cancel this slot.
            let mut background = AUTOMATIC_REPORT_UPLOAD.lock().map_err(|_| {'''
          if race_old in text:
              text = text.replace(race_old, race_new, 1)
          elif race_new not in text:
              raise SystemExit('automatic/foreground lock seam changed unexpectedly')

          import_old = '''mod tests {
    use super::{ReportUploadError, upload_outcome_error};
'''
          import_new = '''mod tests {
    use super::{
        AUTOMATIC_REPORT_UPLOAD, ReportUploadError, cancel_background_report,
        upload_outcome_error,
    };
    use crate::operations::ReportUploadProcess;
    use tokio::sync::watch;
'''
          if import_old in text:
              text = text.replace(import_old, import_new, 1)
          elif import_new not in text:
              raise SystemExit('reports test import seam changed unexpectedly')

          test_anchor = '''    #[test]
    fn cancellation_has_a_stable_machine_readable_error_code() {'''
          test_block = '''    #[test]
    fn foreground_cancellation_signals_and_clears_automatic_upload() {
        let (cancel, receiver) = watch::channel(false);
        {
            let mut background = AUTOMATIC_REPORT_UPLOAD.lock().unwrap();
            assert!(background.is_none());
            *background = Some(ReportUploadProcess {
                id: 7,
                total_bytes: 11,
                cancel,
            });
        }

        assert!(cancel_background_report().unwrap());
        assert!(*receiver.borrow());
        assert!(AUTOMATIC_REPORT_UPLOAD.lock().unwrap().is_none());
    }

'''
          if test_block not in text:
              if test_anchor not in text:
                  raise SystemExit('reports test insertion seam changed unexpectedly')
              text = text.replace(test_anchor, test_block + test_anchor, 1)

          reports.write_text(text)

          lock_path = Path('preflight-desktop/capabilities/release-receipt-source-lock.json')
          lock = json.loads(lock_path.read_text())
          normalized = reports.read_text().replace('\r\n', '\n').encode()
          lock['sources']['preflight-desktop/src-tauri/src/reports.rs'] = hashlib.sha256(normalized).hexdigest()
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          PY

          cd preflight-desktop/src-tauri
          cargo fmt --all
          cd ../..

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          reports = Path('preflight-desktop/src-tauri/src/reports.rs')
          lock_path = Path('preflight-desktop/capabilities/release-receipt-source-lock.json')
          lock = json.loads(lock_path.read_text())
          lock['sources']['preflight-desktop/src-tauri/src/reports.rs'] = hashlib.sha256(
              reports.read_text().replace('\r\n', '\n').encode()
          ).hexdigest()
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          PY

          node preflight-desktop/scripts/review-capability-lock.mjs --check
          git diff --check
          rm -f .github/workflows/rc-703-debug-fix.yml .rc-703-debug-fix-trigger

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(desktop): close report secret and foreground races'
          git push origin HEAD:fix/desktop-report-authority

          git push origin --delete rc-703-bound-helper-runner || true
          git push origin --delete rc-703-finalize-runner || true
