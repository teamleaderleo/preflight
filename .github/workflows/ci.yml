name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      # Desktop application owns renderer, native-host, release-contract, and package validation.
      # If a change also touches Java or shared operator code, any non-ignored path still runs CI.
      - 'preflight-desktop/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'preflight-desktop/**'
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify repository CI scope
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.scope.outputs.java }}
      operator: ${{ steps.scope.outputs.operator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide which job families are needed
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "java=true" >> "$GITHUB_OUTPUT"
            echo "operator=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/repository-ci-paths.txt"
          cat "$RUNNER_TEMP/repository-ci-paths.txt"
          echo "java=$(python3 scripts/repository_ci_scope.py java < "$RUNNER_TEMP/repository-ci-paths.txt")" >> "$GITHUB_OUTPUT"
          echo "operator=$(python3 scripts/repository_ci_scope.py operator < "$RUNNER_TEMP/repository-ci-paths.txt")" >> "$GITHUB_OUTPUT"

  operator-checks:
    needs: scope
    if: needs.scope.outputs.operator == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate operator runners
        run: |
          bash -n build/ci/starsector-preflight-ci-v1
          python3 scripts/test_vps_runner_boundary.py
          bash -n scripts/run-prepared-pixel-coherent-direct-gameplay-smoke.sh
          bash -n scripts/run-prepared-pixel-main-menu-comparison-pilot.sh
          bash -n scripts/run-gameplay-pilot.sh
          bash -n scripts/run-1153-render-pilot.sh
          bash -n scripts/compare-1153-render-pilots.sh
          bash -n scripts/run-1153-particle-probe.sh
          scripts/run-1153-render-pilot.sh --help >/dev/null
          bash scripts/run-1153-particle-probe.sh --help >/dev/null
          python3 -m py_compile scripts/starsector_log_ready_detector.py
          python3 scripts/test_starsector_log_ready_detector.py
          python3 -m py_compile scripts/starsector_profile_guard.py
          python3 scripts/test_starsector_profile_guard.py
          python3 -m py_compile scripts/starsector_core_resource_guard.py
          python3 scripts/test_starsector_core_resource_guard.py
          python3 -m py_compile scripts/verify_release_boundary.py
          python3 scripts/test_verify_release_boundary.py
          python3 -m py_compile scripts/verify_complete_release.py
          python3 scripts/test_verify_complete_release.py
          python3 -m py_compile scripts/test_prepared_comparison_pilot.py
          python3 scripts/test_prepared_comparison_pilot.py
          python3 -m py_compile scripts/starsector_critical_path.py
          python3 scripts/test_starsector_critical_path.py
          python3 scripts/test_starsector_gameplay_hotspots.py
          python3 -m py_compile scripts/desktop_ci_scope.py scripts/test_desktop_ci_scope.py
          python3 scripts/test_desktop_ci_scope.py
          python3 -m py_compile scripts/repository_ci_scope.py scripts/test_repository_ci_scope.py
          python3 scripts/test_repository_ci_scope.py
          bash -n scripts/run-startup-benchmark.sh
          python3 scripts/test_startup_benchmark.py
          python3 -m py_compile scripts/starsector_log_load_times.py
          python3 scripts/test_starsector_log_load_times.py
          python3 scripts/test_verify_linux_glibc_floor.py
          # This list is written by hand, so an unreferenced suite reports nothing. Keep this last.
          python3 scripts/test_operator_checks_coverage.py

  verify:
    needs: scope
    if: needs.scope.outputs.java == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - name: Verify with pinned Maven Wrapper
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Verify with pinned Maven Wrapper
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify
      - name: Verify real runnable JAR boundary
        if: runner.os != 'Windows'
        run: python3 -c "from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); import verify_release_boundary as v; v.validate_jar_bytes(Path('preflight-cli/target/preflight.jar').read_bytes())"
      - name: Upload runnable JAR
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starsector-preflight
          path: preflight-cli/target/preflight.jar
          if-no-files-found: error
