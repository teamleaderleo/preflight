name: Desktop application

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/actions/setup-build-jdk/**'
      - '.github/workflows/desktop-ci.yml'
      - 'pom.xml'
      - 'preflight-agent/**'
      - 'preflight-cli/**'
      - 'preflight-core/**'
      - 'preflight-desktop/**'
      - 'scripts/desktop_ci_scope.py'
      - 'scripts/verify_linux_glibc_floor.py'
      - 'scripts/write_linux_builder_provenance.py'
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-build-jdk/**'
      - '.github/workflows/desktop-ci.yml'
      - 'pom.xml'
      - 'preflight-agent/**'
      - 'preflight-cli/**'
      - 'preflight-core/**'
      - 'preflight-desktop/**'
      - 'scripts/desktop_ci_scope.py'
      - 'scripts/verify_linux_glibc_floor.py'
      - 'scripts/write_linux_builder_provenance.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify desktop package scope
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.scope.outputs.package }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether native packages are needed
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "package=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            # The pull request already packaged every affected native platform. A merge commit has
            # the same tree and still reruns the affected engine, frontend and contract jobs.
            # Release candidates and tags build all packages again in Distribution.
            echo "package=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/desktop-ci-paths.txt"
          cat "$RUNNER_TEMP/desktop-ci-paths.txt"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            package="$(python3 scripts/desktop_ci_scope.py package < "$RUNNER_TEMP/desktop-ci-paths.txt")"
            echo "package=$package" >> "$GITHUB_OUTPUT"
          fi
          native="$(python3 scripts/desktop_ci_scope.py native < "$RUNNER_TEMP/desktop-ci-paths.txt")"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  engine:
    name: Build verified desktop engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-jdk

      - name: Build bounded engine JAR once
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -DskipTests package

      - name: Verify runnable JAR boundary
        run: python3 -c "from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); import verify_release_boundary as v; v.validate_jar_bytes(Path('preflight-cli/target/preflight.jar').read_bytes())"

      - name: Upload verified engine JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-desktop-engine-${{ github.run_id }}
          path: preflight-cli/target/preflight.jar
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Build verified desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: preflight-desktop
        run: npm ci

      - name: Audit production frontend dependencies
        working-directory: preflight-desktop
        run: npm audit --omit=dev

      - name: Test and build frontend once
        working-directory: preflight-desktop
        shell: bash
        run: |
          npm test
          npm run build
          node scripts/frontend-dist-manifest.mjs write dist frontend-dist.json
          node scripts/frontend-dist-manifest.mjs verify dist frontend-dist.json

      - name: Upload verified frontend distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-desktop-frontend-${{ github.run_id }}
          path: |
            preflight-desktop/dist
            preflight-desktop/frontend-dist.json
          if-no-files-found: error
          retention-days: 1

  contracts:
    name: Verify desktop release contracts
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - name: Install frontend tooling
        working-directory: preflight-desktop
        run: npm ci

      - name: Download verified engine JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-desktop-engine-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-desktop-engine

      - name: Stage verified engine JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-cli/target
          cp "$RUNNER_TEMP/preflight-desktop-engine/preflight.jar" preflight-cli/target/preflight.jar

      - name: Prepare bounded desktop engine from verified JAR
        working-directory: preflight-desktop
        run: npm run engine:prepare:verified

      - name: Verify prepared release contracts
        working-directory: preflight-desktop
        run: npm run test:release:prepared

  validate:
    name: Desktop native-host validation
    needs: [engine, scope]
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Read Rust version for cache identity
        id: rust-version
        shell: bash
        run: echo "version=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-cargo-downloads-${{ runner.os }}-${{ hashFiles('preflight-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-downloads-${{ runner.os }}-

      - name: Cache Rust validation build state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: preflight-desktop/src-tauri/target/debug
          key: desktop-rust-validate-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('preflight-desktop/src-tauri/Cargo.lock', 'preflight-desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            desktop-rust-validate-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend tooling
        working-directory: preflight-desktop
        run: npm ci

      - name: Download verified engine JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-desktop-engine-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-desktop-engine

      - name: Stage verified engine JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-cli/target
          cp "$RUNNER_TEMP/preflight-desktop-engine/preflight.jar" preflight-cli/target/preflight.jar

      - name: Prepare bounded desktop engine from verified JAR
        working-directory: preflight-desktop
        run: npm run engine:prepare:verified

      - name: Verify native host
        working-directory: preflight-desktop
        shell: bash
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  package:
    name: Package / ${{ matrix.os }}
    needs: [engine, scope, frontend, contracts]
    if: needs.scope.outputs.package == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Read Rust version for cache identity
        id: rust-version
        shell: bash
        run: echo "version=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-cargo-downloads-${{ runner.os }}-${{ hashFiles('preflight-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-downloads-${{ runner.os }}-

      - name: Cache Rust package build state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            preflight-desktop/src-tauri/target/release
            !preflight-desktop/src-tauri/target/release/bundle
          key: desktop-rust-package-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('preflight-desktop/src-tauri/Cargo.lock', 'preflight-desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            desktop-rust-package-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-

      - name: Install frontend tooling
        working-directory: preflight-desktop
        run: npm ci

      - name: Download verified engine JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-desktop-engine-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-desktop-engine

      - name: Stage verified engine JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-cli/target
          cp "$RUNNER_TEMP/preflight-desktop-engine/preflight.jar" preflight-cli/target/preflight.jar

      - name: Prepare bounded desktop engine from verified JAR
        working-directory: preflight-desktop
        run: npm run engine:prepare:verified

      - name: Download verified frontend distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-desktop-frontend-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-desktop-frontend

      - name: Stage and verify exact frontend distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preflight-desktop/dist
          cp -R "$RUNNER_TEMP/preflight-desktop-frontend/dist" preflight-desktop/dist
          cp "$RUNNER_TEMP/preflight-desktop-frontend/frontend-dist.json" preflight-desktop/frontend-dist.json
          node preflight-desktop/scripts/frontend-dist-manifest.mjs \
            verify preflight-desktop/dist preflight-desktop/frontend-dist.json

      - name: Build macOS development package
        if: runner.os == 'macOS'
        working-directory: preflight-desktop
        run: npx tauri build --bundles dmg --config src-tauri/tauri.ci.conf.json

      - name: Build Windows development package
        if: runner.os == 'Windows'
        working-directory: preflight-desktop
        run: npx tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Reverify frontend distribution after packaging
        shell: bash
        run: |
          set -euo pipefail
          node preflight-desktop/scripts/frontend-dist-manifest.mjs \
            verify preflight-desktop/dist preflight-desktop/frontend-dist.json

      - name: Verify extracted development package contents
        working-directory: preflight-desktop
        run: npm run desktop:verify-package

      - name: Exercise native installation and removal
        working-directory: preflight-desktop
        run: npm run desktop:exercise-install

  package-linux:
    name: Package / Linux compatibility
    needs: [engine, scope, frontend, contracts]
    if: needs.scope.outputs.package == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:jammy-20260627@sha256:0d779ea97881505f5ef0039336ee85edba27519bdba968c284c86ee066a973c8
    defaults:
      run:
        shell: bash
    env:
      PREFLIGHT_LINUX_BUILDER_IMAGE: ubuntu:jammy-20260627@sha256:0d779ea97881505f5ef0039336ee85edba27519bdba968c284c86ee066a973c8
      PREFLIGHT_LINUX_MAX_GLIBC: '2.35'
      # sun.jnu.encoding is derived from the locale and is documented as not settable on the JVM
      # command line, so a bare container's default C locale makes every non-ASCII game path
      # unrepresentable. The synthetic contract deliberately uses one. Real Linux desktops are
      # UTF-8; this makes the builder match them rather than relaxing what Preflight accepts.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Bootstrap pinned Linux builder
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            libappindicator3-dev \
            libasound2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            python3 \
            sudo \
            unzip \
            xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Read Linux Rust and builder cache identity
        id: linux-cache-identity
        shell: bash
        run: |
          set -euo pipefail
          echo "rust-version=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "builder-id=$(printf '%s' "$PREFLIGHT_LINUX_BUILDER_IMAGE" | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-cargo-downloads-${{ runner.os }}-${{ hashFiles('preflight-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-downloads-${{ runner.os }}-

      - name: Cache Linux compatibility package build state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            preflight-desktop/src-tauri/target/release
            !preflight-desktop/src-tauri/target/release/bundle
          key: desktop-rust-package-linux-compat-${{ steps.linux-cache-identity.outputs.builder-id }}-${{ runner.arch }}-${{ steps.linux-cache-identity.outputs.rust-version }}-${{ hashFiles('preflight-desktop/src-tauri/Cargo.lock', 'preflight-desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            desktop-rust-package-linux-compat-${{ steps.linux-cache-identity.outputs.builder-id }}-${{ runner.arch }}-${{ steps.linux-cache-identity.outputs.rust-version }}-

      - name: Install frontend tooling
        working-directory: preflight-desktop
        run: npm ci

      - name: Download verified engine JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-desktop-engine-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-desktop-engine

      - name: Stage verified engine JAR
        run: |
          set -euo pipefail
          mkdir -p preflight-cli/target
          cp "$RUNNER_TEMP/preflight-desktop-engine/preflight.jar" preflight-cli/target/preflight.jar

      - name: Prepare bounded desktop engine from verified JAR
        working-directory: preflight-desktop
        run: npm run engine:prepare:verified

      - name: Download verified frontend distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-desktop-frontend-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-desktop-frontend

      - name: Stage and verify exact frontend distribution
        run: |
          set -euo pipefail
          rm -rf preflight-desktop/dist
          cp -R "$RUNNER_TEMP/preflight-desktop-frontend/dist" preflight-desktop/dist
          cp "$RUNNER_TEMP/preflight-desktop-frontend/frontend-dist.json" preflight-desktop/frontend-dist.json
          node preflight-desktop/scripts/frontend-dist-manifest.mjs \
            verify preflight-desktop/dist preflight-desktop/frontend-dist.json

      - name: Build Linux Debian development package
        working-directory: preflight-desktop
        run: npx tauri build --bundles deb --config src-tauri/tauri.ci.conf.json

      - name: Build Linux AppImage development package
        working-directory: preflight-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/preflight-desktop/src-tauri/target/engine/runtime/lib/server
        run: npx tauri bundle --verbose --bundles appimage --config src-tauri/tauri.ci.conf.json

      - name: Reverify frontend distribution after packaging
        run: |
          set -euo pipefail
          node preflight-desktop/scripts/frontend-dist-manifest.mjs \
            verify preflight-desktop/dist preflight-desktop/frontend-dist.json

      - name: Verify extracted development package contents
        working-directory: preflight-desktop
        run: npm run desktop:verify-package

      - name: Exercise native installation and removal
        working-directory: preflight-desktop
        run: npm run desktop:exercise-install

      - name: Verify packaged GLIBC compatibility floor
        run: |
          set -euo pipefail
          python3 scripts/verify_linux_glibc_floor.py \
            --bundle preflight-desktop/src-tauri/target/release/bundle \
            --max-glibc "$PREFLIGHT_LINUX_MAX_GLIBC" \
            --report linux-builder/glibc-floor.json
          python3 scripts/write_linux_builder_provenance.py \
            --image "$PREFLIGHT_LINUX_BUILDER_IMAGE" \
            --max-glibc "$PREFLIGHT_LINUX_MAX_GLIBC" \
            --glibc-report linux-builder/glibc-floor.json \
            --output linux-builder/provenance.json

      - name: Preserve Linux compatibility provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-linux-builder-provenance-${{ github.run_id }}
          path: linux-builder/*.json
          if-no-files-found: error
          retention-days: 30
