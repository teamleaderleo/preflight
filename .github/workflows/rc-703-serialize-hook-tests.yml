name: Serialize #703 mutation-hook regressions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rc-703-serialize-hook-tests.yml'

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/desktop-report-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Apply test-only serialization and self-delete
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BLOB: 5208e6880fc8ce95495e9af6b4135c521edd2786
          TARGET: preflight-desktop/src-tauri/src/report_authority.rs
          SELF: .github/workflows/rc-703-serialize-hook-tests.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object "$TARGET")" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("preflight-desktop/src-tauri/src/report_authority.rs")
          s = p.read_text()
          def one(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"expected one match, found {n}: {old[:100]!r}")
              s = s.replace(old, new, 1)
          one(
              'static TEST_PERSIST_MUTATION: Mutex<Option<TestPersistMutation>> = Mutex::new(None);\n',
              'static TEST_PERSIST_MUTATION: Mutex<Option<TestPersistMutation>> = Mutex::new(None);\n'
              '#[cfg(test)]\n'
              'static TEST_PERSIST_TEST_SERIAL: Mutex<()> = Mutex::new(());\n',
          )
          one(
              '    fn clear_after_generation_check_cannot_recreate_authority_storage() {\n'
              '        let root = temp_root("late-clear");\n',
              '    fn clear_after_generation_check_cannot_recreate_authority_storage() {\n'
              '        let _serial = TEST_PERSIST_TEST_SERIAL.lock().unwrap();\n'
              '        let root = temp_root("late-clear");\n',
          )
          one(
              '    fn root_swap_before_credential_publication_is_refused_without_external_write() {\n'
              '        use std::os::unix::fs::PermissionsExt;\n',
              '    fn root_swap_before_credential_publication_is_refused_without_external_write() {\n'
              '        let _serial = TEST_PERSIST_TEST_SERIAL.lock().unwrap();\n'
              '        use std::os::unix::fs::PermissionsExt;\n',
          )
          p.write_text(s)
          PY
          cargo fmt --manifest-path preflight-desktop/src-tauri/Cargo.toml
          git diff --check -- "$TARGET"
          test "$(git diff --name-only)" = "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git rm "$SELF"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$SELF" "$TARGET" | sort)"
          test "$staged" = "$expected"
          git commit -m "test(reports): serialize authority mutation hooks"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
