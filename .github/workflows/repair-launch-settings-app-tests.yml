name: Repair launch-settings App journeys

on:
  push:
    branches:
      - fix/launch-settings-quiescent-apply
    paths:
      - '.github/repair-launch-settings-app-tests.py'
      - '.github/workflows/repair-launch-settings-app-tests.yml'

permissions:
  contents: write

concurrency:
  group: repair-launch-settings-app-tests
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/launch-settings-quiescent-apply
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json
      - name: Patch stale App journeys
        run: python3 .github/repair-launch-settings-app-tests.py
      - name: Install frontend dependencies
        working-directory: preflight-desktop
        run: npm ci
      - name: Test and build frontend
        working-directory: preflight-desktop
        run: |
          npm test
          npm run build
      - name: Remove temporary repair files
        run: rm .github/repair-launch-settings-app-tests.py .github/workflows/repair-launch-settings-app-tests.yml
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update launch-settings App journeys for reviewed Apply"
          git push origin HEAD:fix/launch-settings-quiescent-apply
