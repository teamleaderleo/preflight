name: Issue 1153 LWJGL state cache gate

on:
  push:
    branches:
      - lantern/1153-render-sync
    paths:
      - '.github/workflows/issue-1153-lwjgl-state-cache-gate.yml'
      - 'preflight-agent/src/main/java/dev/starsector/preflight/agent/GlIsEnabledStateCacheRuntime.java'
      - 'preflight-agent/src/main/java/dev/starsector/preflight/agent/GlIsEnabledStateCachePlan.java'
      - 'preflight-agent/src/test/java/dev/starsector/preflight/agent/GlIsEnabledStateCacheInstalledAdapterIT.java'

permissions:
  contents: read

jobs:
  stock-lwjgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - name: Fetch public LWJGL 2.9.3 archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/lwjgl.jar" \
            'https://libraries.minecraft.net/org/lwjgl/lwjgl/lwjgl/2.9.3/lwjgl-2.9.3.jar'
          test "$(sha256sum "$RUNNER_TEMP/lwjgl.jar" | awk '{print $1}')" = \
            '527d509f60132e5b2653c7fc0f8cf299d6f698f4a8013342bef47705dc57ed3f'
      - name: Transform real GL11 class with guarded state cache
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -pl preflight-agent -am \
            -Dpreflight.lwjgl.jar="$RUNNER_TEMP/lwjgl.jar" \
            -Dit.test=GlIsEnabledStateCacheInstalledAdapterIT \
            -Dsurefire.failIfNoSpecifiedTests=false \
            verify
