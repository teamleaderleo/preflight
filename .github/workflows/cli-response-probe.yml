name: Windows title tail evidence helper

on:
  push:
    branches:
      - diagnostics/windows-title-bytecode-acquisition
    paths:
      - '.github/workflows/cli-response-probe.yml'

permissions:
  contents: write

jobs:
  verify-exact-windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - name: Acquire exact reviewed Windows core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'starsector_install-0.98a-RC8.exe'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'starsector-extracted'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://f005.backblazeb2.com/file/fractalsoftworks/release/starsector_install-0.98a-RC8.exe' -OutFile $installer
          & 7z x $installer "-o$extractRoot" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed: $LASTEXITCODE" }
          $jars = @(Get-ChildItem -LiteralPath $extractRoot -Filter 'starfarer_obf.jar' -File -Recurse)
          if ($jars.Count -ne 1) { throw "Expected one starfarer_obf.jar, found $($jars.Count)" }
          $jar = $jars[0]
          $jarSha = (Get-FileHash -LiteralPath $jar.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($jarSha -ne '5dd222b9e266d2ac2d63b3dad4983eb05caaf5a247d7dfb82aaeba47ea774cc8') { throw "Core JAR SHA mismatch: $jarSha" }
          "PREFLIGHT_CORE_JAR=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run focused semantic and exact-installed tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\mvnw.cmd --batch-mode --no-transfer-progress -pl preflight-agent -am `
            "-Dpreflight.starsector.core.jar=$env:PREFLIGHT_CORE_JAR" `
            "-Dtest=MainMenuInteractivePlanTest,MainMenuInteractiveInstalledAdapterIT,RuntimeSemanticStateTest,FrameTimeRuntimeTest,StartupPhasePlanTest,FrameTimeStartupCompletionPlanTest" `
            -Dsurefire.failIfNoSpecifiedTests=false test
          if ($LASTEXITCODE -ne 0) { throw "focused Maven tests failed: $LASTEXITCODE" }

  retain-evidence:
    needs: verify-exact-windows-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diagnostics/windows-main-menu-tail
          fetch-depth: 0
      - name: Append deterministic title-tail evidence
        shell: bash
        run: |
          set -euo pipefail
          target='docs/evidence/2026-09-01-windows-vm-startup-tuning.md'
          marker='### What owns the current main-menu-ready to main-menu-interactive tail?'
          if grep -Fq "$marker" "$target"; then
            echo 'Evidence already retained.'
            exit 0
          fi
          printf '%s' '' | base64 -d >> "$target"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Document Windows main-menu tail timer'
          git push origin HEAD:diagnostics/windows-main-menu-tail
