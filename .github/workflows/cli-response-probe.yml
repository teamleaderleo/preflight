name: Correct Windows title-tail evidence v2

on:
  push:
    branches:
      - diagnostics/windows-title-bytecode-acquisition
    paths:
      - '.github/workflows/cli-response-probe.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diagnostics/windows-main-menu-tail
          fetch-depth: 0
      - name: Correct retained evidence text
        shell: bash
        run: |
          set -euo pipefail
          target='docs/evidence/2026-09-01-windows-vm-startup-tuning.md'
          sed -i 's/`Preoading\.\.\.`/`Preloading...`/' "$target"
          export OLD=''
          export NEW=''
          python3 -c "import base64,os,pathlib; p=pathlib.Path('$target'); t=p.read_text(); old=base64.b64decode(os.environ['OLD']).decode(); new=base64.b64decode(os.environ['NEW']).decode(); assert old in t; p.write_text(t.replace(old,new,1))"
          git diff --check
          git diff --exit-code --quiet && { echo 'No correction made'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Fix Windows title-tail evidence anchors'
          git push origin HEAD:diagnostics/windows-main-menu-tail
