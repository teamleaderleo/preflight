name: Retain Windows title-tail evidence

on:
  push:
    branches:
      - diagnostics/windows-title-bytecode-acquisition
    paths:
      - '.github/workflows/cli-response-probe.yml'

permissions:
  contents: write

jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diagnostics/windows-main-menu-tail
          fetch-depth: 0
      - name: Append exact deterministic-tail evidence
        shell: bash
        run: |
          set -euo pipefail
          target='docs/evidence/2026-09-01-windows-vm-startup-tuning.md'
          marker='### What owns the current main-menu-ready to main-menu-interactive tail?'
          if grep -Fq "$marker" "$target"; then
            echo 'Evidence already retained.'
            exit 0
          fi
          printf '%s' '' | base64 -d >> "$target"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Document Windows main-menu tail timer'
          git push origin HEAD:diagnostics/windows-main-menu-tail
