name: CLI response probe

on:
  pull_request:
    paths:
      - 'probe-kits/cli-response/**'
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/CliHelp.java'
      - 'preflight-cli/src/test/java/dev/starsector/preflight/cli/CliHelpTest.java'
      - '.github/agent-665-help-patch.py'
      - '.github/workflows/cli-response-probe.yml'
  push:
    branches:
      - main
    paths:
      - 'probe-kits/cli-response/**'
      - '.github/workflows/cli-response-probe.yml'

permissions:
  contents: write

jobs:
  help-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/issue-665-help-ia-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-665-help-ia-v2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply signature-bounded help delegation
        run: python3 .github/agent-665-help-patch.py
      - name: Verify focused help behavior
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -Dtest=CliHelpTest,PreflightCliHelpTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Commit product diff and restore workflow
        shell: bash
        run: |
          git config user.name 'preflight-cli-agent'
          git config user.email 'preflight-cli-agent@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/cli-response-probe.yml
          git rm .github/agent-665-help-patch.py
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java \
                  preflight-cli/src/main/java/dev/starsector/preflight/cli/CliHelp.java \
                  preflight-cli/src/test/java/dev/starsector/preflight/cli/CliHelpTest.java \
                  .github/workflows/cli-response-probe.yml
          git commit -m 'feat(cli): organize everyday help'
          git push origin HEAD:agent/issue-665-help-ia-v2
