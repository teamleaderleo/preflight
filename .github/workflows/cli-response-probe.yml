name: Windows title lifecycle verification

on:
  push:
    branches:
      - diagnostics/windows-title-bytecode-acquisition
    paths:
      - '.github/workflows/cli-response-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-jdk
      - name: Acquire exact reviewed Windows core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'starsector_install-0.98a-RC8.exe'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'starsector-extracted'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'windows-title-lifecycle'
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://f005.backblazeb2.com/file/fractalsoftworks/release/starsector_install-0.98a-RC8.exe' -OutFile $installer
          & 7z x $installer "-o$extractRoot" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed: $LASTEXITCODE" }
          $jars = @(Get-ChildItem -LiteralPath $extractRoot -Filter 'starfarer_obf.jar' -File -Recurse)
          if ($jars.Count -ne 1) { throw "Expected one starfarer_obf.jar, found $($jars.Count)" }
          $jar = $jars[0]
          $jarSha = (Get-FileHash -LiteralPath $jar.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($jarSha -ne '5dd222b9e266d2ac2d63b3dad4983eb05caaf5a247d7dfb82aaeba47ea774cc8') { throw "Core JAR SHA mismatch: $jarSha" }
          $targetToken = 'Oo' + ((('O' * 254) -join ''))
          $targetEntry = "com/fs/starfarer/title/$targetToken.class"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
          try {
            $entry = $zip.GetEntry($targetEntry)
            if ($null -eq $entry) { throw "Missing title class: $targetEntry" }
            $classPath = Join-Path $outputRoot 'windows-title.class'
            $src = $entry.Open()
            try {
              $dst = [System.IO.File]::Create($classPath)
              try { $src.CopyTo($dst) } finally { $dst.Dispose() }
            } finally { $src.Dispose() }
          } finally { $zip.Dispose() }
          $classSha = (Get-FileHash -LiteralPath $classPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($classSha -ne '7a034024de849f2829ad5e41dbb0e58f5979a6e7a81e55527f6839055db3d4c6') { throw "Title class SHA mismatch: $classSha" }
          $className = "com.fs.starfarer.title.$targetToken"
          & javap -classpath $jar.FullName -c -p -s $className | Out-File -LiteralPath (Join-Path $outputRoot 'windows-title-javap.txt') -Encoding utf8
          & javap -classpath $jar.FullName -c -p -s 'com.fs.starfarer.ui.d' | Out-File -LiteralPath (Join-Path $outputRoot 'windows-title-blink-javap.txt') -Encoding utf8
          & javap -classpath $jar.FullName -c -p -s 'com.fs.starfarer.ui.interfacenew' | Out-File -LiteralPath (Join-Path $outputRoot 'windows-title-parent-javap.txt') -Encoding utf8
          & javap -classpath $jar.FullName -c -p -s 'com.fs.starfarer.title.TitleScreenState' | Out-File -LiteralPath (Join-Path $outputRoot 'title-screen-state-javap.txt') -Encoding utf8
          & javap -classpath $jar.FullName -c -p -s 'com.fs.starfarer.loading.ResourceLoaderState' | Out-File -LiteralPath (Join-Path $outputRoot 'resource-loader-state-javap.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "javap failed: $LASTEXITCODE" }
          "PREFLIGHT_CORE_JAR=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run focused semantic and exact-installed tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\mvnw.cmd --batch-mode --no-transfer-progress -pl preflight-agent -am `
            "-Dpreflight.starsector.core.jar=$env:PREFLIGHT_CORE_JAR" `
            "-Dtest=MainMenuInteractivePlanTest,MainMenuInteractiveInstalledAdapterIT,RuntimeSemanticStateTest,FrameTimeRuntimeTest,StartupPhasePlanTest,FrameTimeStartupCompletionPlanTest" `
            "-Dsurefire.failIfNoSpecifiedTests=false" test
          if ($LASTEXITCODE -ne 0) { throw "focused Maven tests failed: $LASTEXITCODE" }
      - name: Upload text-only lifecycle disassembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-title-lifecycle
          path: |
            ${{ runner.temp }}/windows-title-lifecycle/windows-title-javap.txt
            ${{ runner.temp }}/windows-title-lifecycle/windows-title-blink-javap.txt
            ${{ runner.temp }}/windows-title-lifecycle/windows-title-parent-javap.txt
            ${{ runner.temp }}/windows-title-lifecycle/title-screen-state-javap.txt
            ${{ runner.temp }}/windows-title-lifecycle/resource-loader-state-javap.txt
          if-no-files-found: error
