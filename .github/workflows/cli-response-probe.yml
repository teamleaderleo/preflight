name: CLI response probe

on:
  pull_request:
    paths:
      - 'probe-kits/cli-response/**'
      - '.github/workflows/cli-response-probe.yml'
  push:
    branches:
      - main
    paths:
      - 'probe-kits/cli-response/**'
      - '.github/workflows/cli-response-probe.yml'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run response probe self-test
        run: python3 probe-kits/cli-response/test_cli_response_probe.py
