name: Correct Windows title-tail evidence

on:
  push:
    branches:
      - diagnostics/windows-title-bytecode-acquisition
    paths:
      - '.github/workflows/cli-response-probe.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diagnostics/windows-main-menu-tail
          fetch-depth: 0
      - name: Correct retained evidence text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/evidence/2026-09-01-windows-vm-startup-tuning.md')
          text = path.read_text(encoding='utf-8')
          old_typo = 'The title constructor creates the `Preoading...` label'
          if old_typo not in text:
              raise SystemExit('expected Preloading typo missing')
          text = text.replace(old_typo, 'The title constructor creates the `Preloading...` label', 1)
          old = """The exact lifecycle also locates the countdown after the ready seam. `ResourceLoaderState.init(Map)`
has one final `RETURN`; {Th `seam reproduction text already preserved in the repo's evidence update.} The loading state's `traverse()` then
returns `Title Screen State`."""
          new = """The exact lifecycle also locates the countdown after the ready seam. `ResourceLoaderState.init(Map)`
has one final `RETURN`; with `-StartupPhaseProbe`, `StartupPhasePlan` inserts
`resource-init-complete` immediately before it and `StartupPhaseRuntime` routes that marker to
`FrameTimeRuntime.markStartupComplete()`, which publishes `RuntimeSemanticState.mainMenuReady()`.
Without the phase probe, `FrameTimeStartupCompletionPlan` inserts the same
`markStartupComplete()` immediately before the same return. The loading state's `traverse()` then
returns `Title Screen State`."""
          if old not in text:
              raise SystemExit('expected ready-seam corruption missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/2026-09-01-windows-vm-startup-tuning.md
          git commit -m 'Fix Windows title-tail evidence anchors'
          git push origin HEAD:diagnostics/windows-main-menu-tail
