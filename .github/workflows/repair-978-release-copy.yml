name: Repair #978 reviewed copy findings

on:
  push:
    branches:
      - docs/release-tone-pass

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/release-tone-pass
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json
      - name: Apply reviewed copy corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '''Preflight keeps Starsector JARs, mod JARs, executables, assets, and saves outside the acceleration
          path.'''.replace('          ', '')
          new = 'Preflight leaves Starsector JARs, mod JARs, executables, assets, and saves unchanged.'
          if old not in text:
              raise SystemExit('README acceleration-path sentence changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '''Four release checks remain:

          1. Exercise real-game installations on Windows and Linux.
          2. Freeze and exercise the complete hosted Windows, macOS, and Linux candidate.
          3. Run the startup benchmark from the packaged candidate and retain the result.
          4. Complete the packaged support-intake canary cancel/retry/delete sequence.'''.replace('          ', '')
          new = '''Current beta blockers are:

          1. Exercise real-game installations on Windows and native x86-64 Linux.
          2. Freeze and exercise one complete hosted Windows, macOS, and Linux candidate generation.
          3. Run the startup benchmark against the exact packaged candidate bytes and retain the result.
          4. Complete the packaged support-intake partial-upload cancel, cleanup/local-ZIP retention, retry, accepted-receipt, and delete sequence.
          5. Complete release-owner visual acceptance of Home and Hangar at the default and minimum shipped window sizes (#976).'''.replace('          ', '')
          if old not in text:
              raise SystemExit('README release-check list changed unexpectedly')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          settings = Path('preflight-desktop/src/components/SettingsPage.tsx')
          text = settings.read_text(encoding='utf-8')
          old = '<li><strong>No accounts or background telemetry.</strong></li>'
          new = '<li><strong>No accounts. No usage telemetry.</strong></li>'
          if old not in text:
              raise SystemExit('Settings privacy sentence changed unexpectedly')
          settings.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cd preflight-desktop
          npm ci
          npm test -- SettingsPage.test.tsx
          npm run build
          cd ..

          rm .github/workflows/repair-978-release-copy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md preflight-desktop/src/components/SettingsPage.tsx .github/workflows/repair-978-release-copy.yml
          git diff --cached --check
          git commit -m 'Correct reviewed release and privacy copy (#978)'
          git push origin HEAD:docs/release-tone-pass
