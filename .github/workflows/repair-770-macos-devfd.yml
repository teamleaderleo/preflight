name: Repair RC 770 macOS descriptor proof

on:
  push:
    branches: [agent/rc-enabled-mods-cas-670]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/rc-enabled-mods-cas-670
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Use live descriptor paths on Unix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name preflight-agent
          git config user.email preflight-agent@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          path = Path('preflight-cli/src/main/java/dev/starsector/preflight/cli/ParentBoundDirectory.java')
          text = path.read_text()
          old = '''        private Path descriptorPath(int descriptor) throws IOException {
            if (!mac) return Path.of("/proc/self/fd", Integer.toString(descriptor));
            Memory buffer = new Memory(MAXPATHLEN);
            buffer.clear();
            if (PosixLibC.INSTANCE.fcntl(descriptor, F_GETPATH, buffer) != 0) {
                throw failure("resolve reviewed mutation descriptor", Native.getLastError());
            }
            byte[] bytes = buffer.getByteArray(0, MAXPATHLEN);
            int length = 0;
            while (length < bytes.length && bytes[length] != 0) length++;
            if (length == 0) throw new IOException("Reviewed mutation descriptor has no filesystem path.");
            return Path.of(new String(bytes, 0, length, StandardCharsets.UTF_8));
        }
'''
          new = '''        private Path descriptorPath(int descriptor) {
            // Compare the lexical parent with the live descriptor object itself. Linux and Darwin
            // expose process descriptors through these filesystems; this avoids crossing Darwin's
            // variadic fcntl(F_GETPATH) ABI through JNA.
            return Path.of(mac ? "/dev/fd" : "/proc/self/fd", Integer.toString(descriptor));
        }
'''
          if old not in text:
              raise SystemExit('macOS F_GETPATH block moved')
          text = text.replace(old, new)
          text = text.replace('    private static final int F_GETPATH = 50;\n', '')
          text = text.replace('    private static final int MAXPATHLEN = 1024;\n', '')
          text = text.replace('        int fcntl(int fd, int command, Pointer buffer);\n', '')
          path.write_text(text)
          PY
          rm .github/workflows/repair-770-macos-devfd.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(cli): bind mac parent identity through live descriptor path"
          git push origin HEAD:agent/rc-enabled-mods-cas-670
