name: Apply launch settings RC contract

on:
  push:
    branches:
      - fix/launch-settings-quiescent-apply

permissions:
  contents: write

concurrency:
  group: launch-settings-rc-edit
  cancel-in-progress: true

jobs:
  edit-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply reviewed source edits
        shell: bash
        run: |
          set -euo pipefail
          git show 44e058bcc6fd2fda3dc4976588a2d73ba94dc06b:.github/launch-settings-rc-edit.py.gz.b64 \
            | base64 --decode \
            | gzip --decompress \
            > .github/launch-settings-rc-edit.py
          python3 .github/launch-settings-rc-edit.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("preflight-desktop/src/requestFencing.test.tsx")
          text = path.read_text(encoding="utf-8")
          old = '  expect(announce).toHaveBeenLastCalledWith("Game settings saved. Vanilla and Preflight launches will use the same values.", "success");\n'
          new = '''  expect(announce).toHaveBeenLastCalledWith(
            "Global game settings applied and verified. Vanilla and Preflight launches will use the same values.",
            "success",
          );
          '''
          if text.count(old) != 1:
              raise RuntimeError("requestFencing.test.tsx: stale success assertion was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/launch-settings-rc-edit.py .github/launch-settings-rc-edit.py.gz.b64 .github/workflows/launch-settings-rc-edit.yml

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Format native host
        run: cargo fmt --manifest-path preflight-desktop/src-tauri/Cargo.toml

      - name: Verify Java engine
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify desktop application
        working-directory: preflight-desktop
        run: |
          npm ci
          npm run verify

      - name: Commit verified edits
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/launch-settings-rc-edit.py.gz.b64
          test ! -e .github/workflows/launch-settings-rc-edit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "Finish global launch settings Apply contract"
          git push origin HEAD:fix/launch-settings-quiescent-apply
