name: Tagged candidate package lifecycle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v-prefixed release tag whose Distribution bytes will be exercised
        required: true
        type: string
      distribution_run_id:
        description: Successful tag-push Distribution run that produced the draft release
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tagged-candidate-package-lifecycle-${{ inputs.distribution_run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Bind exact tagged candidate
    runs-on: ubuntu-latest
    outputs:
      source_revision: ${{ steps.identity.outputs.source_revision }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Bind the requested tagged Distribution run
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main || {
            echo "::error::Tagged candidate lifecycle must be dispatched from main"
            exit 1
          }
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::tag must be an exact v-prefixed SemVer release tag"
            exit 1
          }
          [[ "${{ inputs.distribution_run_id }}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::distribution_run_id must be a positive integer"
            exit 1
          }
          run_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.distribution_run_id }}")"
          test "$(jq -r '.name' <<<"$run_json")" = "Distribution" || {
            echo "::error::Run is not the Distribution workflow"
            exit 1
          }
          test "$(jq -r '.path' <<<"$run_json")" = ".github/workflows/distribution.yml" || {
            echo "::error::Run did not use the reviewed Distribution workflow path"
            exit 1
          }
          test "$(jq -r '.event' <<<"$run_json")" = "push" || {
            echo "::error::Final candidate Distribution run was not triggered by the release tag"
            exit 1
          }
          test "$(jq -r '.status' <<<"$run_json")" = "completed" \
            -a "$(jq -r '.conclusion' <<<"$run_json")" = "success" || {
            echo "::error::Tagged Distribution run did not complete successfully"
            exit 1
          }
          source_revision="$(jq -er '.head_sha' <<<"$run_json")"
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Distribution run has an invalid head SHA"
            exit 1
          }
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"

      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Prove tag and Distribution identify the same source
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse '${{ inputs.tag }}^{}')"
          test "$tag_sha" = "${{ steps.metadata.outputs.source_revision }}" || {
            echo "::error::Tagged Distribution head SHA differs from the selected release tag"
            exit 1
          }
          node preflight-desktop/scripts/validate-release-version.mjs "${{ inputs.tag }}"

      - name: Download exact complete tagged release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-complete-release-${{ inputs.distribution_run_id }}
          path: tagged-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.distribution_run_id }}

      - name: Verify tagged release with its own source revision
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_complete_release.py --release tagged-release
          source_revision="$(jq -er '.capabilityReceipt.sourceRevision' tagged-release/CAPABILITIES-darwin-arm64.json)"
          test "$source_revision" = "${{ steps.metadata.outputs.source_revision }}" || {
            echo "::error::Tagged capability source revision differs from Distribution head SHA"
            exit 1
          }
          version="$(jq -er '.version' tagged-release/latest.json)"
          test "v$version" = "${{ inputs.tag }}" || {
            echo "::error::Tagged release version does not match the selected tag"
            exit 1
          }
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf 'Tagged candidate %s is bound to Distribution run %s at %s\n' \
            "$version" "${{ inputs.distribution_run_id }}" "$source_revision"

  lifecycle:
    name: Tagged candidate lifecycle / ${{ matrix.name }}
    needs: inspect
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package: Preflight-Linux-x86_64.deb
            candidate_name: Preflight-candidate.deb
            checksum: SHA256SUMS-linux-x64.txt
            bundles: deb
          - name: Windows
            os: windows-latest
            package: Preflight-Windows-x86_64.exe
            candidate_name: Preflight-candidate-setup.exe
            checksum: SHA256SUMS-win32-x64.txt
            bundles: nsis
          - name: macOS
            os: macos-latest
            package: Preflight-macOS-arm64.dmg
            candidate_name: Preflight-candidate.dmg
            checksum: SHA256SUMS-darwin-arm64.txt
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.source_revision }}

      - uses: ./.github/actions/setup-build-jdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preflight-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend tooling
        working-directory: preflight-desktop
        run: npm ci

      - name: Download exact complete tagged release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preflight-complete-release-${{ inputs.distribution_run_id }}
          path: tagged-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.distribution_run_id }}

      - name: Verify and stage exact tagged platform package
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          CANDIDATE_NAME: ${{ matrix.candidate_name }}
          CHECKSUM_NAME: ${{ matrix.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_complete_release.py --release tagged-release
          mkdir candidate-newer
          node --input-type=module - "$PACKAGE_NAME" "$CHECKSUM_NAME" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const [packageName, checksumName] = process.argv.slice(2);
          const lines = readFileSync(join("tagged-release", checksumName), "utf8").trim().split(/\r?\n/);
          const row = lines.find((line) => line.endsWith(`  ${packageName}`));
          if (!row) throw new Error(`No checksum entry for ${packageName}`);
          const expected = row.slice(0, 64);
          const bytes = readFileSync(join("tagged-release", packageName));
          const actual = createHash("sha256").update(bytes).digest("hex");
          if (actual !== expected) throw new Error(`Tagged candidate checksum mismatch for ${packageName}`);
          console.log(`${actual}  ${packageName}`);
          NODE
          cp "tagged-release/$PACKAGE_NAME" "candidate-newer/$CANDIDATE_NAME"

      - name: Build an earlier rehearsal package from the tagged source revision
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/releases/0.0.0-candidate-lifecycle.md <<'EOF'
          # Candidate lifecycle fixture

          Runner-local earlier package used only to exercise exact tagged-candidate upgrade and rollback.
          EOF
          node preflight-desktop/scripts/set-release-version.mjs 0.0.0-candidate-lifecycle
          ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -DskipTests clean package
          python3 -c "from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); import verify_release_boundary as v; v.validate_jar_bytes(Path('preflight-cli/target/preflight.jar').read_bytes())"
          cd preflight-desktop
          npm run engine:prepare:verified
          npm run desktop:clean
          npx tauri build --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.ci.conf.json

      - name: Exercise exact tagged candidate install, upgrade, rollback, and removal
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DISTRIBUTION_RUN_ID: ${{ inputs.distribution_run_id }}
          SOURCE_REVISION: ${{ needs.inspect.outputs.source_revision }}
          CANDIDATE_VERSION: ${{ needs.inspect.outputs.version }}
          PACKAGE_NAME: ${{ matrix.package }}
          CHECKSUM_NAME: ${{ matrix.checksum }}
          PLATFORM_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tagged-candidate-lifecycle-report
          node preflight-desktop/scripts/exercise-package-lifecycle.mjs \
            preflight-desktop/src-tauri/target/release/bundle \
            candidate-newer \
            tagged-candidate-lifecycle-report/lifecycle.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const reportPath = join("tagged-candidate-lifecycle-report", "lifecycle.json");
          const report = JSON.parse(readFileSync(reportPath, "utf8"));
          const packagePath = join("tagged-release", process.env.PACKAGE_NAME);
          const bytes = readFileSync(packagePath);
          report.format = "preflight-tagged-package-lifecycle-v1";
          report.platform = process.env.PLATFORM_NAME;
          report.releaseTag = process.env.RELEASE_TAG;
          report.distributionRunId = process.env.DISTRIBUTION_RUN_ID;
          report.sourceRevision = process.env.SOURCE_REVISION;
          report.candidateVersion = process.env.CANDIDATE_VERSION;
          report.exactCandidatePackage = {
            name: process.env.PACKAGE_NAME,
            bytes: bytes.length,
            sha256: createHash("sha256").update(bytes).digest("hex"),
            checksumManifest: process.env.CHECKSUM_NAME,
          };
          writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
          NODE
          cat tagged-candidate-lifecycle-report/lifecycle.json

      - name: Preserve tagged candidate lifecycle receipt
        if: always() && hashFiles('tagged-candidate-lifecycle-report/lifecycle.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tagged-candidate-package-lifecycle-${{ matrix.name }}-${{ inputs.distribution_run_id }}
          path: tagged-candidate-lifecycle-report/lifecycle.json
          if-no-files-found: error
          retention-days: 30
