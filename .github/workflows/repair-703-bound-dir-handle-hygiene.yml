name: Repair #703 bound-directory handle hygiene

on:
  push:
    branches:
      - repair/703-bound-dir-handle-hygiene
    paths:
      - '.github/workflows/repair-703-bound-dir-handle-hygiene.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/703-bound-dir-handle-hygiene
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply reviewed handle hygiene and self-delete
        shell: bash
        env:
          EXPECTED_PARENT: 698aaa29db7ff5f2102a1caac55fc3d7296ac3b2
          SOURCE: preflight-desktop/src-tauri/src/report_authority_dir.rs
          SOURCE_BLOB: 92c075f2364379239396d4640ccc801d6c0ab0e4
          TEST: preflight-desktop/src-tauri/tests/report_authority_dir.rs
          TEST_BLOB: 3f6d24dd94b130ed8d61313208e3faac3dfeaa49
          LOCK: preflight-desktop/capabilities/release-receipt-source-lock.json
          LOCK_BLOB: 23498e1e981841521ed5e45183c8fb46d8e6279d
          SELF: .github/workflows/repair-703-bound-dir-handle-hygiene.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object "$SOURCE")" = "$SOURCE_BLOB"
          test "$(git hash-object "$TEST")" = "$TEST_BLOB"
          test "$(git hash-object "$LOCK")" = "$LOCK_BLOB"

          python3 - <<'PY'
          from pathlib import Path

          source = Path('preflight-desktop/src-tauri/src/report_authority_dir.rs')
          text = source.read_text()

          method_anchor = '''    pub(crate) fn path(&self) -> &Path {
                  &self.path
              }
          '''
          method_new = '''    pub(crate) fn path(&self) -> &Path {
                  &self.path
              }

              #[cfg(all(test, unix))]
              pub(crate) fn is_close_on_exec(&self) -> io::Result<bool> {
                  imp::is_close_on_exec(&self.file)
              }
          '''
          if text.count(method_anchor) != 1:
              raise SystemExit('BoundDirectory test seam changed unexpectedly')
          text = text.replace(method_anchor, method_new, 1)

          directory_flags = 'libc::O_RDONLY | libc::O_NOFOLLOW | libc::O_DIRECTORY,'
          if text.count(directory_flags) != 2:
              raise SystemExit(f'expected two directory open flag sites, found {text.count(directory_flags)}')
          text = text.replace(
              directory_flags,
              'libc::O_RDONLY | libc::O_NOFOLLOW | libc::O_DIRECTORY | libc::O_CLOEXEC,',
          )

          create_flags = 'libc::O_WRONLY | libc::O_CREAT | libc::O_EXCL | libc::O_NOFOLLOW,'
          if text.count(create_flags) != 1:
              raise SystemExit('create_new flag site changed unexpectedly')
          text = text.replace(
              create_flags,
              'libc::O_WRONLY | libc::O_CREAT | libc::O_EXCL | libc::O_NOFOLLOW | libc::O_CLOEXEC,',
              1,
          )

          read_flags = 'libc::O_RDONLY | libc::O_NOFOLLOW,'
          if text.count(read_flags) != 1:
              raise SystemExit('open_regular flag site changed unexpectedly')
          text = text.replace(
              read_flags,
              'libc::O_RDONLY | libc::O_NOFOLLOW | libc::O_CLOEXEC,',
              1,
          )

          duplicate = 'let duplicate = unsafe { libc::dup(parent.as_raw_fd()) };'
          if text.count(duplicate) != 1:
              raise SystemExit('directory duplicate site changed unexpectedly')
          text = text.replace(
              duplicate,
              'let duplicate = unsafe { libc::fcntl(parent.as_raw_fd(), libc::F_DUPFD_CLOEXEC, 0) };',
              1,
          )

          identity_anchor = '''    pub(super) fn same_identity(left: &File, right: &File) -> io::Result<bool> {
                  let left = left.metadata()?;
                  let right = right.metadata()?;
                  Ok(left.dev() == right.dev() && left.ino() == right.ino())
              }
          '''
          identity_new = identity_anchor + '''
              #[cfg(test)]
              pub(super) fn is_close_on_exec(file: &File) -> io::Result<bool> {
                  let flags = unsafe { libc::fcntl(file.as_raw_fd(), libc::F_GETFD) };
                  if flags < 0 {
                      return Err(io::Error::last_os_error());
                  }
                  Ok(flags & libc::FD_CLOEXEC != 0)
              }
          '''
          if text.count(identity_anchor) != 1:
              raise SystemExit('Unix identity helper changed unexpectedly')
          text = text.replace(identity_anchor, identity_new, 1)

          windows_old = '''            let wide = unsafe {
                          std::slice::from_raw_parts(buffer.as_ptr().add(12).cast::<u16>(), name_bytes / 2)
                      };
                      let name = OsString::from_wide(wide).into_string().map_err(|_| {'''
          windows_new = '''            let wide = buffer[12..12 + name_bytes]
                          .chunks_exact(2)
                          .map(|pair| u16::from_ne_bytes([pair[0], pair[1]]))
                          .collect::<Vec<_>>();
                      let name = OsString::from_wide(&wide).into_string().map_err(|_| {'''
          if text.count(windows_old) != 1:
              raise SystemExit('Windows directory decoding seam changed unexpectedly')
          text = text.replace(windows_old, windows_new, 1)
          source.write_text(text)

          test_path = Path('preflight-desktop/src-tauri/tests/report_authority_dir.rs')
          tests = test_path.read_text()
          anchor = '''#[test]
          fn create_after_public_root_replacement_stays_in_the_reviewed_generation() {
          '''
          regression = '''#[cfg(unix)]
          #[test]
          fn retained_directory_and_entry_handles_are_close_on_exec() {
              use std::os::fd::AsRawFd;

              let base = temp_root("close-on-exec");
              let root = base.join("authority");
              fs::create_dir_all(&root).unwrap();
              let directory = BoundDirectory::open(&root).unwrap();
              assert!(directory.is_close_on_exec().unwrap());

              let file = directory.create_new("secret.json", 0o600).unwrap();
              let flags = unsafe { libc::fcntl(file.as_raw_fd(), libc::F_GETFD) };
              assert!(flags >= 0);
              assert_ne!(flags & libc::FD_CLOEXEC, 0);
              drop(file);

              let file = directory.open_regular("secret.json").unwrap();
              let flags = unsafe { libc::fcntl(file.as_raw_fd(), libc::F_GETFD) };
              assert!(flags >= 0);
              assert_ne!(flags & libc::FD_CLOEXEC, 0);
              drop(file);

              fs::remove_dir_all(base).unwrap();
          }

          #[test]
          fn create_after_public_root_replacement_stays_in_the_reviewed_generation() {
          '''
          if tests.count(anchor) != 1:
              raise SystemExit('integration-test insertion anchor changed unexpectedly')
          test_path.write_text(tests.replace(anchor, regression, 1))
          PY

          rustfmt --edition 2021 "$SOURCE" "$TEST"

          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          lock_path = Path('preflight-desktop/capabilities/release-receipt-source-lock.json')
          lock = json.loads(lock_path.read_text())
          for name in [
              'preflight-desktop/src-tauri/src/report_authority.rs',
              'preflight-desktop/src-tauri/src/report_authority_dir.rs',
              'preflight-desktop/src-tauri/src/reports.rs',
          ]:
              data = Path(name).read_text().replace('\r\n', '\n').encode()
              lock['sources'][name] = sha256(data).hexdigest()
          lock['sources'] = dict(sorted(lock['sources'].items()))
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          PY

          python3 - <<'PY'
          from pathlib import Path
          source = Path('preflight-desktop/src-tauri/src/report_authority_dir.rs').read_text()
          assert source.count('libc::O_CLOEXEC') >= 4
          assert 'libc::F_DUPFD_CLOEXEC' in source
          assert 'std::slice::from_raw_parts(buffer.as_ptr().add(12).cast::<u16>()' not in source
          PY

          node preflight-desktop/scripts/review-capability-lock.mjs --check
          git diff --check -- "$SOURCE" "$TEST" "$LOCK"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n%s\n' "$LOCK" "$SOURCE" "$TEST" | sort)"
          test "$changed" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE" "$TEST" "$LOCK"
          git rm "$SELF"
          staged="$(git diff --cached --name-only | sort)"
          expected_staged="$(printf '%s\n%s\n%s\n%s\n' "$LOCK" "$SELF" "$SOURCE" "$TEST" | sort)"
          test "$staged" = "$expected_staged"
          git commit -m "fix(desktop): keep report capability handles private"
          git push origin HEAD:repair/703-bound-dir-handle-hygiene
