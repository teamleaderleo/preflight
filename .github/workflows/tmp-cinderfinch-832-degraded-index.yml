          new = '''        if (options.textureAuto()) {
            System.out.println("Preflight is matching prepared textures to the current installed profile...");
            try {
                CurrentTextureCache.Resolution resolved = CurrentTextureCache.resolve(
                        target.installRoot(), options.textureCacheDirectory());
                return new Texture(
                        resolved.cacheDirectory(),
                        resolved.manifest(),
                        resolved.index(),
                        resolved.resourceIndex(),
                        true,
                        resolved.profileFingerprint(),
                        resolved.manifestSha256(),
                        resolved.indexSha256(),
                        resolved.checkedProviders(),
                        resolved.indexBuildMillis());
            } catch (CurrentTextureCache.GenerationAuthorityUnavailableException unavailable) {
                System.err.println("Preflight prepared textures are unavailable for this launch: "
                        + unavailable.getMessage() + "; vanilla texture loading remains active.");
                return null;
            }
        }'''
          if text.count(old) != 1:
              raise SystemExit('LaunchCacheContexts automatic-texture seam changed')
          contexts.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('preflight-cli/src/test/java/dev/starsector/preflight/cli/CurrentTextureCacheTest.java')
          text = test.read_text(encoding='utf-8')
          if 'import java.util.List;\n' not in text:
              text = text.replace('import java.nio.file.Path;\n', 'import java.nio.file.Path;\nimport java.util.List;\n')
          marker = '''    private Fixture fixture() throws Exception {'''
          addition = '''    @Test
    void degradedProviderCannotAuthorizeExactTextureReuse() throws Exception {
        Path root = Files.createDirectories(temporaryDirectory.resolve("degraded-root"));
        Path source = Files.writeString(root.resolve("test.png"), "texture");
        ResourceIndex degraded = new ResourceIndex(
                "d".repeat(64),
                List.of(new ResourceIndex.Root("mod", root, false)),
                Map.of("test.png", List.of(new ResourceIndex.Provider(
                        0,
                        "test.png",
                        Files.size(source),
                        Files.getLastModifiedTime(source).toMillis()))));

        CurrentTextureCache.GenerationAuthorityUnavailableException error = assertThrows(
                CurrentTextureCache.GenerationAuthorityUnavailableException.class,
                () -> CurrentTextureCache.requireExactGenerationAuthority(degraded));

        assertTrue(error.getMessage().contains("1 resource provider"), error.getMessage());
