name: Temporary #832 degraded-index compatibility repair

on:
  push:
    branches: [hardening/832-degraded-index-compat]
    paths:
      - '.github/workflows/tmp-cinderfinch-832-degraded-index.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/832-degraded-index-compat
      - uses: ./.github/actions/setup-build-jdk
      - name: Restore degraded ResourceIndex compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          builder = Path('preflight-cli/src/main/java/dev/starsector/preflight/cli/ResourceIndexBuilder.java')
          text = builder.read_text(encoding='utf-8')

          old = '''                    OpenedFileGenerationAuthority.Generation generation;
                    try {
                        generation = OpenedFileGenerationAuthority.capture(realChild);
                    } catch (IOException unavailable) {
                        throw new GenerationAuthorityException(
                                "Exact file-generation authority is unavailable for " + realChild,
                                unavailable);
                    }
                    BasicFileAttributes generationBound = Files.readAttributes(realChild, BasicFileAttributes.class);
                    long modifiedMillis = Math.max(0, attributes.lastModifiedTime().toMillis());
                    if (!generationBound.isRegularFile()
                            || generationBound.size() != attributes.size()
                            || Math.max(0, generationBound.lastModifiedTime().toMillis()) != modifiedMillis) {
                        throw new GenerationAuthorityException(
                                "Provider changed while file-generation authority was captured: " + realChild);
                    }
                    ResourceIndex.Provider provider = new ResourceIndex.Provider(
                            rootIndex,
                            relative,
                            attributes.size(),
                            modifiedMillis,
                            generation.provider(),
                            generation.token());'''
          new = '''                    OpenedFileGenerationAuthority.Generation generation = null;
                    try {
                        generation = OpenedFileGenerationAuthority.capture(realChild);
                    } catch (IOException unavailable) {
                        noteGenerationUnavailable(diagnostics, root, unavailable);
                    }
                    BasicFileAttributes generationBound = Files.readAttributes(realChild, BasicFileAttributes.class);
                    long modifiedMillis = Math.max(0, attributes.lastModifiedTime().toMillis());
                    if (!generationBound.isRegularFile()
                            || generationBound.size() != attributes.size()
                            || Math.max(0, generationBound.lastModifiedTime().toMillis()) != modifiedMillis) {
                        throw new GenerationAuthorityException(
                                "Provider changed while file-generation authority was captured: " + realChild);
                    }
                    String generationProvider = generation == null ? "" : generation.provider();
                    String generationToken = generation == null ? "" : generation.token();
                    ResourceIndex.Provider provider = new ResourceIndex.Provider(
                            rootIndex,
                            relative,
                            attributes.size(),
                            modifiedMillis,
                            generationProvider,
                            generationToken);'''
          if text.count(old) != 1:
              raise SystemExit('ResourceIndexBuilder generation-capture seam changed')
          text = text.replace(old, new)

          old = '''                    update(fingerprint, Long.toString(attributes.size()));
                    update(fingerprint, Long.toString(modifiedMillis));
                    update(fingerprint, generation.provider());
                    update(fingerprint, generation.token());'''
          new = '''                    update(fingerprint, Long.toString(attributes.size()));
                    update(fingerprint, Long.toString(modifiedMillis));
                    update(fingerprint, generationProvider);
                    update(fingerprint, generationToken);'''
          if text.count(old) != 1:
              raise SystemExit('ResourceIndexBuilder generation fingerprint seam changed')
          text = text.replace(old, new)

          old = '''    private static void requireCurrentProviderGenerations(List<RootScan> scans) throws IOException {
        for (RootScan scan : scans) {
            for (ProviderCapture capture : scan.captures()) {
                OpenedFileGenerationAuthority.Generation expected =
                        new OpenedFileGenerationAuthority.Generation(
                                capture.provider().generationProvider(),
                                capture.provider().generationToken());
                Path current = PathContainment.existingInsideRealRoot(
                        scan.realRoot(),
                        capture.publicPath());
                if (!current.equals(capture.realPath())) {
                    throw new OpenedFileGenerationAuthority.StaleGenerationException(
                            "Indexed provider pathname changed before publication: "
                                    + capture.publicPath());
                }
                OpenedFileGenerationAuthority.requireCurrent(current, expected);
            }
        }
    }
'''
          new = '''    private static void requireCurrentProviderGenerations(List<RootScan> scans) throws IOException {
        for (RootScan scan : scans) {
            for (ProviderCapture capture : scan.captures()) {
                ResourceIndex.Provider provider = capture.provider();
                Path current = PathContainment.existingInsideRealRoot(
                        scan.realRoot(),
                        capture.publicPath());
                if (!current.equals(capture.realPath())) {
                    throw new OpenedFileGenerationAuthority.StaleGenerationException(
                            "Indexed provider pathname changed before publication: "
                                    + capture.publicPath());
                }
                BasicFileAttributes attributes = Files.readAttributes(current, BasicFileAttributes.class);
                if (!attributes.isRegularFile()
                        || attributes.size() != provider.size()
                        || Math.max(0, attributes.lastModifiedTime().toMillis()) != provider.modifiedMillis()) {
                    throw new OpenedFileGenerationAuthority.StaleGenerationException(
                            "Indexed provider metadata changed before publication: "
                                    + capture.publicPath());
                }
                if (provider.hasGenerationAuthority()) {
                    OpenedFileGenerationAuthority.requireCurrent(
                            current,
                            new OpenedFileGenerationAuthority.Generation(
                                    provider.generationProvider(), provider.generationToken()));
                }
            }
        }
    }

    private static void noteGenerationUnavailable(
            List<String> diagnostics, SourceRoot root, IOException unavailable) {
        String prefix = "Exact file-generation authority unavailable in resource root "
                + root.id() + "; ";
        if (diagnostics.stream().anyMatch(value -> value.startsWith(prefix))) {
            return;
        }
        String detail = unavailable.getMessage();
        if (detail == null || detail.isBlank()) {
            detail = unavailable.getClass().getSimpleName();
        }
        diagnostics.add(prefix
                + "provider metadata retained without exact generation authority; exact content evidence will fail closed. "
                + "First failure: " + detail);
    }
'''
          if text.count(old) != 1:
              raise SystemExit('ResourceIndexBuilder publication-recheck seam changed')
          builder.write_text(text.replace(old, new), encoding='utf-8')

          current = Path('preflight-cli/src/main/java/dev/starsector/preflight/cli/CurrentTextureCache.java')
          text = current.read_text(encoding='utf-8')
          old = '''        if (currentBuild.diagnostics().stream()
                .anyMatch(value -> value.startsWith("Enabled mod directory not found for ID:"))) {
            throw new IOException("The enabled-mod profile contains missing mod directories; prepare and launch "
                    + "only after the profile is internally consistent");
        }

        Path indexCandidate = ResourceIndexIO.directory(realCache).resolve(fingerprint + ".spfi");'''
          new = '''        if (currentBuild.diagnostics().stream()
                .anyMatch(value -> value.startsWith("Enabled mod directory not found for ID:"))) {
            throw new IOException("The enabled-mod profile contains missing mod directories; prepare and launch "
                    + "only after the profile is internally consistent");
        }
        requireExactGenerationAuthority(current);

        Path indexCandidate = ResourceIndexIO.directory(realCache).resolve(fingerprint + ".spfi");'''
          if text.count(old) != 1:
              raise SystemExit('CurrentTextureCache current-index seam changed')
          text = text.replace(old, new)

          marker = '''    private static Path firstArtifact(Path cache, String fileName, List<String> directories) throws IOException {'''
          addition = '''    static void requireExactGenerationAuthority(ResourceIndex index)
            throws GenerationAuthorityUnavailableException {
        long unavailable = index.entries().values().stream()
                .flatMap(List::stream)
                .filter(provider -> !provider.hasGenerationAuthority())
                .count();
        if (unavailable > 0) {
            throw new GenerationAuthorityUnavailableException(
                    "Exact file-generation authority is unavailable for " + unavailable
                            + " resource provider(s)");
        }
    }

    static final class GenerationAuthorityUnavailableException extends IOException {
        GenerationAuthorityUnavailableException(String message) {
            super(message);
        }
    }

'''
