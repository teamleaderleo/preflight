              raise SystemExit('CurrentTextureCache helper insertion seam changed')
          current.write_text(text.replace(marker, addition + marker), encoding='utf-8')

          contexts = Path('preflight-cli/src/main/java/dev/starsector/preflight/cli/LaunchCacheContexts.java')
          text = contexts.read_text(encoding='utf-8')
          old = '''        if (options.textureAuto()) {
