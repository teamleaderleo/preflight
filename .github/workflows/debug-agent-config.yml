name: Debug agent launch config digest

on:
  pull_request:
    paths:
      - 'preflight-cli/src/main/java/dev/starsector/preflight/cli/RunCommand.java'
      - '.github/workflows/debug-agent-config.yml'

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Export normalized RunCommand digest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('preflight-cli/src/main/java/dev/starsector/preflight/cli/RunCommand.java').read_text().replace('\r\n', '\n').encode()
          print('::notice title=run-command-sha256::' + hashlib.sha256(data).hexdigest())
          PY
