name: Rust MSRV

on:
  push:
    branches: [main]
    paths:
      - 'preflight-desktop/src-tauri/Cargo.toml'
      - 'preflight-desktop/src-tauri/Cargo.lock'
      - 'preflight-desktop/src-tauri/src/**'
      - 'preflight-desktop/src-tauri/build.rs'
      - '.github/workflows/rust-msrv.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'preflight-desktop/src-tauri/Cargo.toml'
      - 'preflight-desktop/src-tauri/Cargo.lock'
      - 'preflight-desktop/src-tauri/src/**'
      - 'preflight-desktop/src-tauri/build.rs'
      - '.github/workflows/rust-msrv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.0

      - name: Assert declared compiler version
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          [[ "$(rustc --version)" == rustc\ 1.85.0\ * ]]

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Provide compile-time engine resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight-desktop/src-tauri/target/engine
          printf 'MSRV compile-time resource placeholder\n' \
            > preflight-desktop/src-tauri/target/engine/msrv-placeholder.txt

      - name: Test native host at declared MSRV
        run: cargo test --locked --manifest-path preflight-desktop/src-tauri/Cargo.toml

  apply_703_expiry:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/desktop-report-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/desktop-report-authority

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.0
          components: rustfmt

      - name: Run the stored expiry patch
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path(".github/workflows/apply-703-expiry.yml").read_text())
          scripts = {
              step.get("name"): step.get("run")
              for step in workflow["jobs"]["apply"]["steps"]
              if isinstance(step, dict)
          }
          for name in (
              "Apply expiry pruning and aligned tests",
              "Format and verify",
          ):
              script = scripts.get(name)
              if not isinstance(script, str):
                  raise SystemExit(f"stored updater step missing: {name}")
              subprocess.run(["bash", "-euo", "pipefail", "-c", script], check=True)
          PY

      - name: Publish the self-cleaned branch commit
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/rust-msrv.yml
          rm -f .github/workflows/apply-703-expiry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prune expired native report authorities"
          git push origin HEAD:fix/desktop-report-authority
