name: Agent 665 CLI help polish

on:
  push:
    branches:
      - agent/issue-665-cli-help

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-665-cli-help
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply focused CLI help changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cli_path = Path('preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java')
          text = cli_path.read_text()

          old = '''    static void commandUsage(String command, java.io.PrintStream output) {
              output.println("Usage:");
              for (String line : USAGE.get(command)) {
                  output.println("  " + line);
              }
          }
          '''
          new = '''    static void commandUsage(String command, java.io.PrintStream output) {
              output.println("Usage:");
              if ("run".equals(command)) {
                  output.println("  preflight run");
                  output.println();
                  output.println("Everyday:");
                  output.println("  preflight doctor");
                  output.println("  preflight prepare --plan");
                  output.println("  preflight run");
                  output.println("  preflight run --direct");
                  output.println();
                  output.println("Expert options:");
              }
              for (String line : USAGE.get(command)) {
                  output.println("  " + line);
              }
          }
          '''
          if old not in text:
              raise SystemExit('commandUsage block drifted')
          text = text.replace(old, new, 1)

          old = '''    private static void globalUsage(java.io.PrintStream output) {
              output.println("Usage:");
              output.println("  preflight <command> [options]");
              output.println("  preflight help <command>");
              output.println();
              output.println("Commands:");
              // Widened to whatever the longest command actually is, so adding one that outgrows the
              // column cannot quietly leave a single ragged row in the first thing anyone sees.
              int width = USAGE.keySet().stream().mapToInt(String::length).max().orElse(12);
              for (String command : USAGE.keySet()) {
                  output.printf("  %-" + width + "s  %s%n", command, commandSummary(command));
              }
              output.println();
              output.println("Run `preflight <command> --help` for detailed usage.");
              output.println("Set PREFLIGHT_DEBUG=1 to include stack traces for unexpected failures.");
          }
          '''
          new = '''    private static void globalUsage(java.io.PrintStream output) {
              globalUsage(output, terminalWidth());
          }

          static void globalUsage(java.io.PrintStream output, int terminalWidth) {
              int width = Math.max(32, Math.min(160, terminalWidth));
              output.println("Usage:");
              output.println("  preflight <command> [options]");
              output.println("  preflight help <command>");
              output.println();
              output.println("Commands:");
              int commandWidth = USAGE.keySet().stream().mapToInt(String::length).max().orElse(12);
              for (CommandGroup group : COMMAND_GROUPS) {
                  output.println(group.title() + ":");
                  for (String command : group.commands()) {
                      printCommandRow(output, command, commandWidth, width);
                  }
              }
              output.println();
              printWrapped(output, "Run `preflight <command> --help` for detailed usage.", width, 0);
              printWrapped(output, "Set PREFLIGHT_DEBUG=1 to include stack traces for unexpected failures.", width, 0);
          }

          private static final List<CommandGroup> COMMAND_GROUPS = List.of(
                  new CommandGroup("Play", List.of("run", "stop", "doctor", "launch-settings")),
                  new CommandGroup("Mods and preparation", List.of("prepare", "profile", "cache")),
                  new CommandGroup("Maintenance and support", List.of("evidence", "install", "uninstall")),
                  new CommandGroup(
                          "Advanced / development",
                          List.of(
                                  "scan",
                                  "index",
                                  "texture",
                                  "font",
                                  "assets",
                                  "lint",
                                  "audio",
                                  "classpath",
                                  "benchmark",
                                  "analyze",
                                  "fingerprint",
                                  "summarize")));

          private static void printCommandRow(
                  java.io.PrintStream output, String command, int commandWidth, int terminalWidth) {
              String summary = commandSummary(command);
              if (terminalWidth < 64) {
                  output.println("  " + command);
                  printWrapped(output, summary, terminalWidth, 4);
                  return;
              }
              int summaryColumn = commandWidth + 4;
              List<String> lines = wrapWords(summary, Math.max(20, terminalWidth - summaryColumn));
              output.printf("  %-" + commandWidth + "s  %s%n", command, lines.get(0));
              String indent = " ".repeat(summaryColumn);
              for (int index = 1; index < lines.size(); index++) {
                  output.println(indent + lines.get(index));
              }
          }

          private static void printWrapped(
                  java.io.PrintStream output, String text, int terminalWidth, int indent) {
              int contentWidth = Math.max(12, terminalWidth - indent);
              String prefix = " ".repeat(indent);
              for (String line : wrapWords(text, contentWidth)) {
                  output.println(prefix + line);
              }
          }

          private static List<String> wrapWords(String text, int width) {
              java.util.ArrayList<String> lines = new java.util.ArrayList<>();
              StringBuilder line = new StringBuilder();
              for (String word : text.split("\\\\s+")) {
                  if (line.length() > 0 && line.length() + 1 + word.length() > width) {
                      lines.add(line.toString());
                      line.setLength(0);
                  }
                  if (line.length() > 0) {
                      line.append(' ');
                  }
                  line.append(word);
              }
              if (line.length() > 0) {
                  lines.add(line.toString());
              }
              return lines.isEmpty() ? List.of("") : List.copyOf(lines);
          }

          private static int terminalWidth() {
              String columns = System.getenv("COLUMNS");
              if (columns != null) {
                  try {
                      return Integer.parseInt(columns);
                  } catch (NumberFormatException ignored) {
                      // Fall through to the deterministic default.
                  }
              }
              return 88;
          }

          private record CommandGroup(String title, List<String> commands) {
          }
          '''
          if old not in text:
              raise SystemExit('globalUsage block drifted')
          text = text.replace(old, new, 1)
          cli_path.write_text(text)

          test_path = Path('preflight-cli/src/test/java/dev/starsector/preflight/cli/PreflightCliHelpTest.java')
          test = test_path.read_text()
          marker = '''    @Test
              void unknownCommandIsExplicitAndSuggestsLikelyTypo() throws Exception {
          '''
          addition = '''    @Test
              void globalHelpGroupsEverydayCommandsBeforeDevelopmentTools() throws Exception {
                  String output = capture(new String[] {"--help"}).standardOutput();

                  int play = output.indexOf("Play:");
                  int mods = output.indexOf("Mods and preparation:");
                  int maintenance = output.indexOf("Maintenance and support:");
                  int advanced = output.indexOf("Advanced / development:");
                  assertTrue(play >= 0, output);
                  assertTrue(play < mods, output);
                  assertTrue(mods < maintenance, output);
                  assertTrue(maintenance < advanced, output);
                  assertTrue(output.indexOf("doctor") < advanced, output);
                  assertTrue(output.indexOf("benchmark") > advanced, output);
              }

              @Test
              void globalHelpStacksCleanlyAtNarrowWidths() throws Exception {
                  ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                  try (PrintStream output = new PrintStream(bytes, true, StandardCharsets.UTF_8)) {
                      PreflightCli.globalUsage(output, 44);
                  }
                  String rendered = bytes.toString(StandardCharsets.UTF_8);
                  assertTrue(rendered.contains("  launch-settings\\n    Read or update"), rendered);
                  for (String line : rendered.lines().toList()) {
                      assertTrue(line.length() <= 44, "line exceeds narrow width: " + line);
                  }
              }

              @Test
              void runHelpLeadsWithTheOrdinaryPathBeforeExpertOptions() throws Exception {
                  String output = capture(new String[] {"run", "--help"}).standardOutput();
                  int everyday = output.indexOf("Everyday:");
                  int expert = output.indexOf("Expert options:");

                  assertTrue(everyday >= 0, output);
                  assertTrue(expert > everyday, output);
                  assertTrue(output.indexOf("preflight doctor", everyday) < expert, output);
                  assertTrue(output.indexOf("preflight run --direct", everyday) < expert, output);
                  assertTrue(output.indexOf("--adapter-targets", expert) > expert, output);
              }

          ''' + marker
          if marker not in test:
              raise SystemExit('test insertion marker drifted')
          test = test.replace(marker, addition, 1)
          test_path.write_text(test)
          PY
      - name: Verify CLI help slice
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -Dtest=PreflightCliHelpTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Commit reviewed slice and remove staging workflow
        shell: bash
        run: |
          git config user.name 'preflight-cli-agent'
          git config user.email 'preflight-cli-agent@users.noreply.github.com'
          git rm .github/workflows/agent-665-cli-help.yml
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java \
                  preflight-cli/src/test/java/dev/starsector/preflight/cli/PreflightCliHelpTest.java
          git commit -m 'feat(cli): organize everyday help'
          git push origin HEAD:agent/issue-665-cli-help
