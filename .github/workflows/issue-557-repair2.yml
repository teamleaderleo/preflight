name: Issue 557 reviewed repair retry

on:
  push:
    branches: [codex/issue-557-mod-compat-precheck]
    paths: [.github/workflows/issue-557-repair2.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/issue-557-mod-compat-precheck
          fetch-depth: 0
      - name: Use runner JDK 17
        run: |
          test -n "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Wire profile repair command
        shell: python
        run: |
          from pathlib import Path

          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one, found {text.count(old)}")
              return text.replace(old, new, 1)

          p = Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/ProfileCommand.java")
          text = p.read_text()
          text = once(text,
              '} else if (!"list".equals(operation)) {\n            throw new IllegalArgumentException("Expected: profile <list|save|activate|rename|delete> ...");',
              '} else if (!"list".equals(operation) && !"repair-dependencies".equals(operation)) {\n            throw new IllegalArgumentException(\n                    "Expected: profile <list|save|activate|repair-dependencies|rename|delete> ...");',
              "operation validation")
          text = once(text,
              'if (options.confirmed() && !("activate".equals(operation) || mutation)) {\n            throw new IllegalArgumentException("--yes is only valid for profile activate, rename, or delete");',
              'if (options.confirmed()\n                && !("activate".equals(operation)\n                        || "repair-dependencies".equals(operation)\n                        || mutation)) {\n            throw new IllegalArgumentException(\n                    "--yes is only valid for profile activate, repair-dependencies, rename, or delete");',
              "confirmation validation")
          rename = '            case "rename" -> rename(\n'
          text = once(text, rename,
              '            case "repair-dependencies" -> ProfileDependencyRepair.execute(\n'
              '                    home, target, options.confirmed(), options.json(), System.out);\n'
              + rename,
              "repair dispatch")
          for old, new, label in [
              ("    private static String callerIdentity() {", "    static String callerIdentity() {", "callerIdentity"),
              ("    private static Path backup(PreflightHome home, byte[] original) throws IOException {", "    static Path backup(PreflightHome home, byte[] original) throws IOException {", "backup"),
              ("    private static boolean replaceIfUnchanged(Path target, byte[] expected, byte[] replacement)", "    static boolean replaceIfUnchanged(Path target, byte[] expected, byte[] replacement)", "replaceIfUnchanged"),
              ("    private static void atomicWrite(Path target, String value) throws IOException {", "    static void atomicWrite(Path target, String value) throws IOException {", "atomicWrite"),
          ]:
              text = once(text, old, new, label)
          p.write_text(text)

          p = Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java")
          text = p.read_text()
          activate = '                "preflight profile activate <name> [--game <path>] [--launcher <path>] [--json] [--yes]",\n'
          text = once(text, activate,
              activate + '                "preflight profile repair-dependencies [--game <path>] [--launcher <path>] [--json] [--yes]",\n',
              "repair usage")
          marker = '                "  Rename and delete also preview by default. Applying them requires the exact profile",\n'
          text = once(text, marker,
              '                "  repair-dependencies previews direct installed-but-disabled requirements, preserves",\n'
              '                "  mod order, and applies that exact reviewed proposal only when repeated with --yes.",\n'
              + marker,
              "repair help")
          text = once(text,
              '            case "profile" -> "Save, inspect, rename, delete, and safely activate named enabled-mod profiles.";\n',
              '            case "profile" -> "Save, inspect, repair dependencies, rename, delete, and safely activate enabled-mod profiles.";\n',
              "profile summary")
          p.write_text(text)
      - name: Verify focused profile and compatibility tests
        run: ./mvnw --batch-mode --no-transfer-progress -pl preflight-cli -am -Dtest=ModCompatibilityPrecheckTest,ProfileCommandTest,ProfileDependencyRepairTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify Java correctness
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Commit verified files
        run: |
          rm .github/workflows/issue-557-repair.yml .github/workflows/issue-557-repair2.yml
          git config user.name "preflight-issue-557-bot"
          git config user.email "actions@users.noreply.github.com"
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/ProfileCommand.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/ProfileDependencyRepair.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/PreflightCli.java
          git add preflight-cli/src/test/java/dev/starsector/preflight/cli/ProfileDependencyRepairTest.java
          git add -u .github/workflows/issue-557-repair.yml .github/workflows/issue-557-repair2.yml
          git commit -m "Add reviewed dependency profile repair"
          git push origin HEAD:codex/issue-557-mod-compat-precheck
