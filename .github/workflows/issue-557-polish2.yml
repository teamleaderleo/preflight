name: Issue 557 contract polish retry

on:
  push:
    branches:
      - codex/issue-557-mod-compat-precheck
    paths:
      - .github/workflows/issue-557-polish2.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/issue-557-mod-compat-precheck
          fetch-depth: 0
      - uses: ./.github/actions/setup-build-jdk
      - name: Polish the shared readiness contract
        shell: python
        run: |
          from pathlib import Path

          path = Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/ModCompatibilityPrecheck.java")
          text = path.read_text()
          text = text.replace(
              "package dev.starsector.preflight.cli;\n\n",
              "package dev.starsector.preflight.cli;\n\n"
              "import dev.starsector.preflight.core.ModCompatibilityReadiness.Finding;\n"
              "import dev.starsector.preflight.core.ModCompatibilityReadiness.ProfileChange;\n"
              "import dev.starsector.preflight.core.ModCompatibilityReadiness.ReasonCode;\n"
              "import dev.starsector.preflight.core.ModCompatibilityReadiness.Result;\n"
              "import dev.starsector.preflight.core.ModCompatibilityReadiness.Severity;\n\n",
              1)

          contract_start = text.index("    static final String FORMAT")
          contract_end = text.index("    record Version", contract_start)
          text = text[:contract_start] + text[contract_end:]

          metadata_start = text.index("    record Metadata(")
          metadata_end = text.index("\n\n    private ModCompatibilityPrecheck", metadata_start)
          text = text[:metadata_start] + '''    record Metadata(
                  Path directory,
                  String id,
                  String name,
                  Version version,
                  String gameVersion,
                  List<String> missingFields,
                  List<Dependency> dependencies,
                  Long requiredMemoryMb) {}
          ''' + text[metadata_end:]

          production_start = text.index("    static Result inspect(Path installRoot) throws IOException {")
          evaluator_start = text.index("    static Result inspect(Path modsDirectory", production_start)
          production = '''    static Result inspect(Path installRoot) throws IOException {
              GameLayout layout;
              try {
                  layout = GameLayout.locate(installRoot);
              } catch (IOException unavailable) {
                  return unavailableProfileResult(installRoot, unavailable);
              }
              List<String> enabled;
              try {
                  enabled = readEnabled(layout.enabledModsFile());
              } catch (IOException | RuntimeException unavailable) {
                  return unavailableProfileResult(installRoot, unavailable);
              }
              JvmMemorySettings.Snapshot memory = JvmMemorySettings.inspect(layout.installRoot());
              Long heap = memory.available() && memory.maxHeapMiB() != null ? memory.maxHeapMiB().longValue() : null;
              return inspect(layout.modsDirectory(), enabled, null, heap);
          }

              static Result inspect(Path installRoot, LaunchTarget target) throws IOException {
                  GameLayout layout;
                  try {
                      layout = GameLayout.locate(installRoot);
                  } catch (IOException unavailable) {
                      return unavailableProfileResult(installRoot, unavailable);
                  }
                  List<String> enabled;
                  try {
                      enabled = readEnabled(layout.enabledModsFile());
                  } catch (IOException | RuntimeException unavailable) {
                      return unavailableProfileResult(installRoot, unavailable);
                  }
                  JvmMemorySettings.Snapshot memory = JvmMemorySettings.inspect(layout.installRoot(), target);
                  Long heap = memory.available() && memory.maxHeapMiB() != null ? memory.maxHeapMiB().longValue() : null;
                  return inspect(layout.modsDirectory(), enabled, null, heap);
              }

              private static Result unavailableProfileResult(Path installRoot, Exception failure) {
                  Finding finding = new Finding(
                          ReasonCode.ENABLED_MODS_UNAVAILABLE,
                          Severity.WARNING,
                          null,
                          null,
                          "Enabled-mod profile could not be established under "
                                  + installRoot.toAbsolutePath().normalize()
                                  + ": "
                                  + failure.getMessage());
                  return new Result(List.of(), List.of(finding), null, false, true);
              }

          '''

          parse_start = text.index("    private static Metadata parseMetadata", evaluator_start)
          evaluator = '''    static Result inspect(Path modsDirectory, List<String> enabledMods, String gameVersion, Long maxHeapMiB)
                  throws IOException {
              List<String> enabled = List.copyOf(new LinkedHashSet<>(enabledMods));
              Set<String> enabledSet = new LinkedHashSet<>(enabled);
              List<Finding> findings = new ArrayList<>();
              Map<String, List<Metadata>> providers = new LinkedHashMap<>();
              Set<String> partialReported = new LinkedHashSet<>();
              boolean evidenceComplete = true;

              if (Files.isDirectory(modsDirectory)) {
                  try (var entries = Files.list(modsDirectory)) {
                      for (Path directory : entries.filter(Files::isDirectory).sorted().toList()) {
                          Path info = directory.resolve("mod_info.json");
                          if (!Files.isRegularFile(info)) {
                              continue;
                          }
                          try {
                              Metadata metadata = parseMetadata(
                                      directory, Files.readString(info, StandardCharsets.UTF_8));
                              providers.computeIfAbsent(metadata.id(), ignored -> new ArrayList<>()).add(metadata);
                          } catch (IllegalArgumentException | IOException malformed) {
                              findings.add(new Finding(
                                      ReasonCode.METADATA_INVALID,
                                      Severity.WARNING,
                                      directory.getFileName().toString(),
                                      null,
                                      "Unreadable or invalid mod_info.json in "
                                              + directory.getFileName() + ": " + malformed.getMessage()));
                              evidenceComplete = false;
                          }
                      }
                  }
              }

              providers.values().forEach(list -> list.sort(
                      Comparator.comparing(metadata -> metadata.directory().toString())));
              for (Map.Entry<String, List<Metadata>> entry : providers.entrySet()) {
                  if (entry.getValue().size() > 1) {
                      findings.add(new Finding(
                              ReasonCode.DUPLICATE_MOD_ID,
                              Severity.ERROR,
                              entry.getKey(),
                              entry.getKey(),
                              "Multiple installed mods declare id '" + entry.getKey() + "': "
                                      + entry.getValue().stream()
                                              .map(value -> value.directory().getFileName().toString())
                                              .toList()));
                  }
              }

              LinkedHashSet<String> proposedEnable = new LinkedHashSet<>();
              long largestDeclaredMemoryMiB = 0;
              boolean anyValidMemory = false;
              for (String modId : enabled) {
                  List<Metadata> candidates = providers.get(modId);
                  if (candidates == null || candidates.isEmpty()) {
                      findings.add(new Finding(
                              ReasonCode.METADATA_ABSENT,
                              Severity.WARNING,
                              modId,
                              null,
                              "Enabled mod '" + modId + "' has no uniquely readable installed metadata"));
                      evidenceComplete = false;
                      continue;
                  }
                  if (candidates.size() != 1) {
                      continue;
                  }

                  Metadata metadata = candidates.get(0);
                  if (reportPartialMetadata(metadata, findings, partialReported)) {
                      evidenceComplete = false;
                  }
                  if (metadata.requiredMemoryMb() != null) {
                      if (metadata.requiredMemoryMb() <= 0) {
                          findings.add(new Finding(
                                  ReasonCode.MEMORY_REQUIREMENT_INVALID,
                                  Severity.WARNING,
                                  modId,
                                  null,
                                  "requiredMemoryMB must be positive; declared " + metadata.requiredMemoryMb()));
                          evidenceComplete = false;
                      } else {
                          largestDeclaredMemoryMiB = Math.max(largestDeclaredMemoryMiB, metadata.requiredMemoryMb());
                          anyValidMemory = true;
                      }
                  }

                  if (metadata.gameVersion() != null && !metadata.gameVersion().isBlank()) {
                      if (gameVersion == null || gameVersion.isBlank()) {
                          findings.add(new Finding(
                                  ReasonCode.GAME_VERSION_UNKNOWN,
                                  Severity.INFO,
                                  modId,
                                  null,
                                  "Mod declares game version " + metadata.gameVersion()
                                          + ", but the installed game version was not established"));
                          evidenceComplete = false;
                      } else if (!sameGameVersion(metadata.gameVersion(), gameVersion)) {
                          findings.add(new Finding(
                                  ReasonCode.GAME_VERSION_MISMATCH,
                                  Severity.WARNING,
                                  modId,
                                  null,
                                  "Mod declares Starsector " + metadata.gameVersion()
                                          + "; selected installation reports " + gameVersion));
                      }
                  }

                  for (Dependency dependency : metadata.dependencies()) {
                      List<Metadata> dependencyProviders = providers.get(dependency.id());
                      if (dependency.optional()) {
                          if (dependencyProviders == null || dependencyProviders.isEmpty()) {
                              findings.add(new Finding(
                                      ReasonCode.OPTIONAL_DEPENDENCY,
                                      Severity.INFO,
                                      modId,
                                      dependency.id(),
                                      "Optional dependency '" + dependency.id() + "' is not installed"));
                          }
                          continue;
                      }
                      if (dependencyProviders == null || dependencyProviders.isEmpty()) {
                          findings.add(new Finding(
                                  ReasonCode.REQUIRED_DEPENDENCY_MISSING,
                                  Severity.ERROR,
                                  modId,
                                  dependency.id(),
                                  "Required dependency '" + dependency.id() + "' is not installed"));
                          continue;
                      }
                      if (dependencyProviders.size() != 1) {
                          continue;
                      }

                      Metadata provider = dependencyProviders.get(0);
                      if (reportPartialMetadata(provider, findings, partialReported)) {
                          evidenceComplete = false;
                      }
                      if (!enabledSet.contains(dependency.id())) {
                          findings.add(new Finding(
                                  ReasonCode.REQUIRED_DEPENDENCY_DISABLED,
                                  Severity.ERROR,
                                  modId,
                                  dependency.id(),
                                  "Required dependency '" + dependency.id() + "' is installed but disabled"));
                          proposedEnable.add(dependency.id());
                      }
                      if (!compareVersion(modId, dependency, provider, findings)) {
                          evidenceComplete = false;
                      }
                  }
              }

              if (anyValidMemory) {
                  if (maxHeapMiB == null) {
                      findings.add(new Finding(
                              ReasonCode.MEMORY_REQUIREMENT_UNKNOWN,
                              Severity.INFO,
                              null,
                              null,
                              "Enabled mods declare up to " + largestDeclaredMemoryMiB
                                      + " MiB required memory; effective -Xmx was not established"));
                      evidenceComplete = false;
                  } else if (largestDeclaredMemoryMiB > maxHeapMiB) {
                      findings.add(new Finding(
                              ReasonCode.MEMORY_REQUIREMENT_EXCEEDS_HEAP,
                              Severity.WARNING,
                              null,
                              null,
                              "Largest enabled-mod requiredMemoryMB is " + largestDeclaredMemoryMiB
                                      + " MiB; effective -Xmx is " + maxHeapMiB + " MiB"));
                  }
              }

              findings.sort(Comparator
                      .comparing((Finding finding) -> finding.reason().code())
                      .thenComparing(finding -> nullSafe(finding.modId()))
                      .thenComparing(finding -> nullSafe(finding.subjectId()))
                      .thenComparing(Finding::summary));

              ProfileChange change = null;
              if (!proposedEnable.isEmpty()) {
                  List<String> additions = proposedEnable.stream().sorted().toList();
                  List<String> after = new ArrayList<>(enabled);
                  after.addAll(additions);
                  change = new ProfileChange(enabled, after, additions);
              }
              return new Result(enabled, findings, change, evidenceComplete, true);
          }

          '''
          text = text[:production_start] + production + evaluator + text[parse_start:]

          parse_start = text.index("    private static Metadata parseMetadata")
          parse_version_start = text.index("    private static Version parseVersion", parse_start)
          parse_and_compare = '''    private static Metadata parseMetadata(Path directory, String json) {
              Object root = new Parser(json).parse();
              if (!(root instanceof Map<?, ?> raw)) {
                  throw new IllegalArgumentException("metadata root must be an object");
              }
              Map<String, Object> values = stringMap(raw);
              String id = requiredString(values, "id");
              String name = optionalString(values.get("name"));
              Version version = parseVersion(values.get("version"));
              String gameVersion = optionalString(values.get("gameVersion"));
              List<String> missingFields = new ArrayList<>();
              if (name == null || name.isBlank()) missingFields.add("name");
              if (version == null) missingFields.add("version");
              if (gameVersion == null || gameVersion.isBlank()) missingFields.add("gameVersion");
              Long memory = optionalLong(values.get("requiredMemoryMB"));
              List<Dependency> dependencies = new ArrayList<>();
              Object declared = values.get("dependencies");
              if (declared != null) {
                  if (!(declared instanceof List<?> list)) {
                      throw new IllegalArgumentException("dependencies must be an array");
                  }
                  for (Object entry : list) {
                      if (!(entry instanceof Map<?, ?> dependencyRaw)) {
                          throw new IllegalArgumentException("dependency entries must be objects");
                      }
                      Map<String, Object> dependency = stringMap(dependencyRaw);
                      dependencies.add(new Dependency(
                              requiredString(dependency, "id"),
                              optionalString(dependency.get("name")),
                              parseVersion(dependency.get("version")),
                              Boolean.TRUE.equals(dependency.get("optional"))));
                  }
              }
              return new Metadata(
                      directory,
                      id,
                      name,
                      version,
                      gameVersion,
                      List.copyOf(missingFields),
                      List.copyOf(dependencies),
                      memory);
          }

              private static boolean reportPartialMetadata(
                      Metadata metadata, List<Finding> findings, Set<String> reported) {
                  if (metadata.missingFields().isEmpty()) {
                      return false;
                  }
                  if (reported.add(metadata.id())) {
                      findings.add(new Finding(
                              ReasonCode.METADATA_PARTIAL,
                              Severity.WARNING,
                              metadata.id(),
                              null,
                              "Metadata is missing compatibility fields: "
                                      + String.join(", ", metadata.missingFields())));
                  }
                  return true;
              }

              /** Returns false only when the declaration uses version semantics this pass cannot establish. */
              private static boolean compareVersion(
                      String dependentId, Dependency dependency, Metadata provider, List<Finding> findings) {
                  if (dependency.version() == null || provider.version() == null) {
                      return true;
                  }
                  Version required = dependency.version();
                  Version actual = provider.version();
                  if (!required.hasNumericMajor() || !actual.hasNumericMajor()) {
                      if (!required.raw().equals(actual.raw())) {
                          findings.add(new Finding(
                                  ReasonCode.DEPENDENCY_VERSION_ADVISORY,
                                  Severity.WARNING,
                                  dependentId,
                                  dependency.id(),
                                  "Dependency version declaration '" + required.raw()
                                          + "' does not match installed '" + actual.raw()
                                          + "'; unsupported range semantics remain advisory"));
                          return false;
                      }
                      return true;
                  }
                  if (!required.major().equals(actual.major())) {
                      findings.add(new Finding(
                              ReasonCode.DEPENDENCY_VERSION_MAJOR_MISMATCH,
                              Severity.ERROR,
                              dependentId,
                              dependency.id(),
                              "Dependency requires major version " + required.major()
                                      + "; installed version is " + actual.raw()));
                      return true;
                  }
                  if ((required.minor() != null && actual.minor() != null
                                  && !required.minor().equals(actual.minor()))
                          || (required.patch() != null && actual.patch() != null
                                  && !required.patch().equals(actual.patch()))) {
                      findings.add(new Finding(
                              ReasonCode.DEPENDENCY_VERSION_ADVISORY,
                              Severity.WARNING,
                              dependentId,
                              dependency.id(),
                              "Dependency declares version " + required.raw()
                                      + "; installed version is " + actual.raw()));
                  }
                  return true;
              }

          '''
          text = text[:parse_start] + parse_and_compare + text[parse_version_start:]
          path.write_text(text)

          presenter = Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/ModCompatibilityPresenter.java")
          presenter.write_text('''package dev.starsector.preflight.cli;

          import dev.starsector.preflight.core.ModCompatibilityReadiness.Finding;
          import dev.starsector.preflight.core.ModCompatibilityReadiness.ProfileChange;
          import dev.starsector.preflight.core.ModCompatibilityReadiness.Result;
          import dev.starsector.preflight.core.ModCompatibilityReadiness.Severity;
          import java.io.PrintStream;
          import java.util.List;
          import java.util.Locale;

          /** Human view of metadata readiness; informational evidence stays available in the typed result. */
          final class ModCompatibilityPresenter {
              private ModCompatibilityPresenter() {
              }

              static void print(Result result, PrintStream out) {
                  List<Finding> visible = result.findings().stream()
                          .filter(finding -> finding.severity() != Severity.INFO)
                          .toList();
                  ProfileChange change = result.suggestedProfileChange();
                  if (visible.isEmpty() && change == null) {
                      return;
                  }
                  out.println("Mod metadata readiness:");
                  for (Finding finding : visible) {
                      out.printf(
                              Locale.ROOT,
                              "  %-7s %-38s %s%n",
                              finding.severity().name().toLowerCase(Locale.ROOT),
                              finding.reason().code(),
                              finding.summary());
                  }
                  if (change != null) {
                      out.println("  reviewed profile change available; current profile remains unchanged:");
                      out.println("    before: " + change.before());
                      out.println("    enable: " + change.enable());
                      out.println("    after:  " + change.after());
                      out.println("    applying this change requires an explicit profile/settings action; dependency chains stay untouched.");
                  }
                  out.println("  launch remains available; this metadata pass does not change the profile or installed mods.");
              }
          }
          ''')

          for command_path in [
              Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/RunCommand.java"),
              Path("preflight-cli/src/main/java/dev/starsector/preflight/cli/PrepareCommand.java")]:
              command = command_path.read_text().replace(
                  "ModCompatibilityPrecheck.Result modReadiness =\n", "var modReadiness =\n")
              command_path.write_text(command)

          test = Path("preflight-cli/src/test/java/dev/starsector/preflight/cli/ModCompatibilityPrecheckTest.java")
          t = test.read_text()
          t = t.replace(
              "import static org.junit.jupiter.api.Assertions.assertTrue;\n\n",
              "import static org.junit.jupiter.api.Assertions.assertTrue;\n\n"
              "import dev.starsector.preflight.core.ModCompatibilityReadiness;\n"
              "import dev.starsector.preflight.core.ModCompatibilityReadiness.ReasonCode;\n"
              "import dev.starsector.preflight.core.ModCompatibilityReadiness.Severity;\n",
              1)
          t = t.replace("ModCompatibilityPrecheck.ReasonCode.", "ReasonCode.")
          t = t.replace("ModCompatibilityPrecheck.Severity.", "Severity.")
          t = t.replace("ModCompatibilityPrecheck.ReasonCode reason", "ReasonCode reason")
          t = t.replace("ModCompatibilityPrecheck.Result result", "ModCompatibilityReadiness.Result result")
          t = t.replace(".toMap()", ".toPublicMap()")
          t = t.replace(
              '        assertEquals(Boolean.TRUE, result.toPublicMap().get("launchAllowed"));\n',
              '        assertFalse(result.evidenceComplete());\n        assertTrue(result.launchAllowed());\n')

          marker = "    @Test\n    void optionalDependencyStaysInformational() throws Exception {\n"
          if t.count(marker) != 1:
              raise SystemExit("optional test marker drifted")
          addition = '''    @Test
              void malformedEnabledProfileIsAdvisoryAndLaunchable() throws Exception {
                  Path install = temp.resolve("malformed-profile");
                  Path mods = install.resolve("mods");
                  Files.createDirectories(mods);
                  Files.writeString(mods.resolve("enabled_mods.json"), "{broken", StandardCharsets.UTF_8);

                  var result = ModCompatibilityPrecheck.inspect(install);

                  assertReason(result, ReasonCode.ENABLED_MODS_UNAVAILABLE);
                  assertFalse(result.hasErrors());
                  assertFalse(result.evidenceComplete());
                  assertTrue(result.launchAllowed());
              }

              @Test
              void partialCompatibilityMetadataIsVisible() throws Exception {
                  Path mods = mods();
                  mod(mods, "partial", "{\"id\":\"partial\",\"name\":\"Partial\",\"gameVersion\":\"0.98a-RC8\"}");

                  var result = ModCompatibilityPrecheck.inspect(
                          mods, List.of("partial"), "0.98a-RC8", 4096L);

                  assertReason(result, ReasonCode.METADATA_PARTIAL);
                  assertFalse(result.evidenceComplete());
                  assertTrue(result.launchAllowed());
              }

              @Test
              void invalidMemoryDeclarationStaysAdvisoryAndIncomplete() throws Exception {
                  Path mods = mods();
                  mod(mods, "odd-memory", """
                          {"id":"odd-memory","name":"Odd Memory","version":"1","gameVersion":"0.98a-RC8",
                           "requiredMemoryMB":0}
                          """);

                  var result = ModCompatibilityPrecheck.inspect(
                          mods, List.of("odd-memory"), "0.98a-RC8", 4096L);

                  assertReason(result, ReasonCode.MEMORY_REQUIREMENT_INVALID);
                  assertFalse(result.hasErrors());
                  assertFalse(result.evidenceComplete());
                  assertTrue(result.launchAllowed());
              }

          '''
          test.write_text(t.replace(marker, addition + marker, 1))
      - name: Verify Java correctness
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Commit verified named files
        run: |
          rm .github/workflows/issue-557-polish.yml
          rm .github/workflows/issue-557-polish2.yml
          git config user.name "preflight-issue-557-bot"
          git config user.email "actions@users.noreply.github.com"
          git add preflight-core/src/main/java/dev/starsector/preflight/core/ModCompatibilityReadiness.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/ModCompatibilityPrecheck.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/ModCompatibilityPresenter.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/RunCommand.java
          git add preflight-cli/src/main/java/dev/starsector/preflight/cli/PrepareCommand.java
          git add preflight-cli/src/test/java/dev/starsector/preflight/cli/ModCompatibilityPrecheckTest.java
          git add -u .github/workflows/issue-557-polish.yml .github/workflows/issue-557-polish2.yml
          git commit -m "Polish mod compatibility readiness contract"
          git push origin HEAD:codex/issue-557-mod-compat-precheck
