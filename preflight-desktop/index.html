<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7efe2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030711" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="A performance launcher for Starsector"
    />
    <title>Preflight</title>
    <!--
      Settle the theme before the first paint. Every dark rule is written against
      :root[data-theme="dark"], so until that attribute exists the document is light -- and React
      can only set it after mounting, which is one full paint too late.

      This must remain a blocking classic script in the head. It lives in public/ rather than
      inline so the packaged Tauri CSP can keep script execution restricted to same-origin files.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
