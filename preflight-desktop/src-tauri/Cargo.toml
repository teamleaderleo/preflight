[package]
name = "starsector-preflight-desktop"
version = "0.1.0"
description = "A friendly desktop launch companion for Starsector Preflight"
authors = ["Starsector Preflight contributors"]
license = "MIT"
repository = "https://github.com/teamleaderleo/starsector-preflight"
edition = "2024"
rust-version = "1.85"

[lib]
name = "starsector_preflight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
