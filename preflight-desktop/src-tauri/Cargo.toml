[package]
name = "starsector-preflight-desktop"
version = "0.1.0"
description = "A desktop performance launcher for Starsector"
authors = ["Preflight contributors"]
license = "MIT"
repository = "https://github.com/teamleaderleo/preflight"
edition = "2024"
rust-version = "1.85"

[lib]
name = "starsector_preflight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-stream = "0.3.6"
futures-util = "0.3.31"
getrandom = "0.3.4"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.9.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "sync"] }
url = "2.5.7"
